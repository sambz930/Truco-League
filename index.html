      height: calc(100dvh - 5.8rem);
      min-height: 0;
    }
    .jugar-board {
      display: grid;
      grid-template-columns: minmax(0,1fr) minmax(0,1fr);
      gap: 6px;
      flex: 1;
      min-height: 0;
    }
    .jugar-team {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: rgba(2, 12, 27, .78);
      border: 1px solid rgba(51,65,85,.6);
      border-radius: 20px;
      overflow: hidden;
      position: relative;
    }
    .jugar-team::after {
      content: '';
      position: absolute;
      top: 0; bottom: 0; right: -5px;
      width: 1px;
      background: rgba(15,23,42,.9);
      pointer-events: none;
    }
    .jugar-team:last-child::after { display:none; }
    .jugar-team-head {
      min-height: 3.25rem;
      padding: .45rem .65rem;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      background: rgba(15,23,42,.92);
      border-bottom:1px solid rgba(51,65,85,.7);
      container-type:inline-size;
      -webkit-text-size-adjust:100%;
      text-size-adjust:100%;
    }
    .jugar-team-name {
      min-width:0;
      flex:1 1 auto;
      font-size: 13px;
      font-size: clamp(8px, 7.2cqw, 13px);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .05em;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      line-height:1.05;
    }
    .jugar-score {
      flex:0 0 auto;
      font-size: 34px;
      font-size: clamp(24px, 19cqw, 38px);
      line-height:1;
      font-weight: 950;
      font-variant-numeric: tabular-nums;
      color:#34d399;
      -webkit-text-size-adjust:100%;
      text-size-adjust:100%;
    }
    .jugar-team:first-child .jugar-team-name { color:#fbbf24; }
    .jugar-team:first-child .jugar-score { color:#34d399; }
    .jugar-team:last-child .jugar-team-name { color:#22d3ee; }
    .jugar-team-actions { display:flex; gap:.3rem; flex:0 0 auto; }
    .jugar-mini-btn {

      background:rgba(2,6,23,.7);

    .jugar-count-area {
      flex:1;
      min-height:0;

      grid-template-rows: 1fr 1fr;
    }

      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:8px 10px;

      justify-content:center;

      font-weight:800;
      letter-spacing:.12em;
      text-transform:uppercase;
      color:#475569;
      margin-top:8px;

    .jugar-bottom {

      grid-template-columns:1fr auto;
      gap:8px;
      margin-top:8px;
      padding-top:8px;

    .jugar-load-btn {

      font-size:10px;
      font-weight:900;
      color:#94a3b8;

    .jugar-team-selects { display:grid; grid-template-columns:1fr 1fr; gap:7px; }

      .jugar-mini-btn { width:1.55rem; height:1.55rem; font-size:.72rem; border-radius:.45rem; }

      .jugar-count-area { min-height: 0; }

      .jugar-stick-box {
        width: clamp(50px, min(17vw, 9dvh), 72px);
        height: clamp(50px, min(17vw, 9dvh), 72px);
        border-radius:11px;
        border-width:1px;
      }
      .jugar-stick-box svg { width:94%; height:94%; }
      .jugar-sticks { gap:4px; }
      .jugar-gesture { display:none; }
      .jugar-bottom { grid-template-columns:1fr; gap:5px; margin-top:6px; padding-top:6px; }
      .jugar-status { order:-1; min-height:24px; padding:0 8px; border-radius:10px; font-size:9px; }
      .jugar-load-btn { min-height:46px; border-radius:12px; font-size:13px; }
      .jugar-select-row { grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:5px; }
      .jugar-select-row > div:last-child { grid-column:1 / -1; }
      .jugar-team-selects { grid-template-columns:1fr 1fr; gap:4px; }
      .jugar-team-selects.three { grid-template-columns:1fr 1fr 1fr; }

    @media (max-width: 380px) {
      .jugar-shell { min-height: calc(100dvh - 8.8rem); }
      .jugar-stick-box { width:52px; height:52px; }
      .jugar-team-name { font-size:clamp(8px, 7cqw, 10px); }

    }

    @media (min-width: 1280px) {
      .jugar-shell { max-width: 1280px; }
    }
  </style>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback, useRef } = React;

    // Configuración de Enlace Externo opcional
    const EXTERNAL_LINK_URL = "https://f7015652.truco-league.pages.dev/"; 
    const EXTERNAL_LINK_LABEL = "🌐 JUGAR ONLINE";

    const DEFAULT_JUGADORES = ["SAMU"];
    const ADMIN_EMAIL = "benitezsamuel930@gmail.com";
    const SEASON_DAYS = 45; // Duración de cada temporada en días
    const REQUIRE_VERIFIED_EMAIL = true;
    const MATCH_SCHEMA_VERSION = 2;

    const makeId = (prefix='id') => {
      try { return `${prefix}_${crypto.randomUUID()}`; } catch(e) { return `${prefix}_${Date.now()}_${Math.random().toString(36).slice(2,10)}`; }
    };

    const normalizePlayerName = value => String(value || '').trim().toUpperCase();
    const matchParticipants = p => ({
      winners: (p?.ganadores || (p?.ganador ? [p.ganador] : [])).map(normalizePlayerName).filter(Boolean),
      losers: (p?.perdedores || (p?.perdedor ? [p.perdedor] : [])).map(normalizePlayerName).filter(Boolean)
    });

    const validateMatchRecord = (p, knownPlayers = []) => {
      const issues = [];
      const { winners, losers } = matchParticipants(p);
      const allPlayers = [...winners, ...losers];
      const scoreW = Number(p?.ptsGanador);
      const scoreL = Number(p?.ptsPerdedor);
      const expectedSize = p?.tipo === '1v1' ? 1 : p?.tipo === '2v2' ? 2 : p?.tipo === '3v3' ? 3 : 0;
      const expectedAward = p?.tipo === '1v1' ? 1 : (p?.tipo === '2v2' || p?.tipo === '3v3' ? 2 : 0);
      if (!p || !['1v1','2v2','3v3'].includes(p.tipo)) issues.push('Tipo inválido');
      if (!expectedSize || winners.length !== expectedSize || losers.length !== expectedSize) issues.push('Cantidad de jugadores inválida');
      if (allPlayers.length !== new Set(allPlayers).size) issues.push('Hay jugadores repetidos');
      if (winners.some(x => losers.includes(x))) issues.push('Jugador en ambos equipos');
      if (!Number.isFinite(scoreW) || !Number.isFinite(scoreL) || scoreW < 0 || scoreL < 0 || scoreW > 30 || scoreL > 30 || scoreW <= scoreL) issues.push('Marcador inválido');
      if (Number.isFinite(scoreW) && Number.isFinite(scoreL) && Number(p?.ventaja) !== scoreW - scoreL) issues.push('Ventaja no coincide con el marcador');
      if (expectedAward && Number(p?.puntosGanadorPorJugador || 0) !== expectedAward) issues.push('Puntos por ganador inválidos');
      if (p?.estado === 'APROBADA' && !p?.aprobadoAt) issues.push('Aprobada sin auditoría');
      if (knownPlayers.length) {
        const known = new Set(knownPlayers.map(normalizePlayerName));
        allPlayers.forEach(name => { if (!known.has(name)) issues.push(`Jugador inexistente: ${name}`); });
      }
      if (!p?.seasonNumber) issues.push('Sin temporada');
      if (Number(p?.schemaVersion || 0) < MATCH_SCHEMA_VERSION) issues.push('Esquema antiguo');
      return Array.from(new Set(issues));
    };

    // Formateador de fecha estándar ISO local YYYY-MM-DD
    const getTodayDateString = () => {
      const today = new Date();
      const year = today.getFullYear();
      const month = String(today.getMonth() + 1).padStart(2, '0');
      const day = String(today.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    };

    // Componentes Iconos
    const IconShield = () => (
      <svg className="w-4 h-4 text-emerald-400 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
      </svg>
    );

    const IconPlus = () => (
      <svg className="w-5 h-5 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"/>
      </svg>
    );

    const IconTrash = () => (
      <svg className="w-4 h-4 text-red-400 hover:text-red-300 transition-colors inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
      </svg>
    );

    const IconDownload = () => (
      <svg className="w-4 h-4 inline-block mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
      </svg>
    );

    const IconExternalLink = () => (
      <svg className="w-4 h-4 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
      </svg>
    );

    // Componente visual para cerillos/palitos de Truco Argentino (0 a 5 por cajita).
    // Cada palito tiene cuerpo de madera, punta roja y volumen visual para parecer un cerillo real.
    const FosforosBox = ({ count }) => {
      const c = Math.min(5, Math.max(0, Number(count) || 0));

      const Match = ({ x1, y1, x2, y2, crossed = false }) => (
        <g>
          <line
            x1={x1} y1={y1} x2={x2} y2={y2}
            stroke={crossed ? '#f59e0b' : '#f7c65a'}
            strokeWidth="9.5"
            strokeLinecap="round"
          />
          <line
            x1={x1} y1={y1 + 0.7} x2={x2} y2={y2 + 0.7}
            stroke="#d99a2b"
            strokeWidth="2.2"
            strokeLinecap="round"
            opacity=".8"
          />
          <circle cx={x1} cy={y1} r="6.6" fill="#ef4444" stroke="#b91c1c" strokeWidth=".8" />
          <circle cx={x2} cy={y2} r="6.6" fill="#ef4444" stroke="#b91c1c" strokeWidth=".8" />
          <circle cx={x1 - .7} cy={y1 - .7} r="1.9" fill="#fecaca" opacity=".8" />
          <circle cx={x2 - .7} cy={y2 - .7} r="1.9" fill="#fecaca" opacity=".8" />
        </g>
      );

      return (
        <div className="jugar-stick-box" aria-hidden="true">
          <svg viewBox="0 0 100 100" fill="none" role="img" aria-label={`${c} cerillos`}>
            {c >= 1 && <Match x1="12" y1="12" x2="88" y2="12" />}
            {c >= 2 && <Match x1="88" y1="12" x2="88" y2="88" />}
            {c >= 3 && <Match x1="88" y1="88" x2="12" y2="88" />}
            {c >= 4 && <Match x1="12" y1="88" x2="12" y2="12" />}
            {c >= 5 && <Match x1="12" y1="12" x2="88" y2="88" crossed />}
          </svg>
        </div>
      );
    };

    // Anotador de Truco Argentino: tablero táctil compacto, inspirado en la referencia móvil.
    const AnotadorTruco = ({ puntos, onChange, label }) => {
      const p = Math.min(30, Math.max(0, Number(puntos) || 0));
      const malas = Math.min(15, p);
      const buenas = p > 15 ? p - 15 : 0;

      const renderBoxes = (pts) => [0,1,2].map(i => {
        const valInBox = Math.min(5, Math.max(0, pts - (i * 5)));
        return <FosforosBox key={i} count={valInBox} />;
      });

      const addPoint = () => onChange(Math.min(30, p + 1));
      const removePoint = () => onChange(Math.max(0, p - 1));

      return (
        <section className="jugar-team" aria-label={`Marcador de ${label}`}>
          <div className="jugar-team-head">
            <div className="min-w-0 flex-1">
              <div className="jugar-team-name">{label}</div>
            </div>
            <div className="flex items-center gap-2">
              <div className="jugar-team-actions">
                <button type="button" className="jugar-mini-btn" onClick={removePoint} disabled={p <= 0} aria-label={`Restar 1 a ${label}`}>−</button>
                <button type="button" className="jugar-mini-btn plus" onClick={addPoint} disabled={p >= 30} aria-label={`Sumar 1 a ${label}`}>+</button>
              </div>
              <span className="jugar-score">{p}</span>
            </div>
          </div>

          <div className="jugar-count-area">
            <button type="button" className="jugar-zone bad" onClick={addPoint} disabled={p >= 30} aria-label={`Tocar para sumar un punto a ${label}`}>
              <span className="jugar-zone-label">MALAS · {malas}/15</span>
              <div className="jugar-sticks">{renderBoxes(malas)}</div>
              <span className="jugar-gesture">TOCAR +1</span>
            </button>
            <button type="button" className="jugar-zone good" onClick={addPoint} disabled={p >= 30} aria-label={`Tocar para sumar un punto a ${label}`}>
              <span className="jugar-zone-label">BUENAS · {buenas}/15</span>
              <div className="jugar-sticks">{renderBoxes(buenas)}</div>
              <span className="jugar-gesture">TOCAR +1</span>
            </button>
          </div>
        </section>
      );
    };

    function App() {
      // La identidad se obtiene exclusivamente de Firebase Authentication. Nunca se usa localStorage como sesión.
      const [currentUser, setCurrentUser] = useState(null);
      const [authReady, setAuthReady] = useState(false);

      useEffect(() => {
        const { auth, onAuthStateChanged } = window.TrucoDB || {};
        if (!auth || !onAuthStateChanged) return;
        return onAuthStateChanged(auth, async (firebaseUser) => {
          if (!firebaseUser) { setCurrentUser(null); setAuthReady(true); return; }
          const isAdmin = String(firebaseUser.email || '').toLowerCase() === ADMIN_EMAIL.toLowerCase();
          if (isAdmin) {
            setCurrentUser({ uid:firebaseUser.uid, email:firebaseUser.email, jugadorNombre:'SAMU', isAdmin:true, emailVerified:true });
            setAuthReady(true); return;
          }
          try {
            const { db, appId, doc, getDoc } = window.TrucoDB || {};
            const snap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'cuentas', firebaseUser.uid));
            const profile = snap.exists() ? snap.data() : null;
            if (!profile || profile.role !== 'JUGADOR' || profile.estado !== 'APROBADO') { setCurrentUser(null); setAuthReady(true); return; }
            if (REQUIRE_VERIFIED_EMAIL && !firebaseUser.emailVerified) { setCurrentUser(null); setAuthReady(true); return; }
            setCurrentUser({ uid:firebaseUser.uid, email:firebaseUser.email, jugadorNombre:normalizePlayerName(profile.nombre), isAdmin:false, emailVerified:firebaseUser.emailVerified });
          } catch (err) {
            console.warn('[Truco League] Perfil autenticado no disponible:', err?.message || err); setCurrentUser(null);
          } finally { setAuthReady(true); }
        });
      }, []);

      // Estado de Jugadores y Cuentas. Las cuentas solo se cargan para ADMIN.
      const [jugadores, setJugadores] = useState(DEFAULT_JUGADORES);
      const [jugadoresOcultos, setJugadoresOcultos] = useState([]);
      const [cuentas, setCuentas] = useState([]);

      // Estado de Partidas Totales
      // La fuente de verdad de partidas es Firestore. El navegador solo conserva la cola offline explícita.
      const [partidas, setPartidas] = useState([]);

      // H2H es derivado de partidas aprobadas; no se guarda un contador mutable.

      // Control de Temporadas de 45 días
      const [seasonConfig, setSeasonConfig] = useState(() => {
        try {
          const saved = localStorage.getItem('truco_league_season_config');
          if (saved) return JSON.parse(saved);
        } catch(e) {}
        return {
          seasonNumber: 1,
          startDate: new Date().toISOString(),
          durationDays: SEASON_DAYS
        };
      });

      useEffect(() => {
        try { localStorage.setItem('truco_league_season_config', JSON.stringify(seasonConfig)); } catch(e){}
      }, [seasonConfig]);

      // Limpieza automática de datos TEMPORALES locales. Nunca toca partidas, cuentas, H2H ni configuración de temporada.
      useEffect(() => {
        const now = Date.now();
        try {
          const draftRaw = localStorage.getItem('truco_league_jugar_draft_v2');
          if (draftRaw) {
            const draft = JSON.parse(draftRaw);
            if (!draft?.updatedAt || now - Number(draft.updatedAt) > 3 * 24 * 60 * 60 * 1000) {
              localStorage.removeItem('truco_league_jugar_draft_v2');
            }
          }

          const queueRaw = localStorage.getItem('truco_league_offline_queue');
          if (queueRaw) {
            const queue = JSON.parse(queueRaw);
            const freshQueue = Array.isArray(queue)
              ? queue.filter(item => {
                  const ts = Number(item?.timestamp || item?.updatedAt || item?.createdAt || 0);
                  return !ts || now - ts <= 7 * 24 * 60 * 60 * 1000;
                })
              : [];
            localStorage.setItem('truco_league_offline_queue', JSON.stringify(freshQueue));
          }

          Object.keys(localStorage)
            .filter(key => key.startsWith('truco_league_ranking_snapshot_v1_'))
            .filter(key => !key.endsWith(`_${seasonConfig.seasonNumber}`))
            .forEach(key => localStorage.removeItem(key));
        } catch (e) {
          console.warn('[Truco League] No se pudieron limpiar datos temporales locales:', e);
        }
      }, [seasonConfig.seasonNumber]);

      const [auditLogs, setAuditLogs] = useState([]);
      const [historicalSeasons, setHistoricalSeasons] = useState([]);
      const [nuevoJugador, setNuevoJugador] = useState('');
      const [jugadorRenombrar, setJugadorRenombrar] = useState('');
      const [nuevoNombreJugador, setNuevoNombreJugador] = useState('');
      const [renombrandoJugador, setRenombrandoJugador] = useState(false);
      const [activeTab, setActiveTab] = useState('ranking');

      // Estado de conectividad y partidas que esperan sincronización.
      const [isOnline, setIsOnline] = useState(() => navigator.onLine !== false);
      const [offlineQueue, setOfflineQueue] = useState(() => {
        try {
          const saved = localStorage.getItem('truco_league_offline_queue');
          return saved ? JSON.parse(saved) : [];
        } catch (e) {
          return [];
        }
      });

      useEffect(() => {
        try { localStorage.setItem('truco_league_offline_queue', JSON.stringify(offlineQueue)); } catch(e) {}
      }, [offlineQueue]);

      useEffect(() => {
        const goOnline = () => setIsOnline(true);
        const goOffline = () => setIsOnline(false);
        window.addEventListener('online', goOnline);
        window.addEventListener('offline', goOffline);
        return () => {
          window.removeEventListener('online', goOnline);
          window.removeEventListener('offline', goOffline);
        };
      }, []);

      // Modo Carga (1v1, 2v2 o 3v3)
      const [modoPartida, setModoPartida] = useState('1v1');
      const [showConfirmLoad, setShowConfirmLoad] = useState(false);

      // 1v1
      const [jugador1, setJugador1] = useState('SAMU');
      const [jugador2, setJugador2] = useState('');
      const [ptsJ1, setPtsJ1] = useState(0);
      const [ptsJ2, setPtsJ2] = useState(0);

      // 2v2
      const [e1j1, setE1j1] = useState('SAMU');
      const [e1j2, setE1j2] = useState('');
      const [e2j1, setE2j1] = useState('');
      const [e2j2, setE2j2] = useState('');
      const [ptsE1, setPtsE1] = useState(0);
      const [ptsE2, setPtsE2] = useState(0);

      // 3v3
      const [t1j1, setT1j1] = useState('SAMU');
      const [t1j2, setT1j2] = useState('');
      const [t1j3, setT1j3] = useState('');
      const [t2j1, setT2j1] = useState('');
      const [t2j2, setT2j2] = useState('');
      const [t2j3, setT2j3] = useState('');
      const [ptsT1, setPtsT1] = useState(0);
      const [ptsT2, setPtsT2] = useState(0);

      // Borrador local del anotador: sobrevive a F5, cierre de pestaña y reinicio accidental.
      const jugarDraftReady = useRef(false);
      const [jugarDraftRecuperado, setJugarDraftRecuperado] = useState(false);

      useEffect(() => {
        try {
          const raw = localStorage.getItem('truco_league_jugar_draft_v2');
          if (raw) {
            const d = JSON.parse(raw);
            if (d && typeof d === 'object') {
              if (d.modoPartida) setModoPartida(d.modoPartida);
              if (typeof d.jugador1 === 'string') setJugador1(d.jugador1);
              if (typeof d.jugador2 === 'string') setJugador2(d.jugador2);
              if (Number.isFinite(d.ptsJ1)) setPtsJ1(Math.min(30, Math.max(0, d.ptsJ1)));
              if (Number.isFinite(d.ptsJ2)) setPtsJ2(Math.min(30, Math.max(0, d.ptsJ2)));
              if (typeof d.e1j1 === 'string') setE1j1(d.e1j1);
              if (typeof d.e1j2 === 'string') setE1j2(d.e1j2);
              if (typeof d.e2j1 === 'string') setE2j1(d.e2j1);
              if (typeof d.e2j2 === 'string') setE2j2(d.e2j2);
              if (Number.isFinite(d.ptsE1)) setPtsE1(Math.min(30, Math.max(0, d.ptsE1)));
              if (Number.isFinite(d.ptsE2)) setPtsE2(Math.min(30, Math.max(0, d.ptsE2)));
              if (typeof d.t1j1 === 'string') setT1j1(d.t1j1);
              if (typeof d.t1j2 === 'string') setT1j2(d.t1j2);
              if (typeof d.t1j3 === 'string') setT1j3(d.t1j3);
              if (typeof d.t2j1 === 'string') setT2j1(d.t2j1);
              if (typeof d.t2j2 === 'string') setT2j2(d.t2j2);
              if (typeof d.t2j3 === 'string') setT2j3(d.t2j3);
              if (Number.isFinite(d.ptsT1)) setPtsT1(Math.min(30, Math.max(0, d.ptsT1)));
              if (Number.isFinite(d.ptsT2)) setPtsT2(Math.min(30, Math.max(0, d.ptsT2)));
              setJugarDraftRecuperado(Boolean(d.modoPartida || d.ptsJ1 || d.ptsJ2 || d.ptsE1 || d.ptsE2 || d.ptsT1 || d.ptsT2));
            }
          }
        } catch (e) {
          console.warn('No se pudo recuperar el borrador de JUGAR:', e);
        } finally {
          jugarDraftReady.current = true;
        }
      }, []);

      useEffect(() => {
        if (!jugarDraftReady.current) return;
        try {
          localStorage.setItem('truco_league_jugar_draft_v2', JSON.stringify({
            version: 2,
            updatedAt: Date.now(),
            modoPartida,
            jugador1, jugador2, ptsJ1, ptsJ2,
            e1j1, e1j2, e2j1, e2j2, ptsE1, ptsE2,
            t1j1, t1j2, t1j3, t2j1, t2j2, t2j3, ptsT1, ptsT2
          }));
        } catch (e) {
          console.warn('No se pudo guardar el borrador de JUGAR:', e);
        }
      }, [modoPartida, jugador1, jugador2, ptsJ1, ptsJ2, e1j1, e1j2, e2j1, e2j2, ptsE1, ptsE2, t1j1, t1j2, t1j3, t2j1, t2j2, t2j3, ptsT1, ptsT2]);

      const limpiarBorradorJugar = useCallback(() => {
        try { localStorage.removeItem('truco_league_jugar_draft_v2'); } catch (e) {}
        setJugarDraftRecuperado(false);
      }, []);

      // Vista PC/Móvil
      const [deviceMode, setDeviceMode] = useState(() => {
        try { return localStorage.getItem('truco_league_device') || null; } catch (e) { return null; }
      });
      const [showDeviceModal, setShowDeviceModal] = useState(() => !localStorage.getItem('truco_league_device'));

      const handleSelectDevice = (mode) => {
        setDeviceMode(mode);
        try { localStorage.setItem('truco_league_device', mode); } catch (e) {}
        setShowDeviceModal(false);
      };

      // Modales y Respuestas
      const [showLoginModal, setShowLoginModal] = useState(false);
      const [authMode, setAuthMode] = useState('LOGIN');
      const [loginEmailInput, setLoginEmailInput] = useState('');
      const [loginPasswordInput, setLoginPasswordInput] = useState('');

      const [regEmailConfirmInput, setRegEmailConfirmInput] = useState('');
      const [regPasswordConfirmInput, setRegPasswordConfirmInput] = useState('');
      const [regNombreInput, setRegNombreInput] = useState('');

      const [feedback, setFeedback] = useState('');
      const [modalError, setModalError] = useState('');

      const [showResetModal, setShowResetModal] = useState(false);
      const [resetPassword, setResetPassword] = useState('');
      const [resetError, setResetError] = useState('');

      const [selectedMatchToDelete, setSelectedMatchToDelete] = useState(null);
      const [matchDeletePassword, setMatchDeletePassword] = useState('');
      const [matchDeleteError, setMatchDeleteError] = useState('');

      const [h2hP1, setH2hP1] = useState('SAMU');
      const [h2hP2, setH2hP2] = useState('');

      const [isSubmitting, setIsSubmitting] = useState(false);
      const [mostrarHistorialCompleto, setMostrarHistorialCompleto] = useState(false);

      // Salón de Fama
      const [hofManualTitles, setHofManualTitles] = useState([]);
      const [hofWindowDays, setHofWindowDays] = useState(30);
      const [hofTitlePlayer, setHofTitlePlayer] = useState('');
      const [hofTitleName, setHofTitleName] = useState('');
      const [hofTitleEmoji, setHofTitleEmoji] = useState('🏆');
      const [hofTitleRarity, setHofTitleRarity] = useState('EPICO');
      const [hofTitleNote, setHofTitleNote] = useState('');

      // Cálculo del progreso de la Temporada (45 días)
      const seasonInfo = useMemo(() => {
        const start = new Date(seasonConfig.startDate);
        const now = new Date();
        const diffMs = now.getTime() - start.getTime();
        const elapsedDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
        const currentDay = Math.min(seasonConfig.durationDays, Math.max(1, elapsedDays + 1));
        const daysRemaining = Math.max(0, seasonConfig.durationDays - elapsedDays);
        return {
          number: seasonConfig.seasonNumber,
          currentDay,
          daysRemaining,
          isFinished: elapsedDays >= seasonConfig.durationDays
        };
      }, [seasonConfig]);

      const copyShareableLink = () => {
        const baseUrl = window.location.href.split('?')[0];
        const tempInput = document.createElement('input');
        tempInput.value = baseUrl;
        document.body.appendChild(tempInput);
        tempInput.select();
        document.execCommand('copy');
        document.body.removeChild(tempInput);
        setFeedback('🔗 ¡Link copiado al portapapeles!');
        setTimeout(() => setFeedback(''), 3000);
      };

      const mergeWithOfflineQueue = useCallback((remoteList) => {
        try {
          const queued = JSON.parse(localStorage.getItem('truco_league_offline_queue') || '[]');
          const map = new Map((remoteList || []).map(p => [p.id, p]));
          queued.forEach(p => map.set(p.id, p));
          return Array.from(map.values());
        } catch (e) {
          return remoteList || [];
        }
      }, []);

      // Sincronización optimizada sin alterar el modelo original de puntuación.
      // La tabla histórica original contabiliza todas las partidas APROBADAS presentes en `partidas`,
      // por lo que no se filtra por temporada al calcular ranking/H2H. Para jugadores normales
      // cargamos además sus propias PENDIENTES sin exponer las pendientes de terceros.
      useEffect(() => {
        setPartidasInitialSync(false);
        const timer = setTimeout(() => {
          const { db, appId, collection, doc, onSnapshot, query, where, orderBy, limit } = window.TrucoDB || {};
          if (!db || !query || !where) return;
          const cleanups = [];

          cleanups.push(onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'jugadores'), snapshot => {
            const docs = snapshot.docs.map(d => ({ id:d.id, ...d.data() }));
            const list = docs.map(d => d.nombre).filter(Boolean).map(normalizePlayerName);
            setJugadoresOcultos(Array.from(new Set(docs.filter(d => d.oculto === true).map(d => normalizePlayerName(d.nombre)))));
            setJugadores(list.length ? Array.from(new Set(list)) : DEFAULT_JUGADORES);
          }, err => console.warn('Firestore (jugadores):', err.message)));

          const partidaRef = collection(db, 'artifacts', appId, 'public', 'data', 'partidas');
          const mergeMatches = (snapshot) => mergeWithOfflineQueue(snapshot.docs.map(d => ({ id:d.id, ...d.data() })));

          if (currentUser?.isAdmin) {
            cleanups.push(onSnapshot(partidaRef, snapshot => { setPartidas(mergeMatches(snapshot)); setPartidasInitialSync(true); }, err => console.warn('Firestore (partidas/admin):', err.message)));
          } else {
            // Firestore Rules permiten una consulta pública segura solo con estado APROBADA.
            cleanups.push(onSnapshot(query(partidaRef, where('estado', '==', 'APROBADA')), snapshot => {
              setPartidasInitialSync(true);
              setPartidas(prev => {
                const approved = snapshot.docs.map(d => ({ id:d.id, ...d.data() }));
                const ownPending = prev.filter(p => p.estado === 'PENDIENTE' && p.creatorUid === currentUser?.uid);
                return mergeWithOfflineQueue([...approved, ...ownPending]);
              });
            }, err => console.warn('Firestore (partidas aprobadas):', err.message)));
            if (currentUser?.uid) {
              cleanups.push(onSnapshot(query(partidaRef, where('creatorUid', '==', currentUser.uid)), snapshot => {
                const own = snapshot.docs.map(d => ({ id:d.id, ...d.data() })).filter(p => p.estado === 'PENDIENTE');
                setPartidas(prev => {
                  const approved = prev.filter(p => p.estado === 'APROBADA');
                  return mergeWithOfflineQueue([...approved, ...own]);
                });
              }, err => console.warn('Firestore (mis partidas pendientes):', err.message)));
            }
          }

          cleanups.push(onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'season_config', 'main'), snapshot => {
            if (snapshot.exists()) setSeasonConfig(snapshot.data());
          }, err => console.warn('Firestore (Season):', err.message)));

          const historyQuery = query(collection(db, 'artifacts', appId, 'public', 'data', 'season_history'), orderBy('seasonNumber', 'desc'), limit(20));
          cleanups.push(onSnapshot(historyQuery, snapshot => setHistoricalSeasons(snapshot.docs.map(d => ({ id:d.id, ...d.data() }))), err => console.warn('Firestore (season_history):', err.message)));

          cleanups.push(onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'hallOfFameTitles'), snapshot => {
            setHofManualTitles(snapshot.docs.map(d => ({ id:d.id, ...d.data() })).sort((a,b) => Number(b.timestamp || 0) - Number(a.timestamp || 0)));
          }, err => console.warn('Firestore (hallOfFameTitles):', err.message)));

          if (currentUser?.isAdmin) {
            cleanups.push(onSnapshot(query(collection(db, 'artifacts', appId, 'public', 'data', 'cuentas'), limit(200)), snapshot => {
              setCuentas(snapshot.docs.map(d => ({ id:d.id, ...d.data() })));
            }, err => console.warn('Firestore (cuentas/admin):', err.message)));
            cleanups.push(onSnapshot(query(collection(db, 'artifacts', appId, 'public', 'data', 'auditLogs'), orderBy('timestamp', 'desc'), limit(100)), snapshot => {
              setAuditLogs(snapshot.docs.map(d => ({ id:d.id, ...d.data() })));
            }, err => console.warn('Firestore (auditLogs/admin):', err.message)));
          } else { setCuentas([]); setAuditLogs([]); }

          return () => cleanups.forEach(fn => { try { fn(); } catch(e) {} });
        }, 100);
        return () => clearTimeout(timer);
      }, [currentUser?.uid, currentUser?.isAdmin, mergeWithOfflineQueue]);

      // H2H derivado: cualquier resultado nuevo actualiza la comparación automáticamente.

      // Filtrado de partidas aprobadas vs pendientes
      const approvedPartidas = useMemo(() => partidas.filter(p => p.estado === 'APROBADA'), [partidas]);
      const pendingPartidas = useMemo(() => partidas.filter(p => p.estado === 'PENDIENTE'), [partidas]);
      const pendingCuentas = useMemo(() => cuentas.filter(c => c.estado === 'PENDIENTE'), [cuentas]);
      const myPendingPartidas = useMemo(() => {
        if (!currentUser) return [];
        return pendingPartidas.filter(p =>
          p.jugadorCarga === currentUser.jugadorNombre ||
          p.usuarioCarga === currentUser.email
        );
      }, [pendingPartidas, currentUser]);

      useEffect(() => {
        if (!currentUser?.isAdmin && (activeTab === 'accesos' || activeTab === 'dev')) {
          setActiveTab(currentUser ? 'perfil' : 'ranking');
        }
      }, [currentUser, activeTab]);

      // OPTIMIZACIÓN: Partidas jugadas del día (el historial solo muestra las de hoy)
      const todayString = useMemo(() => getTodayDateString(), []);
      const partidasDeHoy = useMemo(() => {
        return approvedPartidas.filter(p => {
          if (p.fechaIso) return p.fechaIso === todayString;
          // Fallback para fechas antiguas guardadas como string local
          const fechaMatch = p.fecha || '';
          const hoyLocal = new Date().toLocaleDateString('es-AR');
          return fechaMatch === hoyLocal;
        });
      }, [approvedPartidas, todayString]);

      const handleRenombrarJugador = async (e) => {
        e.preventDefault();
        if (!currentUser?.isAdmin) return;

        const oldName = jugadorRenombrar.trim().toUpperCase();
        const newName = nuevoNombreJugador.trim().toUpperCase();
        if (!oldName || !newName) {
          setFeedback('⚠️ Selecciona un jugador e indica el nuevo nombre.');
          setTimeout(() => setFeedback(''), 3000);
          return;
        }
        if (oldName === newName) {
          setFeedback('⚠️ El nuevo nombre debe ser diferente.');
          setTimeout(() => setFeedback(''), 3000);
          return;
        }
        if (!jugadores.includes(oldName)) {
          setFeedback('⚠️ El jugador seleccionado no existe.');
          setTimeout(() => setFeedback(''), 3000);
          return;
        }
        if (jugadores.some(j => String(j).toUpperCase() === newName)) {
          setFeedback('⚠️ Ese nombre ya está ocupado.');
          setTimeout(() => setFeedback(''), 3000);
          return;
        }

        setRenombrandoJugador(true);
        try {
          const { db, appId, collection, doc, getDocs, setDoc, updateDoc, deleteDoc } = window.TrucoDB || {};
          if (!db) throw new Error('Firebase no disponible.');

          // 1) Renombrar la ficha del jugador, conservando campos como oculto.
          const oldPlayerRef = doc(db, 'artifacts', appId, 'public', 'data', 'jugadores', oldName);
          const oldPlayerSnap = await window.TrucoDB.getDoc(oldPlayerRef);
          const oldPlayerData = oldPlayerSnap.exists() ? oldPlayerSnap.data() : { nombre: oldName };
          await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'jugadores', newName), { ...oldPlayerData, nombre: newName }, { merge: true });
          await deleteDoc(oldPlayerRef);

          // 2) Actualizar todas las partidas actuales para que las estadísticas no se dividan entre dos nombres.
          const partidasSnap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'partidas'));
          for (const partidaDoc of partidasSnap.docs) {
            const data = partidaDoc.data();
            let changed = false;
            const replace = (value) => {
              if (typeof value === 'string') return value === oldName ? newName : value;
              if (Array.isArray(value)) return value.map(v => {
                const nv = replace(v); if (nv !== v) changed = true; return nv;
              });
              if (value && typeof value === 'object') {
                const out = {};
                Object.entries(value).forEach(([k,v]) => { const nv = replace(v); if (nv !== v) changed = true; out[k] = nv; });
                return out;
              }
              return value;
            };
            const updated = replace(data);
            if (changed) await updateDoc(partidaDoc.ref, updated);
          }

          // 3) Actualizar la cuenta vinculada, si existe.
          const cuentasSnap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'cuentas'));

          const ventaja = Math.max(0, Number(p.ventaja || 0));

            case 'PJ': progreso = values.pj; desbloqueado = progreso >= a.objetivo; textoProgreso = `${Math.min(progreso,a.objetivo)}/${a.objetivo} partidas`; break;
            case 'WINRATE': progreso = values.pj >= a.minimo ? values.wr : Math.min(values.pj, a.minimo); desbloqueado = values.pj >= a.minimo && values.wr >= a.objetivo; textoProgreso = values.pj < a.minimo ? `${values.pj}/${a.minimo} partidas mínimas` : `${values.wr}% / ${a.objetivo}% WR`; break;
            case 'PERFECTA': progreso = Math.min(values.perfectas,1); desbloqueado = values.perfectas >= 1; textoProgreso = desbloqueado ? '30 - 0 conseguido' : 'Todavía sin 30 - 0'; break;
            case 'TODOS': progreso = values.rivalesDerrotados; desbloqueado = values.todos === 1; textoProgreso = `${values.rivalesDerrotados}/${values.rivalesObjetivo || 0} rivales`; break;

            case 'HUGO': progreso = values.hugo; desbloqueado = progreso >= a.objetivo; textoProgreso = `${Math.min(progreso,a.objetivo)}/${a.objetivo} victorias vs HUGO`; break;

                  <div className="glass-card rounded-xl p-4 border border-slate-800"><p className="text-[10px] uppercase text-slate-500">Passwords legacy</p><p className={`text-2xl font-black mt-1 ${dataHealthReport.legacyPasswords?'text-red-300':'text-emerald-300'}`}>{dataHealthReport.legacyPasswords}</p></div>
                </div>
                <div className="glass-card rounded-2xl border border-slate-800 p-5 space-y-3">
                  <div className="flex flex-wrap gap-2"><button onClick={resetRankingMovement} className="px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-black text-white">↕️ Reiniciar flechas</button><button onClick={() => window.location.reload()} className="px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-black text-white">🔄 Recargar app</button><button onClick={exportarBackupJSON} className="px-4 py-2.5 rounded-xl bg-sky-600 hover:bg-sky-500 text-xs font-black text-white">💾 Exportar backup JSON</button>{dataHealthReport.legacyPasswords>0&&<button onClick={sanitizeLegacyPasswords} className="px-4 py-2.5 rounded-xl bg-red-600 hover:bg-red-500 text-xs font-black text-white">🔐 Eliminar passwords legacy</button>}</div>
                  <p className="text-[11px] text-slate-500">Ranking oficial: 1v1 = 1 Pt · 2v2/3v3 = 2 Pts. Las contraseñas nuevas nunca se guardan en Firestore. El botón rojo borra el campo <code>password</code> únicamente de perfiles antiguos.</p>
                </div>
                <div className="glass-card rounded-2xl border border-slate-800 overflow-hidden"><div className="p-5 border-b border-slate-800"><h3 className="text-lg font-black text-white">🔎 Registros que requieren revisión</h3></div><div className="divide-y divide-slate-800/70">
                  {dataHealthReport.issues.slice(0,30).map(item=><div key={`${item.id}-${item.estado}-${item.issues.join('|')}`} className="p-4"><div className="flex items-center justify-between"><span className="text-xs font-mono text-sky-300">{item.id}</span><span className="text-[10px] uppercase font-black text-slate-500">{item.estado}</span></div><p className="text-xs text-red-300 mt-1">{item.issues.join(' · ')}</p></div>)}
                  {!dataHealthReport.issues.length&&<div className="p-8 text-center text-xs text-emerald-300">✅ No se encontraron anomalías en los registros cargados.</div>}
                </div></div>
              </div>
            )}

          </main>

          {/* Menú inferior móvil */}
          {(deviceMode === 'mobile' || (!deviceMode)) && (
            <div className={`fixed bottom-0 left-0 right-0 z-50 bg-slate-900/95 backdrop-blur-lg border-t border-slate-800 flex justify-around items-center py-2 px-1 shadow-2xl ${deviceMode === 'mobile' ? 'flex' : 'lg:hidden'}`}>
              <button
                onClick={() => setActiveTab('ranking')}
                className={`flex flex-col items-center justify-center py-1 px-2 rounded-xl transition ${
                  activeTab === 'ranking' ? 'text-emerald-400 font-bold scale-105' : 'text-slate-400'
                }`}
              >
                <span className="text-xl">🏆</span>
                <span className="text-[10px] tracking-tight mt-0.5">Ranking</span>
              </button>

              <button
                onClick={() => setActiveTab('cargar')}
                className={`flex flex-col items-center justify-center py-1 px-2 rounded-xl transition ${
                  activeTab === 'cargar' ? 'text-emerald-400 font-bold scale-105' : 'text-slate-400'
                }`}
              >
                <span className="text-xl">⚡</span>
                <span className="text-[10px] tracking-tight mt-0.5">Jugar</span>
              </button>

              {currentUser?.isAdmin && (
                <button
                  onClick={() => setActiveTab('accesos')}
                  className={`flex flex-col items-center justify-center py-1 px-2 rounded-xl transition relative ${activeTab === 'accesos' ? 'text-amber-400 font-bold scale-105' : 'text-slate-400'}`}
                >
                  <span className="text-xl">🔐</span>
                  <span className="text-[10px] tracking-tight mt-0.5">Accesos</span>
                  {pendingPartidas.length + pendingCuentas.length > 0 && <span className="absolute top-0 right-1 min-w-4 h-4 px-1 bg-amber-500 text-slate-950 text-[9px] font-black rounded-full flex items-center justify-center">{pendingPartidas.length + pendingCuentas.length}</span>}
                </button>
              )}

              {currentUser?.isAdmin && (
                <button onClick={() => setActiveTab('dev')} className={`flex flex-col items-center justify-center py-1 px-2 rounded-xl transition ${activeTab === 'dev' ? 'text-sky-400 font-bold scale-105' : 'text-slate-400'}`}>
                  <span className="text-xl">🧪</span><span className="text-[10px] tracking-tight mt-0.5">Dev</span>
                </button>
              )}

              <button
                onClick={() => setActiveTab('historial')}
                className={`flex flex-col items-center justify-center py-1 px-2 rounded-xl transition ${
                  activeTab === 'historial' ? 'text-emerald-400 font-bold scale-105' : 'text-slate-400'
                }`}
              >
                <span className="text-xl">📜</span>
                <span className="text-[10px] tracking-tight mt-0.5">Hoy</span>
              </button>

              <button
                onClick={() => setActiveTab('salon')}
                className={`flex flex-col items-center justify-center py-1 px-2 rounded-xl transition ${
                  activeTab === 'salon' ? 'text-amber-400 font-bold scale-105' : 'text-slate-400'
                }`}
              >
                <span className="text-xl">🏛️</span>
                <span className="text-[10px] tracking-tight mt-0.5">Fama</span>
              </button>

              <button
                onClick={() => setActiveTab('h2h')}
                className={`flex flex-col items-center justify-center py-1 px-2 rounded-xl transition ${
                  activeTab === 'h2h' ? 'text-emerald-400 font-bold scale-105' : 'text-slate-400'
                }`}
              >
                <span className="text-xl">⚔️</span>
                <span className="text-[10px] tracking-tight mt-0.5">H2H</span>
              </button>

              {currentUser ? (
                <button
                  onClick={() => setActiveTab('perfil')}
                  className={`flex flex-col items-center justify-center py-1 px-2 rounded-xl transition ${
                    activeTab === 'perfil' ? 'text-emerald-400 font-bold scale-105' : 'text-slate-400'
                  }`}
                >
                  <span className="text-xl">👤</span>
                  <span className="text-[10px] tracking-tight mt-0.5">Perfil</span>
                </button>
              ) : (
                <button
                  onClick={() => { setAuthMode('LOGIN'); setModalError(''); setShowLoginModal(true); }}
                  className="flex flex-col items-center justify-center py-1 px-2 text-emerald-400"
                >
                  <span className="text-xl">🔑</span>
                  <span className="text-[10px] font-bold mt-0.5">Ingresar</span>
                </button>
              )}
            </div>
          )}

          {/* Modal Modo Dispositivo */}
          {showDeviceModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-md p-4">
              <div className="glass-card rounded-2xl p-6 max-w-sm w-full text-center space-y-4 border border-slate-800 shadow-2xl">
                <span className="text-4xl">📱💻</span>
                <h3 className="text-lg font-extrabold text-white">Selecciona tu Modo de Vista</h3>
                <p className="text-xs text-slate-400">Puedes cambiar entre menú superior de PC o barra flotante móvil en cualquier momento.</p>
                <div className="grid grid-cols-2 gap-3 pt-2">
                  <button
                    onClick={() => handleSelectDevice('pc')}
                    className="py-3 bg-slate-800 hover:bg-slate-700 font-bold text-xs text-white rounded-xl border border-slate-700 transition"
                  >
                    💻 Modo PC
                  </button>
                  <button
                    onClick={() => handleSelectDevice('mobile')}
                    className="py-3 bg-emerald-600 hover:bg-emerald-500 font-bold text-xs text-white rounded-xl shadow transition"
                  >
                    📱 Modo Móvil
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Modal Login / Registro */}
          {showLoginModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
              <div className="glass-card rounded-2xl p-6 max-w-md w-full border border-slate-800 shadow-2xl space-y-4">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h3 className="text-lg font-extrabold text-white">
                    {authMode === 'LOGIN' ? '🔑 Ingresar a la Liga' : '📝 Solicitar Registro'}
                  </h3>
                  <button onClick={() => setShowLoginModal(false)} className="text-slate-400 hover:text-white font-bold text-sm p-1">
                    ✕
                  </button>
                </div>

                {modalError && (
                  <div className="bg-red-950/80 border border-red-800/60 text-red-200 text-xs p-3 rounded-xl">
                    {modalError}
                  </div>
                )}

                {authMode === 'LOGIN' ? (
                  <form onSubmit={handleLoginSubmit} className="space-y-4">
                    <div>
                      <label className="text-xs font-bold text-slate-300 block mb-1">Correo Electrónico</label>
                      <input
                        type="email"
                        placeholder="tuemail@ejemplo.com"
                        value={loginEmailInput}
                        onChange={e => setLoginEmailInput(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-emerald-500"
                      />
                    </div>

                    <div>
                      <label className="text-xs font-bold text-slate-300 block mb-1">Contraseña</label>
                      <input
                        type="password"
                        placeholder="••••••••"
                        value={loginPasswordInput}
                        onChange={e => setLoginPasswordInput(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-emerald-500"
                      />
                    </div>

                    <button
                      type="submit"
                      disabled={isSubmitting}
                      className="w-full py-3 bg-emerald-600 hover:bg-emerald-500 font-extrabold text-xs text-white rounded-xl shadow transition"
                    >
                      {isSubmitting ? 'Iniciando...' : 'Iniciar Sesión'}
                    </button>

                    <div className="text-center pt-2">
                      <button
                        type="button"
                        onClick={() => { setAuthMode('REGISTER'); setModalError(''); }}
                        className="text-xs font-bold text-emerald-400 hover:underline"
                      >
                        ¿No tienes cuenta? Solicita tu registro aquí
                      </button>
                    </div>
                  </form>
                ) : (
                  <form onSubmit={handleRegisterSubmit} className="space-y-3">
                    <div>
                      <label className="text-xs font-bold text-slate-300 block mb-1">Nombre de Jugador</label>
                      <input
                        type="text"
                        placeholder="EJ: CARLOS"
                        value={regNombreInput}
                        onChange={e => setRegNombreInput(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-xs text-white uppercase focus:outline-none focus:border-emerald-500"
                      />
                    </div>

                    <div>
                      <label className="text-xs font-bold text-slate-300 block mb-1">Correo Electrónico</label>
                      <input
                        type="email"
                        placeholder="correo@ejemplo.com"
                        value={loginEmailInput}
                        onChange={e => setLoginEmailInput(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-emerald-500"
                      />
                    </div>

                    <div>
                      <label className="text-xs font-bold text-slate-300 block mb-1">Confirmar Correo</label>
                      <input
                        type="email"
                        placeholder="correo@ejemplo.com"
                        value={regEmailConfirmInput}
                        onChange={e => setRegEmailConfirmInput(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-emerald-500"
                      />
                    </div>

                    <div>
                      <label className="text-xs font-bold text-slate-300 block mb-1">Contraseña</label>
                      <input
                        type="password"
                        placeholder="••••••••"
                        value={loginPasswordInput}
                        onChange={e => setLoginPasswordInput(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-emerald-500"
                      />
                    </div>

                    <div>
                      <label className="text-xs font-bold text-slate-300 block mb-1">Confirmar Contraseña</label>
                      <input
                        type="password"
                        placeholder="••••••••"
                        value={regPasswordConfirmInput}
                        onChange={e => setRegPasswordConfirmInput(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-emerald-500"
                      />
                    </div>

                    <button
                      type="submit"
                      disabled={isSubmitting}
                      className="w-full py-3 bg-emerald-600 hover:bg-emerald-500 font-extrabold text-xs text-white rounded-xl shadow transition mt-2"
                    >
                      {isSubmitting ? 'Enviando...' : 'Enviar Solicitud a SAMU'}
                    </button>

                    <div className="text-center pt-1">
                      <button
                        type="button"
                        onClick={() => { setAuthMode('LOGIN'); setModalError(''); }}
                        className="text-xs font-bold text-slate-400 hover:underline"
                      >
                        ¿Ya tienes cuenta? Ingresar
                      </button>
                    </div>
                  </form>
                )}
              </div>
            </div>
          )}

          {/* Modal Confirmar Carga */}
          {showConfirmLoad && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-md p-4">
              <div className="glass-card rounded-2xl p-6 max-w-md w-full border border-amber-500/30 shadow-2xl space-y-4">
                <div className="flex items-center gap-3">
                  <span className="text-4xl">⚠️</span>
                  <div>
                    <h3 className="text-lg font-extrabold text-white">Confirmar carga de partida</h3>
                    <p className="text-xs text-slate-400 mt-1">Una vez confirmada, se enviará la partida {modoPartida} y no se volverá a preguntar.</p>
                  </div>
                </div>
                <div className="bg-slate-900/80 border border-slate-800 rounded-xl p-4 text-center">
                  <p className="text-sm font-black text-amber-300 uppercase">{modoPartida}</p>
                  <p className="text-xs text-slate-300 mt-1">Revisa jugadores y marcador antes de confirmar.</p>
                </div>
                <div className="flex gap-2">
                  <button type="button" onClick={()=>setShowConfirmLoad(false)} className="flex-1 py-2.5 bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-300 rounded-xl">Cancelar</button>
                  <button type="button" onClick={confirmarCargaPartida} disabled={isSubmitting} className="flex-1 py-2.5 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-xs font-black text-white rounded-xl shadow">✅ Confirmar</button>
                </div>
              </div>
            </div>
          )}

          {/* Modal Reinicio por Admin */}
          {showResetModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
              <div className="glass-card rounded-2xl p-6 max-w-md w-full border border-red-800/50 shadow-2xl space-y-4">
                <h3 className="text-lg font-extrabold text-red-400">⚠️ Reiniciar Tabla / Temporada</h3>
                <p className="text-xs text-slate-300">
                  Esta acción archivará la temporada actual, conservará todas sus partidas y abrirá una nueva temporada sin mezclar estadísticas.
                </p>

                {resetError && <p className="text-xs text-red-400 font-bold">{resetError}</p>}

                <form onSubmit={handleResetLeague} className="space-y-4">
                  <div className="bg-red-950/30 border border-red-900/40 rounded-xl p-3 text-[11px] text-red-200">⚠️ Solo funciona con una sesión de Administrador validada por Firebase.</div>
                  <div className="flex gap-2">
                    <button
                      type="button"
                      onClick={() => setShowResetModal(false)}
                      className="flex-1 py-2.5 bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-300 rounded-xl"
                    >
                      Cancelar
                    </button>
                    <button
                      type="submit"
                      className="flex-1 py-2.5 bg-red-600 hover:bg-red-500 text-xs font-bold text-white rounded-xl shadow"
                    >
                      Confirmar Reinicio
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Modal Anular Partida */}
          {selectedMatchToDelete && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
              <div className="glass-card rounded-2xl p-6 max-w-md w-full border border-red-800/50 shadow-2xl space-y-4">
                <h3 className="text-lg font-extrabold text-red-400">🛑 Anular Partida</h3>
                <p className="text-xs text-slate-300">Confirma la anulación de esta partida con tu sesión actual de Administrador. Se conservará el registro para auditoría.</p>

                {matchDeleteError && <p className="text-xs text-red-400 font-bold">{matchDeleteError}</p>}

                <form onSubmit={handleConfirmEliminarPartida} className="space-y-4">
                  <div className="bg-red-950/30 border border-red-900/40 rounded-xl p-3 text-[11px] text-red-200">🔐 Acción protegida por la sesión de Administrador.</div>
                  <div className="flex gap-2">
                    <button
                      type="button"
                      onClick={() => setSelectedMatchToDelete(null)}
                      className="flex-1 py-2.5 bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-300 rounded-xl"
                    >
                      Cancelar
                    </button>
                    <button
                      type="submit"
                      className="flex-1 py-2.5 bg-red-600 hover:bg-red-500 text-xs font-bold text-white rounded-xl shadow"
                    >
                      Anular Partida
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
