  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
    .glass-card {
      background: rgba(30, 41, 59, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-card-accent {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(34, 197, 94, 0.2);
    }
    .badge-season {
      background: linear-gradient(135deg, rgba(234,179,8,0.15) 0%, rgba(22,163,74,0.15) 100%);
      border: 1px solid rgba(234,179,8,0.3);
    }
    @keyframes hofShine {
      0%,100% { box-shadow: 0 0 0 rgba(234,179,8,0); }
      50% { box-shadow: 0 0 28px rgba(234,179,8,0.22); }
    }
    .hof-legendary { animation: hofShine 2.8s ease-in-out infinite; }
    .hof-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1rem; }
    .hof-title-strip { background: linear-gradient(90deg, rgba(234,179,8,.12), rgba(34,197,94,.08), rgba(168,85,247,.08)); }

    /* ================= JUGAR / CONTADOR ================= */
    .jugar-shell {
      height: calc(100dvh - 5.8rem);
      min-height: 0;
    }
    .jugar-board {
      display: grid;
      grid-template-columns: minmax(0,1fr) minmax(0,1fr);
      gap: 6px;
      flex: 1;
      min-height: 0;
    }
    .jugar-team {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: rgba(2, 12, 27, .78);
      border: 1px solid rgba(51,65,85,.6);
      border-radius: 20px;
      overflow: hidden;
      position: relative;
    }
    .jugar-team::after {
      content: '';
      position: absolute;
      top: 0; bottom: 0; right: -5px;
      width: 1px;
      background: rgba(15,23,42,.9);
      pointer-events: none;
    }
    .jugar-team:last-child::after { display:none; }
    .jugar-team-head {
      min-height: 3.25rem;
      padding: .45rem .65rem;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      background: rgba(15,23,42,.92);
      border-bottom:1px solid rgba(51,65,85,.7);
      container-type:inline-size;
      -webkit-text-size-adjust:100%;
      text-size-adjust:100%;
    }
    .jugar-team-name {
      min-width:0;
      flex:1 1 auto;
      font-size: 13px;
      font-size: clamp(8px, 7.2cqw, 13px);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .05em;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      line-height:1.05;
    }
    .jugar-score {
      flex:0 0 auto;
      font-size: 28px;
      font-size: clamp(20px, 18cqw, 34px);
      line-height:1;
      font-weight: 950;
      font-variant-numeric: tabular-nums;
      color:#34d399;
      -webkit-text-size-adjust:100%;
      text-size-adjust:100%;
    }
    .jugar-team:first-child .jugar-team-name { color:#fbbf24; }
    .jugar-team:first-child .jugar-score { color:#34d399; }
    .jugar-team:last-child .jugar-team-name { color:#22d3ee; }
    .jugar-team-actions { display:flex; gap:.3rem; flex:0 0 auto; }
    .jugar-mini-btn {
      width:1.7rem; height:1.7rem;
      border-radius:9px;
      border:1px solid rgba(71,85,105,.7);
      background:rgba(2,6,23,.7);
      color:#cbd5e1;
      font-weight:900;
      font-size:.8rem;
      display:flex; align-items:center; justify-content:center;
      touch-action: manipulation;
    }
    .jugar-mini-btn.plus { color:#d1fae5; border-color:rgba(16,185,129,.35); }
    .jugar-count-area {
      flex:1;
      min-height:0;
      display:grid;
      grid-template-rows: 1fr 1fr;
    }
    .jugar-zone {
      min-height:0;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:8px 10px;
      border-bottom:1px solid rgba(51,65,85,.45);
      cursor:pointer;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .jugar-zone:last-child { border-bottom:0; }
    .jugar-zone:hover { background:rgba(15,23,42,.35); }
    .jugar-zone:active { background:rgba(16,185,129,.08); }
    .jugar-zone-label {
      font-size: clamp(10px, .9vw, 13px);
      font-weight:950;
      letter-spacing:.08em;
      text-transform:uppercase;
      margin-bottom:7px;
    }
    .jugar-zone.good .jugar-zone-label { color:#34d399; }
    .jugar-zone.bad .jugar-zone-label { color:#64748b; }
    .jugar-sticks {
      display:flex;
      flex-direction:column;
      gap: 5px;
      align-items:center;
      justify-content:center;
    }
    .jugar-stick-box {
      width: clamp(58px, min(7.5vw, 10dvh), 104px);
      height: clamp(58px, min(7.5vw, 10dvh), 104px);
      border: 2px solid rgba(51,65,85,.55);
      border-radius: 14px;
      background: rgba(2,12,27,.78);
      display:flex; align-items:center; justify-content:center;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.02), 0 5px 16px rgba(0,0,0,.12);
      overflow:hidden;
      flex: 0 0 auto;
    }
    .jugar-stick-box svg {
      width: 98%;
      height: 98%;
      overflow: visible;
    }
    .jugar-zone.good .jugar-stick-box { border-color:rgba(16,185,129,.18); }
    .jugar-gesture {
      font-size:9px;
      font-weight:800;
      letter-spacing:.12em;
      text-transform:uppercase;
      color:#475569;
      margin-top:8px;
    }
    .jugar-bottom {
      display:grid;
      grid-template-columns:1fr auto;
      gap:8px;
      margin-top:8px;
      padding-top:8px;
      border-top:1px solid rgba(51,65,85,.65);
    }
    .jugar-load-btn {
      min-height:48px;
      border-radius:15px;
      font-size:15px;
      font-weight:950;
      box-shadow: 0 10px 30px rgba(16,185,129,.12);
    }
    .jugar-status {
      min-height:48px;
      padding:0 13px;
      border-radius:15px;
      display:flex; align-items:center; justify-content:center;
      border:1px solid rgba(71,85,105,.6);
      background:rgba(2,6,23,.55);
      white-space:nowrap;
      font-size:10px;
      font-weight:900;
      color:#94a3b8;
    }
    .jugar-select-row { display:grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr) auto; gap:8px; }
    .jugar-team-selects { display:grid; grid-template-columns:1fr 1fr; gap:7px; }
    .jugar-team-selects.three { grid-template-columns:1fr 1fr 1fr; }

    @media (max-width: 767px) {
      .jugar-shell {
        height: auto;
        min-height: calc(100dvh - 9.2rem);
        max-height: none;
      }
      .jugar-board { gap:5px; min-height: 0; }
      .jugar-team { border-radius:12px; }
      .jugar-team-head { min-height:2.85rem; padding:.34rem .45rem; gap:.3rem; }
      .jugar-team-name { font-size:clamp(8px, 7.2cqw, 12px); letter-spacing:.035em; }
      .jugar-team-actions { gap:.22rem; }
      .jugar-mini-btn { width:1.55rem; height:1.55rem; font-size:.72rem; border-radius:.45rem; }
      .jugar-score { font-size:clamp(20px, 18cqw, 31px); }
      .jugar-count-area { min-height: 0; }
      .jugar-zone { padding:5px 3px; }
      .jugar-zone-label { font-size:9px; margin-bottom:5px; letter-spacing:.06em; }
      .jugar-stick-box {
        width: clamp(50px, min(17vw, 9dvh), 72px);
        height: clamp(50px, min(17vw, 9dvh), 72px);
        border-radius:11px;
        border-width:1px;
      }
      .jugar-stick-box svg { width:94%; height:94%; }
      .jugar-sticks { gap:4px; }
      .jugar-gesture { display:none; }
      .jugar-bottom { grid-template-columns:1fr; gap:5px; margin-top:6px; padding-top:6px; }
      .jugar-status { order:-1; min-height:24px; padding:0 8px; border-radius:10px; font-size:9px; }
      .jugar-load-btn { min-height:46px; border-radius:12px; font-size:13px; }
      .jugar-select-row { grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:5px; }
      .jugar-select-row > div:last-child { grid-column:1 / -1; }
      .jugar-team-selects { grid-template-columns:1fr 1fr; gap:4px; }
      .jugar-team-selects.three { grid-template-columns:1fr 1fr 1fr; }
    }

    @media (max-width: 380px) {
      .jugar-shell { min-height: calc(100dvh - 8.8rem); }
      .jugar-stick-box { width:52px; height:52px; }
      .jugar-team-name { font-size:clamp(8px, 7cqw, 10px); }
      .jugar-score { font-size:clamp(19px, 17cqw, 28px); }
      .jugar-mini-btn { width:1.4rem; height:1.4rem; font-size:.66rem; }
      .jugar-zone-label { font-size:clamp(.5rem, 2.5vw, .62rem); }
      .jugar-team-head { min-height:2.6rem; }
    }

    @media (min-width: 768px) {
      .jugar-shell { height: calc(100dvh - 5.2rem); }
      .jugar-stick-box { width: clamp(84px, 7.2vw, 112px); height: clamp(84px, 7.2vw, 112px); }
      .jugar-sticks { gap: 5px; }
      .jugar-zone { padding: 5px 8px; }
    }

    @media (min-width: 1280px) {
      .jugar-shell { max-width: 1280px; }
    }
  </style>
</head>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback, useRef } = React;

    const INITIAL_ACCOUNTS = [
      {

      }
    ];

    const INITIAL_PARTIDAS = [];

    // Formateador de fecha estándar ISO local YYYY-MM-DD
    const getTodayDateString = () => {
      const today = new Date();
      const year = today.getFullYear();
      const month = String(today.getMonth() + 1).padStart(2, '0');
      const day = String(today.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    };

    // Componentes Iconos
    const IconShield = () => (
      <svg className="w-4 h-4 text-emerald-400 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
      </svg>
    );

    const IconPlus = () => (
      <svg className="w-5 h-5 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"/>
      </svg>
    );

    const IconTrash = () => (
      <svg className="w-4 h-4 text-red-400 hover:text-red-300 transition-colors inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>

    const IconDownload = () => (
      <svg className="w-4 h-4 inline-block mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
      </svg>
    );

    const IconExternalLink = () => (
      <svg className="w-4 h-4 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
      </svg>
    );

    // Componente visual para cerillos/palitos de Truco Argentino (0 a 5 por cajita).
    // Cada palito tiene cuerpo de madera, punta roja y volumen visual para parecer un cerillo real.
    const FosforosBox = ({ count }) => {
      const c = Math.min(5, Math.max(0, Number(count) || 0));

      const Match = ({ x1, y1, x2, y2, crossed = false }) => (
        <g>
          <line
            x1={x1} y1={y1} x2={x2} y2={y2}
            stroke={crossed ? '#f59e0b' : '#f7c65a'}
            strokeWidth="9.5"
            strokeLinecap="round"
          />
          <line
            x1={x1} y1={y1 + 0.7} x2={x2} y2={y2 + 0.7}
            stroke="#d99a2b"
            strokeWidth="2.2"
            strokeLinecap="round"
            opacity=".8"
          />
          <circle cx={x1} cy={y1} r="6.6" fill="#ef4444" stroke="#b91c1c" strokeWidth=".8" />
          <circle cx={x2} cy={y2} r="6.6" fill="#ef4444" stroke="#b91c1c" strokeWidth=".8" />
          <circle cx={x1 - .7} cy={y1 - .7} r="1.9" fill="#fecaca" opacity=".8" />
          <circle cx={x2 - .7} cy={y2 - .7} r="1.9" fill="#fecaca" opacity=".8" />
        </g>
      );

      return (
        <div className="jugar-stick-box" aria-hidden="true">
          <svg viewBox="0 0 100 100" fill="none" role="img" aria-label={`${c} cerillos`}>
            {c >= 1 && <Match x1="12" y1="12" x2="88" y2="12" />}
            {c >= 2 && <Match x1="88" y1="12" x2="88" y2="88" />}
            {c >= 3 && <Match x1="88" y1="88" x2="12" y2="88" />}
            {c >= 4 && <Match x1="12" y1="88" x2="12" y2="12" />}
            {c >= 5 && <Match x1="12" y1="12" x2="88" y2="88" crossed />}
          </svg>
        </div>
      );
    };

    // Anotador de Truco Argentino: tablero táctil compacto, inspirado en la referencia móvil.
    const AnotadorTruco = ({ puntos, onChange, label }) => {
      const p = Math.min(30, Math.max(0, Number(puntos) || 0));
      const malas = Math.min(15, p);
      const buenas = p > 15 ? p - 15 : 0;

      const renderBoxes = (pts) => [0,1,2].map(i => {
        const valInBox = Math.min(5, Math.max(0, pts - (i * 5)));
        return <FosforosBox key={i} count={valInBox} />;
      });

      const addPoint = () => onChange(Math.min(30, p + 1));
      const removePoint = () => onChange(Math.max(0, p - 1));

      return (
        <section className="jugar-team" aria-label={`Marcador de ${label}`}>
          <div className="jugar-team-head">
            <div className="min-w-0 flex-1">
              <div className="jugar-team-name">{label}</div>
            </div>
            <div className="flex items-center gap-2">
              <div className="jugar-team-actions">
                <button type="button" className="jugar-mini-btn" onClick={removePoint} disabled={p <= 0} aria-label={`Restar 1 a ${label}`}>−</button>
                <button type="button" className="jugar-mini-btn plus" onClick={addPoint} disabled={p >= 30} aria-label={`Sumar 1 a ${label}`}>+</button>
              </div>
              <span className="jugar-score">{p}</span>
            </div>
          </div>

          <div className="jugar-count-area">
            <button type="button" className="jugar-zone bad" onClick={addPoint} disabled={p >= 30} aria-label={`Tocar para sumar un punto a ${label}`}>
              <span className="jugar-zone-label">MALAS · {malas}/15</span>
              <div className="jugar-sticks">{renderBoxes(malas)}</div>
              <span className="jugar-gesture">TOCAR +1</span>
            </button>
            <button type="button" className="jugar-zone good" onClick={addPoint} disabled={p >= 30} aria-label={`Tocar para sumar un punto a ${label}`}>
              <span className="jugar-zone-label">BUENAS · {buenas}/15</span>
              <div className="jugar-sticks">{renderBoxes(buenas)}</div>
              <span className="jugar-gesture">TOCAR +1</span>
            </button>
          </div>
        </section>
      );
    };

    function App() {
      // Usuario con sesión guardada
      const [currentUser, setCurrentUser] = useState(() => {
        try {
          const saved = localStorage.getItem('truco_league_user');
          return saved ? JSON.parse(saved) : null;
        } catch (e) {
          return null;
        }
      });

      useEffect(() => {
        if (currentUser) {
          try { localStorage.setItem('truco_league_user', JSON.stringify(currentUser)); } catch (e) {}
        } else {
          try { localStorage.removeItem('truco_league_user'); } catch (e) {}
        }
      }, [currentUser]);

      // Estado de Jugadores y Cuentas
      const [jugadores, setJugadores] = useState(DEFAULT_JUGADORES);
      const [cuentas, setCuentas] = useState(() => {
        try {
          const saved = localStorage.getItem('truco_league_cuentas');
          return saved ? JSON.parse(saved) : INITIAL_ACCOUNTS;
        } catch(e) {
          return INITIAL_ACCOUNTS;
        }
      });

      useEffect(() => {
        try { localStorage.setItem('truco_league_cuentas', JSON.stringify(cuentas)); } catch(e){}
      }, [cuentas]);

      // Estado de Partidas Totales
      const [partidas, setPartidas] = useState(() => {
        try {
          const saved = localStorage.getItem('truco_league_partidas');

        if (!p1Name || !p2Name || p1Name === p2Name) return currentH2HMap;
        
        // Clave única alfabética (ej. "CARLOS:SAMU")
        const [pA, pB] = [p1Name, p2Name].sort();
        const pairKey = `${pA}:${pB}`;
        
        const existing = currentH2HMap[pairKey] || { p1Wins: 0, p2Wins: 0, total: 0 };
        const updated = { ...existing, total: existing.total + 1 };

        if (pA === p1Name) {
          if (isWinnerP1) updated.p1Wins += 1;
          else updated.p2Wins += 1;
        } else {
          if (isWinnerP1) updated.p2Wins += 1;
          else updated.p1Wins += 1;
        }

        const newMap = { ...currentH2HMap, [pairKey]: updated };

        // Guardar en Firebase de forma asíncrona
        try {
          const { db, appId, setDoc, doc } = window.TrucoDB || {};
          if (db) {
            setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'h2h_summary', 'main'), { pairs: newMap }, { merge: true });

          const ptsPremio = p.puntosGanadorPorJugador || (p.tipo === '2v2' ? 2 : 1);

          ganadoresList.forEach(g => {
            if (stats[g]) {
              stats[g].puntos += ptsPremio;
              stats[g].ganadas += 1;
              stats[g].ptsVentaja += Number(p.ventaja || 0);
            }
          });

          perdedoresList.forEach(l => {
            if (stats[l]) {
              stats[l].perdidas += 1;
            }
          });
        });

        return Object.values(stats).map(p => {
          const pj = p.ganadas + p.perdidas;
          const wrRaw = pj > 0 ? (p.ganadas / pj) : 0;
          const wrPct = Math.round(wrRaw * 100);
          const kdaVal = pj > 0 ? ((p.puntos / pj) + (p.ptsVentaja / 100)) : 0;
          const kdaFormatted = Number(kdaVal).toFixed(2);

          return { ...p, pj, wrPct, kda: Number(kdaFormatted) };
        }).sort((a, b) => {
          if (b.puntos !== a.puntos) return b.puntos - a.puntos;
          if (b.kda !== a.kda) return b.kda - a.kda;
          return b.ptsVentaja - a.ptsVentaja;
        });

      // Consulta O(1) ultra-rápida del H2H Numérico
      const getH2HNumericStats = (playerA, playerB) => {
        if (!playerA || !playerB || playerA === playerB) return { winsA: 0, winsB: 0, total: 0 };
        const [pMin, pMax] = [playerA, playerB].sort();
        const pairKey = `${pMin}:${pMax}`;
        const record = h2hData[pairKey];

        if (!record) return { winsA: 0, winsB: 0, total: 0 };

        if (pMin === playerA) {
          return { winsA: record.p1Wins || 0, winsB: record.p2Wins || 0, total: record.total || 0 };
        } else {
          return { winsA: record.p2Wins || 0, winsB: record.p1Wins || 0, total: record.total || 0 };
        }
      };

      // ===================== SALÓN DE FAMA =====================
      const HOF_TEST_PLAYER = 'TEST';
      const hofDateValue = (p) => {
        const raw = p.fechaIso || p.timestamp || p.fecha || '';
        const d = new Date(raw);
        return Number.isNaN(d.getTime()) ? 0 : d.getTime();
      };

      const hofParticipants = (p) => ({
        winners: p.ganadores || (p.ganador ? [p.ganador] : []),
        losers: p.perdedores || (p.perdedor ? [p.perdedor] : [])
      });

      const hofIsRealPlayer = (name) => String(name || '').trim().toUpperCase() !== HOF_TEST_PLAYER;
      const hofIsRealGame = (p) => {
        const { winners, losers } = hofParticipants(p);
        return [...winners, ...losers].every(hofIsRealPlayer);
      };

      const hofData = useMemo(() => {
        // TEST queda completamente fuera del Salón de Fama.
        const games = [...approvedPartidas].filter(hofIsRealGame).sort((a,b) => hofDateValue(a) - hofDateValue(b));
        const cutoff = Date.now() - (hofWindowDays * 24 * 60 * 60 * 1000);
        const recent = games.filter(p => hofDateValue(p) >= cutoff);

        const eligible = rankingData.filter(r => r.nombre !== HOF_TEST_PLAYER && r.pj >= 20);
        const wrKing = eligible.length ? [...eligible].sort((a,b) => (b.wrPct-a.wrPct) || (b.puntos-a.puntos))[0] : null;

        // 30-0 / 0-30 es HUMILLACIÓN y NO entra en Palizas legendarias.
        const humillaciones = games.map(p => ({
          ...p,
          displayDate: p.fecha || p.fechaIso || '—'
        })).filter(p => Number(p.ptsGanador || 0) === 30 && Number(p.ptsPerdedor || 0) === 0)
          .sort((a,b) => hofDateValue(b)-hofDateValue(a));

        const blowouts = games.map(p => ({
          ...p,
          diff: Math.abs(Number(p.ptsGanador || 0) - Number(p.ptsPerdedor || 0)),
          displayDate: p.fecha || p.fechaIso || '—'
        })).filter(p => p.diff > 0 && !(Number(p.ptsGanador || 0) === 30 && Number(p.ptsPerdedor || 0) === 0))
          .sort((a,b) => b.diff-a.diff || hofDateValue(b)-hofDateValue(a)).slice(0,5);

        const lossRun = {};
        let perroGrupo = null;
        games.forEach(p => {
          const {winners, losers} = hofParticipants(p);
          winners.forEach(w => { lossRun[w]=0; });
          losers.forEach(l => {
            lossRun[l]=(lossRun[l]||0)+1;
            if (!perroGrupo || lossRun[l] > perroGrupo.streak) perroGrupo={jugador:l,streak:lossRun[l]};
          });
        });

        // Rivalidades: SOLO 1vs1 (sin 2vs2 ni 3vs3).
        const rivalryPairs = {};
        recent.filter(p => p.tipo === '1v1').forEach(p => {
          const {winners, losers}=hofParticipants(p);
          winners.forEach(w=>losers.forEach(l=>{
            const key=[w,l].sort().join(':');
            rivalryPairs[key]=(rivalryPairs[key]||0)+1;
          }));
        });
        const rivalry = Object.entries(rivalryPairs).sort((a,b)=>b[1]-a[1])[0] || null;

        const currentStreaks = {};
        const pairRun = {};
        const pairBest = {};
        const allRun = {};
        let cutRacha = null;

        games.forEach(p => {
          const { winners, losers } = hofParticipants(p);
          winners.forEach(w => {
            currentStreaks[w] = (currentStreaks[w] || 0) + 1;
            allRun[w] = (allRun[w] || 0) + 1;
            losers.forEach(l => {
              const key = `${w}|${l}`;
              pairRun[key] = (pairRun[key] || 0) + 1;
              pairBest[key] = Math.max(pairBest[key] || 0, pairRun[key]);
              const victimRun = allRun[l] || 0;
              if (victimRun >= 5 && (!cutRacha || hofDateValue(p) > hofDateValue(cutRacha.partida))) {
                cutRacha = { winner:w, victim:l, brokenStreak:victimRun, partida:p };
              }
            });
          });
          losers.forEach(l => {
            currentStreaks[l] = 0;
            allRun[l] = 0;
            winners.forEach(w => { pairRun[`${w}|${l}`] = 0; });
          });
        });

        const currentStreak = Object.entries(currentStreaks)
          .map(([nombre, streak]) => ({nombre, streak}))
          .filter(x => x.streak > 0)
          .sort((a,b)=>b.streak-a.streak)[0] || null;

        let fatherSon = null;
        Object.entries(pairBest).forEach(([key, count]) => {
          if (count < 5) return;
          const [father, son] = key.split('|');
          if (!fatherSon || count > fatherSon.count) fatherSon = {father, son, count};
        });

        // MEJOR JUGADOR en los últimos X días. Solo jugadores reales, mínimo 5 PJ.
        const recentStats = {};
        recent.forEach(p => {
          const { winners, losers } = hofParticipants(p);
          winners.forEach(w => { recentStats[w] = recentStats[w] || {g:0,l:0}; recentStats[w].g++; });
          losers.forEach(l => { recentStats[l] = recentStats[l] || {g:0,l:0}; recentStats[l].l++; });
        });
        const recentKing = Object.entries(recentStats)
          .filter(([nombre]) => nombre !== HOF_TEST_PLAYER)
          .map(([nombre,v]) => ({nombre, ...v, pj:v.g+v.l, wr:(v.g+v.l)?Math.round(v.g/(v.g+v.l)*100):0}))
          .filter(x=>x.pj>=5)
          .sort((a,b)=>b.wr-a.wr || b.g-a.g)[0] || null;

        const topOne = rankingData.find(r => r.nombre !== HOF_TEST_PLAYER && r.pj > 0)?.nombre || null;
        let fallOfKing = null;
        if (topOne) {
          for (let i=games.length-1;i>=0;i--) {
            const {winners, losers}=hofParticipants(games[i]);
            if (losers.includes(topOne) && winners.length) { fallOfKing={winner:winners[0], king:topOne, partida:games[i]}; break; }
          }
        }

        // El Mejor Dúo = pareja de 2vs2 con más victorias. TEST queda fuera.
        const duoWins = {};
        games.filter(p => p.tipo === '2v2').forEach(p => {
          const { winners } = hofParticipants(p);
          if (winners.length !== 2 || winners.some(w => !hofIsRealPlayer(w))) return;
          const duoKey = [...winners].sort().join(' & ');
          duoWins[duoKey] = (duoWins[duoKey] || 0) + 1;
        });
        const bestDuo = Object.entries(duoWins).sort((a,b)=>b[1]-a[1])[0] || null;

        return {wrKing, humillaciones, blowouts, perroGrupo, rivalry, currentStreak, fatherSon, recentKing, cutRacha, fallOfKing, bestDuo};
      }, [approvedPartidas, rankingData, hofWindowDays]);

      const rarityMeta = {
        COMUN:{label:'Común',icon:'⚪',cls:'border-slate-500/40 bg-slate-700/20 text-slate-300'},
        RARO:{label:'Raro',icon:'🔵',cls:'border-blue-500/40 bg-blue-950/30 text-blue-300'},
        EPICO:{label:'Épico',icon:'🟣',cls:'border-purple-500/40 bg-purple-950/30 text-purple-300'},
        LEGENDARIO:{label:'Legendario',icon:'🟡',cls:'border-amber-400/60 bg-amber-500/10 text-amber-300'}
      };

      // ================= LOGROS FIJOS DE LA LIGA =================
      // Se calculan exclusivamente con partidas APROBADAS y nunca se crean manualmente.
      const FIXED_ACHIEVEMENTS = [
        { id:'primeras10', nombre:'Primeras 10', descripcion:'Gana 10 partidas de Liga.', emoji:'🔟', rareza:'RARO', tipo:'GANADAS', objetivo:10 },
        { id:'racha10', nombre:'Racha de Victorias', descripcion:'Gana 10 partidas consecutivas sin perder.', emoji:'🔥', rareza:'LEGENDARIO', tipo:'RACHA', objetivo:10 },
        { id:'centena', nombre:'Centena', descripcion:'Alcanza 100 puntos de Liga.', emoji:'💯', rareza:'LEGENDARIO', tipo:'PUNTOS', objetivo:100 },
        { id:'regular', nombre:'Jugador Regular', descripcion:'Disputa 25 partidas de Liga.', emoji:'🎴', rareza:'RARO', tipo:'PJ', objetivo:25 },
        { id:'manoFirme', nombre:'Mano Firme', descripcion:'Consigue 70% de Win Rate con mínimo 10 partidas.', emoji:'🎯', rareza:'EPICO', tipo:'WINRATE', objetivo:70, minimo:10 },
        { id:'sinPiedad', nombre:'Sin Piedad', descripcion:'Gana una partida por 30 a 0.', emoji:'💀', rareza:'LEGENDARIO', tipo:'PERFECTA', objetivo:1 },
        { id:'parca', nombre:'PARCA', descripcion:'Gana al menos una vez contra todos los jugadores de la tabla.', emoji:'☠️', rareza:'LEGENDARIO', tipo:'TODOS', objetivo:1 },
        { id:'paliza', nombre:'Paliza', descripcion:'Gana una partida por una diferencia de 20 puntos o más.', emoji:'💥', rareza:'EPICO', tipo:'DIFERENCIA', objetivo:20 },
        { id:'hugo', nombre:'Ganarle a Hugo', descripcion:'Le gana al jugador HUGO 3 veces.', emoji:'😈', rareza:'COMUN', tipo:'HUGO', objetivo:3 }
      ];

      const achievementRarityClass = (rareza, unlocked=false) => {
        const base = {
          COMUN:'border-slate-600/60 bg-slate-800/60 text-slate-300',
          RARO:'border-blue-500/40 bg-blue-950/30 text-blue-300',
          EPICO:'border-purple-500/40 bg-purple-950/30 text-purple-300',
          LEGENDARIO:'border-amber-400/50 bg-amber-500/10 text-amber-300'
        }[rareza] || rarityMeta.COMUN.cls;
        return unlocked ? `${base} shadow-lg` : 'border-slate-800 bg-slate-900/60 text-slate-500';
      };

      const achievementProgressForPlayer = useCallback((playerName, gamesForCalc = approvedPartidas, rankingForCalc = rankingData) => {
        const player = String(playerName || '').toUpperCase();
        const realPlayers = jugadores.filter(j => j !== HOF_TEST_PLAYER);
        const ordered = [...gamesForCalc].sort((a,b) => {
          const da = new Date(a.fechaIso || a.fecha || a.timestamp || 0).getTime() || a.timestamp || 0;
          const db = new Date(b.fechaIso || b.fecha || b.timestamp || 0).getTime() || b.timestamp || 0;
          return da - db;
        });
        const wins = ordered.filter(g => (g.ganadores || (g.ganador ? [g.ganador] : [])).includes(player));
        const losses = ordered.filter(g => (g.perdedores || (g.perdedor ? [g.perdedor] : [])).includes(player));
        const pj = wins.length + losses.length;
        const puntos = (rankingForCalc.find(r => r.nombre === player)?.puntos) || 0;
        const wr = pj ? Math.round((wins.length / pj) * 100) : 0;

        let current = 0, maxStreak = 0;
        ordered.forEach(g => {
          const winners = (g.ganadores || (g.ganador ? [g.ganador] : [])).map(String);
          const losers = (g.perdedores || (g.perdedor ? [g.perdedor] : [])).map(String);
          if (winners.includes(player)) { current += 1; maxStreak = Math.max(maxStreak, current); }
          if (losers.includes(player)) current = 0;
        });

        const opponentsBeaten = new Set();
        const perfectWins = wins.filter(g => Number(g.ptsGanador) === 30 && Number(g.ptsPerdedor) === 0);
        const blowoutWins = wins.filter(g => (Number(g.ptsGanador) - Number(g.ptsPerdedor)) >= 20);
        const hugoWins = wins.filter(g => (g.perdedores || (g.perdedor ? [g.perdedor] : [])).some(l => String(l).toUpperCase() === 'HUGO'));
        ordered.forEach(g => {
          const winners = (g.ganadores || (g.ganador ? [g.ganador] : [])).map(String);
          const losers = (g.perdedores || (g.perdedor ? [g.perdedor] : [])).map(String);
          if (winners.includes(player)) losers.filter(l => l !== HOF_TEST_PLAYER).forEach(l => opponentsBeaten.add(l.toUpperCase()));
        });
        const opponentsTarget = realPlayers.filter(j => j !== player && j !== HOF_TEST_PLAYER);
        const allBeaten = opponentsTarget.length > 0 && opponentsTarget.every(op => opponentsBeaten.has(op.toUpperCase()));

        const values = {
          ganadas:wins.length, pj, puntos, wr, racha:maxStreak,
          perfectas:perfectWins.length, diferencia:blowoutWins.length,
          hugo:hugoWins.length, todos:allBeaten ? 1 : 0,
          rivalesDerrotados: opponentsTarget.filter(op => opponentsBeaten.has(op.toUpperCase())).length,
          rivalesObjetivo: opponentsTarget.length
        };

        return FIXED_ACHIEVEMENTS.map(a => {
          let progreso = 0, desbloqueado = false, textoProgreso = '';
          switch (a.tipo) {
            case 'GANADAS': progreso = values.ganadas; desbloqueado = progreso >= a.objetivo; textoProgreso = `${Math.min(progreso,a.objetivo)}/${a.objetivo} victorias`; break;
            case 'RACHA': progreso = values.racha; desbloqueado = progreso >= a.objetivo; textoProgreso = `${Math.min(progreso,a.objetivo)}/${a.objetivo} consecutivas`; break;
            case 'PUNTOS': progreso = values.puntos; desbloqueado = progreso >= a.objetivo; textoProgreso = `${Math.min(progreso,a.objetivo)}/${a.objetivo} puntos`; break;
            case 'PJ': progreso = values.pj; desbloqueado = progreso >= a.objetivo; textoProgreso = `${Math.min(progreso,a.objetivo)}/${a.objetivo} partidas`; break;
            case 'WINRATE': progreso = values.pj >= a.minimo ? values.wr : Math.min(values.pj, a.minimo); desbloqueado = values.pj >= a.minimo && values.wr >= a.objetivo; textoProgreso = values.pj < a.minimo ? `${values.pj}/${a.minimo} partidas mínimas` : `${values.wr}% / ${a.objetivo}% WR`; break;
            case 'PERFECTA': progreso = Math.min(values.perfectas,1); desbloqueado = values.perfectas >= 1; textoProgreso = desbloqueado ? '30 - 0 conseguido' : 'Todavía sin 30 - 0'; break;
            case 'TODOS': progreso = values.rivalesDerrotados; desbloqueado = values.todos === 1; textoProgreso = `${values.rivalesDerrotados}/${values.rivalesObjetivo || 0} rivales`; break;
            case 'DIFERENCIA': progreso = values.diferencia ? a.objetivo : 0; desbloqueado = values.diferencia >= 1; textoProgreso = desbloqueado ? 'Diferencia de 20+ conseguida' : 'Necesita una diferencia de 20+'; break;
            case 'HUGO': progreso = values.hugo; desbloqueado = progreso >= a.objetivo; textoProgreso = `${Math.min(progreso,a.objetivo)}/${a.objetivo} victorias vs HUGO`; break;
          }
          return { ...a, progreso, desbloqueado, textoProgreso, stats: values };
        });
      }, [approvedPartidas, rankingData, jugadores]);

      const myAchievements = useMemo(() => {
        if (!currentUser) return [];

      const achievementUnlockedCount = useMemo(() => myAchievements.filter(a => a.desbloqueado).length, [myAchievements]);

      const hofAddManualTitle = async (e) => {

          const log={id:`audit_${id}`,email:currentUser.email,jugadorNombre:currentUser.jugadorNombre,fecha:new Date().toLocaleString('es-AR'),timestamp:Date.now(),role:'ADMIN',tipo:'HOF_TITLE',accion:'AGREGÓ TÍTULO',detalle:`${hofTitlePlayer} → ${hofTitleName.trim()}`};
          await setDoc(doc(db,'artifacts',appId,'public','data','auditLogs',log.id),log);
          setHofTitleName(''); setHofTitleNote('');
          setFeedback('🏆 Título agregado al Salón de Fama.'); setTimeout(()=>setFeedback(''),3000);
        } catch(err) { console.error(err); setFeedback('❌ No se pudo guardar el título.'); setTimeout(()=>setFeedback(''),3000); }
      };

      const hofDeleteManualTitle = async (title) => {

          const log={id:`audit_del_${Date.now()}`,email:currentUser.email,jugadorNombre:currentUser.jugadorNombre,fecha:new Date().toLocaleString('es-AR'),timestamp:Date.now(),role:'ADMIN',tipo:'HOF_TITLE',accion:'QUITÓ TÍTULO',detalle:`${title.jugador} → ${title.titulo}`};
          await setDoc(doc(db,'artifacts',appId,'public','data','auditLogs',log.id),log);
        } catch(err) { console.error(err); }
      };

      // Guarda el cambio de Mejor Jugador para el historial visual.
      useEffect(() => {

        const storageKey = `truco_league_hof_king_${hofWindowDays}`;
        let previous = null;
        try { previous = localStorage.getItem(storageKey); } catch(e) {}
        if (previous === currentKing) return;
        try { localStorage.setItem(storageKey, currentKing); } catch(e) {}
        if (!previous || previous === currentKing) return;
        const {db,appId,setDoc,doc}=window.TrucoDB||{};
        if (db) {
          const log={id:`hof_king_${hofWindowDays}_${Date.now()}`,email:'system',jugadorNombre:'TRUCO LEAGUE',fecha:new Date().toLocaleString('es-AR'),timestamp:Date.now(),role:'SYSTEM',tipo:'HOF_TITLE',accion:'CAMBIO DE MEJOR JUGADOR',detalle:`Antes ${previous} era el Mejor Jugador 🏆 · Ahora ${currentKing} tomó el trono`};
          setDoc(doc(db,'artifacts',appId,'public','data','auditLogs',log.id),log).catch(()=>{});
        }
      }, [hofData.recentKing?.nombre, hofWindowDays]);

      const currentH2H = useMemo(() => {
        return getH2HNumericStats(h2hP1, h2hP2);
      }, [h2hData, h2hP1, h2hP2]);

      const hofRivalryPairsForUI = useMemo(() => {
        const map = {};
        approvedPartidas.filter(p => p.tipo === '1v1' && hofIsRealGame(p)).forEach(p => {
          const { winners, losers } = hofParticipants(p);
          winners.forEach(w => losers.forEach(l => {
            const key = [w,l].sort().join(':');
            map[key] = (map[key] || 0) + 1;
          }));
        });
        return map;
      }, [approvedPartidas]);

      return (
        <div className={`min-h-screen flex flex-col bg-slate-950 text-slate-100 ${deviceMode === 'pc' ? 'pb-6' : 'pb-20 lg:pb-0'}`}>
          
          {/* Header principal */}
          <header className="bg-slate-900/90 border-b border-slate-800 sticky top-0 z-40 backdrop-blur-md">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">

                <span className="text-3xl">🎴</span>

                    TRUCO LEAGUE

                <button

                >

                {currentUser?.isAdmin && (

                {currentUser?.isAdmin && (

                {currentUser?.isAdmin && (

              <div className="flex items-center gap-2 sm:gap-3">

                                  <span className="text-slate-500">{p.fecha || '—'}</span>
                                </div>
                                <div className="mt-2 flex items-center justify-between gap-2 text-sm font-black">
                                  <span className="text-emerald-400 truncate">👑 {p.ganador} ({p.ptsGanador})</span>
                                  <span className="text-slate-600 text-[10px]">VS</span>
                                  <span className="text-red-400 truncate">💀 {p.perdedor} ({p.ptsPerdedor})</span>
                                </div>
                                {p.offlineQueued && <p className="text-[10px] text-amber-300 mt-2">📴 Guardada sin Wi‑Fi · se sincronizará automáticamente al volver Internet.</p>}
                              </div>
                            ))}
                          </div>
                        )}
                      </div>

                      <button onClick={handleLogout} className="w-full py-3 bg-slate-900 hover:bg-red-950/50 border border-slate-800 hover:border-red-800/60 text-slate-300 hover:text-red-300 rounded-xl text-xs font-black transition">🚪 Cerrar sesión</button>
                    </>
                  );
                })()}
              </div>
            )}

            {/* AUDITORÍA */}
            {activeTab === 'auditoria' && currentUser?.isAdmin && (
              <div className="space-y-4">
                <h2 className="text-2xl font-extrabold text-white">📋 Log de Accesos</h2>
                <div className="glass-card rounded-2xl overflow-hidden border border-slate-800">
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-sm text-slate-300">
                      <thead className="bg-slate-900/90 text-xs uppercase tracking-wider text-slate-400 border-b border-slate-800">
                        <tr>
                          <th className="py-3 px-4">Hora</th>
                          <th className="py-3 px-4">Perfil</th>
                          <th className="py-3 px-4">Correo</th>
                          <th className="py-3 px-4">Rol</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800/60">
                        {auditLogs.map(log => (
                          <tr key={log.id} className="hover:bg-slate-800/40">
                            <td className="py-3 px-4 text-xs font-mono text-slate-400">{log.fecha}</td>
                            <td className="py-3 px-4 font-bold text-white">{log.jugadorNombre}</td>
                            <td className="py-3 px-4 text-xs font-mono text-slate-300">{log.email}</td>
                            <td className="py-3 px-4 text-xs font-bold text-emerald-400">{log.role}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* Menú inferior móvil */}
          {(deviceMode === 'mobile' || (!deviceMode)) && (
            <div className={`fixed bottom-0 left-0 right-0 z-50 bg-slate-900/95 backdrop-blur-lg border-t border-slate-800 flex justify-around items-center py-2 px-1 shadow-2xl ${deviceMode === 'mobile' ? 'flex' : 'lg:hidden'}`}>
              <button
                onClick={() => setActiveTab('ranking')}
                className={`flex flex-col items-center justify-center py-1 px-2 rounded-xl transition ${
                  activeTab === 'ranking' ? 'text-emerald-400 font-bold scale-105' : 'text-slate-400'
                }`}
              >
                <span className="text-xl">🏆</span>
                <span className="text-[10px] tracking-tight mt-0.5">Ranking</span>
              </button>

              <button
                onClick={() => setActiveTab('cargar')}
                className={`flex flex-col items-center justify-center py-1 px-2 rounded-xl transition ${
                  activeTab === 'cargar' ? 'text-emerald-400 font-bold scale-105' : 'text-slate-400'
                }`}
              >
                <span className="text-xl">⚡</span>
                <span className="text-[10px] tracking-tight mt-0.5">Jugar</span>
              </button>

              {currentUser?.isAdmin && (
                <button
                  onClick={() => setActiveTab('aprobaciones')}
                  className={`flex flex-col items-center justify-center py-1 px-2 rounded-xl transition relative ${
                    activeTab === 'aprobaciones' ? 'text-emerald-400 font-bold scale-105' : 'text-slate-400'
                  }`}
                >
                  <span className="text-xl">⏳</span>
                  <span className="text-[10px] tracking-tight mt-0.5">Permisos</span>
                  {pendingPartidas.length > 0 && (
                    <span className="absolute top-0 right-1 w-4 h-4 bg-amber-500 text-slate-950 text-[9px] font-black rounded-full flex items-center justify-center">
                      {pendingPartidas.length}
                    </span>
                  )}
                </button>
              )}

              <button
                onClick={() => setActiveTab('historial')}
                className={`flex flex-col items-center justify-center py-1 px-2 rounded-xl transition ${
                  activeTab === 'historial' ? 'text-emerald-400 font-bold scale-105' : 'text-slate-400'
                }`}
              >
                <span className="text-xl">📜</span>
                <span className="text-[10px] tracking-tight mt-0.5">Hoy</span>
              </button>

              <button
                onClick={() => setActiveTab('salon')}
                className={`flex flex-col items-center justify-center py-1 px-2 rounded-xl transition ${
                  activeTab === 'salon' ? 'text-amber-400 font-bold scale-105' : 'text-slate-400'
                }`}
              >
                <span className="text-xl">🏛️</span>
                <span className="text-[10px] tracking-tight mt-0.5">Fama</span>
              </button>

              <button
                onClick={() => setActiveTab('h2h')}
                className={`flex flex-col items-center justify-center py-1 px-2 rounded-xl transition ${
                  activeTab === 'h2h' ? 'text-emerald-400 font-bold scale-105' : 'text-slate-400'
                }`}
              >
                <span className="text-xl">⚔️</span>
                <span className="text-[10px] tracking-tight mt-0.5">H2H</span>
              </button>

              {currentUser ? (
                <button
                  onClick={() => setActiveTab('perfil')}
                  className={`flex flex-col items-center justify-center py-1 px-2 rounded-xl transition ${
                    activeTab === 'perfil' ? 'text-emerald-400 font-bold scale-105' : 'text-slate-400'
                  }`}
                >
                  <span className="text-xl">👤</span>
                  <span className="text-[10px] tracking-tight mt-0.5">Perfil</span>
                </button>
              ) : (
                <button
                  onClick={() => { setAuthMode('LOGIN'); setModalError(''); setShowLoginModal(true); }}
                  className="flex flex-col items-center justify-center py-1 px-2 text-emerald-400"
                >
                  <span className="text-xl">🔑</span>
                  <span className="text-[10px] font-bold mt-0.5">Ingresar</span>
                </button>
              )}
            </div>
          )}

          {/* Modal Modo Dispositivo */}
          {showDeviceModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-md p-4">
              <div className="glass-card rounded-2xl p-6 max-w-sm w-full text-center space-y-4 border border-slate-800 shadow-2xl">
                <span className="text-4xl">📱💻</span>
                <h3 className="text-lg font-extrabold text-white">Selecciona tu Modo de Vista</h3>
                <p className="text-xs text-slate-400">Puedes cambiar entre menú superior de PC o barra flotante móvil en cualquier momento.</p>
                <div className="grid grid-cols-2 gap-3 pt-2">
                  <button
                    onClick={() => handleSelectDevice('pc')}
                    className="py-3 bg-slate-800 hover:bg-slate-700 font-bold text-xs text-white rounded-xl border border-slate-700 transition"
                  >
                    💻 Modo PC
                  </button>
                  <button
                    onClick={() => handleSelectDevice('mobile')}
                    className="py-3 bg-emerald-600 hover:bg-emerald-500 font-bold text-xs text-white rounded-xl shadow transition"
                  >
                    📱 Modo Móvil
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Modal Login / Registro */}
          {showLoginModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
              <div className="glass-card rounded-2xl p-6 max-w-md w-full border border-slate-800 shadow-2xl space-y-4">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h3 className="text-lg font-extrabold text-white">
                    {authMode === 'LOGIN' ? '🔑 Ingresar a la Liga' : '📝 Solicitar Registro'}
                  </h3>
                  <button onClick={() => setShowLoginModal(false)} className="text-slate-400 hover:text-white font-bold text-sm p-1">
                    ✕
                  </button>
                </div>

                {modalError && (
                  <div className="bg-red-950/80 border border-red-800/60 text-red-200 text-xs p-3 rounded-xl">
                    {modalError}
                  </div>
                )}

                {authMode === 'LOGIN' ? (
                  <form onSubmit={handleLoginSubmit} className="space-y-4">
                    <div>
                      <label className="text-xs font-bold text-slate-300 block mb-1">Correo Electrónico</label>
                      <input
                        type="email"
                        placeholder="tuemail@ejemplo.com"
                        value={loginEmailInput}
                        onChange={e => setLoginEmailInput(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-emerald-500"
                      />
                    </div>

                    <div>
                      <label className="text-xs font-bold text-slate-300 block mb-1">Contraseña</label>
                      <input
                        type="password"
                        placeholder="••••••••"
                        value={loginPasswordInput}
                        onChange={e => setLoginPasswordInput(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-emerald-500"
                      />
                    </div>

                    <button
                      type="submit"
                      disabled={isSubmitting}
                      className="w-full py-3 bg-emerald-600 hover:bg-emerald-500 font-extrabold text-xs text-white rounded-xl shadow transition"
                    >
                      {isSubmitting ? 'Iniciando...' : 'Iniciar Sesión'}
                    </button>

                    <div className="text-center pt-2">
                      <button
                        type="button"
                        onClick={() => { setAuthMode('REGISTER'); setModalError(''); }}
                        className="text-xs font-bold text-emerald-400 hover:underline"
                      >
                        ¿No tienes cuenta? Solicita tu registro aquí
                      </button>
                    </div>
                  </form>
                ) : (
                  <form onSubmit={handleRegisterSubmit} className="space-y-3">
                    <div>
                      <label className="text-xs font-bold text-slate-300 block mb-1">Nombre de Jugador</label>
                      <input
                        type="text"
                        placeholder="EJ: CARLOS"
                        value={regNombreInput}
                        onChange={e => setRegNombreInput(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-xs text-white uppercase focus:outline-none focus:border-emerald-500"
                      />
                    </div>

                    <div>
                      <label className="text-xs font-bold text-slate-300 block mb-1">Correo Electrónico</label>
                      <input
                        type="email"
                        placeholder="correo@ejemplo.com"
                        value={loginEmailInput}
                        onChange={e => setLoginEmailInput(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-emerald-500"
                      />
                    </div>

                    <div>
                      <label className="text-xs font-bold text-slate-300 block mb-1">Confirmar Correo</label>
                      <input
                        type="email"
                        placeholder="correo@ejemplo.com"
                        value={regEmailConfirmInput}
                        onChange={e => setRegEmailConfirmInput(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-emerald-500"
                      />
                    </div>

                    <div>
                      <label className="text-xs font-bold text-slate-300 block mb-1">Contraseña</label>
                      <input
                        type="password"
                        placeholder="••••••••"
                        value={loginPasswordInput}
                        onChange={e => setLoginPasswordInput(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-emerald-500"
                      />
                    </div>

                    <div>
                      <label className="text-xs font-bold text-slate-300 block mb-1">Confirmar Contraseña</label>
                      <input
                        type="password"
                        placeholder="••••••••"
                        value={regPasswordConfirmInput}
                        onChange={e => setRegPasswordConfirmInput(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-emerald-500"
                      />
                    </div>

                    <button
                      type="submit"
                      disabled={isSubmitting}
                      className="w-full py-3 bg-emerald-600 hover:bg-emerald-500 font-extrabold text-xs text-white rounded-xl shadow transition mt-2"
                    >
                      {isSubmitting ? 'Enviando...' : 'Enviar Solicitud a SAMU'}
                    </button>

                    <div className="text-center pt-1">
                      <button
                        type="button"
                        onClick={() => { setAuthMode('LOGIN'); setModalError(''); }}
                        className="text-xs font-bold text-slate-400 hover:underline"
                      >
                        ¿Ya tienes cuenta? Ingresar
                      </button>
                    </div>
                  </form>
                )}
              </div>
            </div>
          )}

          {/* Modal Confirmar Carga */}
          {showConfirmLoad && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-md p-4">
              <div className="glass-card rounded-2xl p-6 max-w-md w-full border border-amber-500/30 shadow-2xl space-y-4">
                <div className="flex items-center gap-3">
                  <span className="text-4xl">⚠️</span>
                  <div>
                    <h3 className="text-lg font-extrabold text-white">Confirmar carga de partida</h3>
                    <p className="text-xs text-slate-400 mt-1">Una vez confirmada, se enviará la partida {modoPartida} y no se volverá a preguntar.</p>
                  </div>
                </div>
                <div className="bg-slate-900/80 border border-slate-800 rounded-xl p-4 text-center">
                  <p className="text-sm font-black text-amber-300 uppercase">{modoPartida}</p>
                  <p className="text-xs text-slate-300 mt-1">Revisa jugadores y marcador antes de confirmar.</p>
                </div>
                <div className="flex gap-2">
                  <button type="button" onClick={()=>setShowConfirmLoad(false)} className="flex-1 py-2.5 bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-300 rounded-xl">Cancelar</button>
                  <button type="button" onClick={confirmarCargaPartida} disabled={isSubmitting} className="flex-1 py-2.5 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-xs font-black text-white rounded-xl shadow">✅ Confirmar</button>
                </div>
              </div>
            </div>
          )}

          {/* Modal Reinicio por Admin */}
          {showResetModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
              <div className="glass-card rounded-2xl p-6 max-w-md w-full border border-red-800/50 shadow-2xl space-y-4">
                <h3 className="text-lg font-extrabold text-red-400">⚠️ Reiniciar Tabla / Temporada</h3>
                <p className="text-xs text-slate-300">
                  Esta acción reiniciará las partidas, la tabla de clasificación y dará inicio a la siguiente temporada.
                </p>

                {resetError && <p className="text-xs text-red-400 font-bold">{resetError}</p>}

                <form onSubmit={handleResetLeague} className="space-y-4">
                  <input
                    type="password"
                    placeholder="Contraseña del Admin SAMU"
                    value={resetPassword}
                    onChange={e => setResetPassword(e.target.value)}
                    className="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-xs text-white focus:border-red-500"
                  />
                  <div className="flex gap-2">
                    <button
                      type="button"
                      onClick={() => setShowResetModal(false)}
                      className="flex-1 py-2.5 bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-300 rounded-xl"
                    >
                      Cancelar
                    </button>
                    <button
                      type="submit"
                      className="flex-1 py-2.5 bg-red-600 hover:bg-red-500 text-xs font-bold text-white rounded-xl shadow"
                    >
                      Confirmar Reinicio
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Modal Eliminar Partida */}
          {selectedMatchToDelete && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
              <div className="glass-card rounded-2xl p-6 max-w-md w-full border border-red-800/50 shadow-2xl space-y-4">
                <h3 className="text-lg font-extrabold text-red-400">🗑️ Eliminar Partida</h3>
                <p className="text-xs text-slate-300">Ingresa la contraseña de administrador para confirmar la eliminación de este partido.</p>

                {matchDeleteError && <p className="text-xs text-red-400 font-bold">{matchDeleteError}</p>}

                <form onSubmit={handleConfirmEliminarPartida} className="space-y-4">
                  <input
                    type="password"
                    placeholder="Contraseña de Admin"
                    value={matchDeletePassword}
                    onChange={e => setMatchDeletePassword(e.target.value)}
                    className="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-xs text-white"
                  />
                  <div className="flex gap-2">
                    <button
                      type="button"
                      onClick={() => setSelectedMatchToDelete(null)}
                      className="flex-1 py-2.5 bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-300 rounded-xl"
                    >
                      Cancelar
                    </button>
                    <button
                      type="submit"
                      className="flex-1 py-2.5 bg-red-600 hover:bg-red-500 text-xs font-bold text-white rounded-xl shadow"
                    >
                      Eliminar Partida
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
