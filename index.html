    const appId = typeof __app_id !== 'undefined' ? __app_id : 'truco-league-app';
    const firebaseConfig = typeof __firebase_config !== 'undefined' 
      ? (typeof __firebase_config === 'string' ? JSON.parse(__firebase_config) : __firebase_config)
      : {
          apiKey: "AIzaSyC_mFMEf8Ea2KYbtVe7iCrdgATftQtl8rE",
          authDomain: "truco-league-cf286.firebaseapp.com",
          projectId: "truco-league-cf286",
          storageBucket: "truco-league-cf286.firebasestorage.app",
          messagingSenderId: "1073966718355",
          appId: "1:1073966718355:web:1d343f97e28edb322fdc66"
        };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // Arranque único de Firebase. El login espera esta promesa para evitar que
    // un signInAnonymously tardío reemplace una sesión de correo/contraseña.
    const initFirebase = async () => {
      try {
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }
      } catch (e) {
        try { await signInAnonymously(auth); } catch (err) {}
      }
      return auth.currentUser || null;
    };

    const firebaseReady = initFirebase();

    window.TrucoDB = { 
      db, auth, appId, firebaseReady, collection, doc, setDoc, getDoc, getDocs, onSnapshot, addDoc, updateDoc, deleteDoc, deleteField, query, where, orderBy, limit, writeBatch, serverTimestamp,

  <!-- Código React Babel -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback, useRef } = React;

    // Configuración de Enlace Externo opcional
    const EXTERNAL_LINK_URL = "https://f7015652.truco-league.pages.dev/"; 
    const EXTERNAL_LINK_LABEL = "🌐 JUGAR ONLINE";

    const DEFAULT_JUGADORES = ["SAMU"];
    const ADMIN_EMAIL = "benitezsamuel930@gmail.com";
    const SEASON_DAYS = 45; // Duración de cada temporada en días
    const REQUIRE_VERIFIED_EMAIL = false;
    const MATCH_SCHEMA_VERSION = 2;
    const RATING_ENGINE_VERSION = 'MMR_V2';
    const MMR_DEFAULT = 1200;
    const MMR_K_NORMAL = 24;
    const MMR_K_CALIBRATION = 50;
    const MMR_CALIBRATION_GAMES = 5;

    // Cache pública de arranque: solo APROBADAS/JUGADORES. Nunca se guardan aquí cuentas ni pendientes.
    const PUBLIC_CACHE_VERSION = 'v2';
    const PUBLIC_MATCH_CACHE_KEY = `truco_league_public_matches_${PUBLIC_CACHE_VERSION}`;
    const PUBLIC_PLAYERS_CACHE_KEY = `truco_league_public_players_${PUBLIC_CACHE_VERSION}`;
    const safeReadJSON = (key, fallback = null) => {
      try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; } catch (e) { return fallback; }
    };
    const safeWriteJSON = (key, value, maxBytes = 3500000) => {
      try { const raw = JSON.stringify(value); if (new Blob([raw]).size > maxBytes) return false; localStorage.setItem(key, raw); return true; } catch (e) { return false; }
    };
    const readCachedApprovedMatches = () => {
      const value = safeReadJSON(PUBLIC_MATCH_CACHE_KEY, []);
      return Array.isArray(value) ? value.filter(p => p?.estado === 'APROBADA') : [];
    };
    const cacheApprovedMatches = (matches) => safeWriteJSON(PUBLIC_MATCH_CACHE_KEY, (matches || []).filter(p => p?.estado === 'APROBADA'));

    class AppErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { error: null }; }
      static getDerivedStateFromError(error) { return { error }; }
      componentDidCatch(error, info) { console.error('[Truco League] Error de interfaz:', error, info); document.getElementById('boot-screen')?.remove(); }
      render() {
        if (!this.state.error) return this.props.children;
        return <div className="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center p-6"><div className="max-w-md w-full rounded-2xl border border-red-500/20 bg-slate-900/80 p-6 text-center shadow-2xl"><div className="text-4xl">⚠️</div><h1 className="mt-3 text-xl font-black">Truco League tuvo un problema</h1><p className="mt-2 text-xs leading-5 text-slate-400">La app no pudo completar una parte de la interfaz. Tus datos de Firebase no se borraron.</p><button onClick={() => location.reload()} className="mt-5 w-full rounded-xl bg-emerald-600 px-4 py-3 text-xs font-black text-white">🔄 Recargar aplicación</button><p className="mt-3 text-[10px] text-slate-600 break-all">{String(this.state.error?.message || 'Error desconocido')}</p></div></div>;
      }
    }

    const makeId = (prefix='id') => {
      try { return `${prefix}_${crypto.randomUUID()}`; } catch(e) { return `${prefix}_${Date.now()}_${Math.random().toString(36).slice(2,10)}`; }
    };

    const normalizePlayerName = value => String(value || '').trim().toUpperCase();
    const matchParticipants = p => ({
      winners: (p?.ganadores || (p?.ganador ? [p.ganador] : [])).map(normalizePlayerName).filter(Boolean),
      losers: (p?.perdedores || (p?.perdedor ? [p.perdedor] : [])).map(normalizePlayerName).filter(Boolean)
    });

    const validateMatchRecord = (p, knownPlayers = []) => {
      const issues = [];
      const { winners, losers } = matchParticipants(p);
      const allPlayers = [...winners, ...losers];
      const scoreW = Number(p?.ptsGanador);
      const scoreL = Number(p?.ptsPerdedor);
      const expectedSize = p?.tipo === '1v1' ? 1 : p?.tipo === '2v2' ? 2 : p?.tipo === '3v3' ? 3 : 0;
      const expectedAward = p?.tipo === '1v1' ? 1 : (p?.tipo === '2v2' || p?.tipo === '3v3' ? 2 : 0);
      if (!p || !['1v1','2v2','3v3'].includes(p.tipo)) issues.push('Tipo inválido');
      if (!expectedSize || winners.length !== expectedSize || losers.length !== expectedSize) issues.push('Cantidad de jugadores inválida');
      if (allPlayers.length !== new Set(allPlayers).size) issues.push('Hay jugadores repetidos');
      if (winners.some(x => losers.includes(x))) issues.push('Jugador en ambos equipos');
      if (!Number.isFinite(scoreW) || !Number.isFinite(scoreL) || scoreW < 0 || scoreL < 0 || scoreW > 30 || scoreL > 30 || scoreW <= scoreL) issues.push('Marcador inválido');
      if (Number.isFinite(scoreW) && Number.isFinite(scoreL) && Number(p?.ventaja) !== scoreW - scoreL) issues.push('Ventaja no coincide con el marcador');
      if (expectedAward && Number(p?.puntosGanadorPorJugador || 0) !== expectedAward) issues.push('Puntos por ganador inválidos');
      if (p?.estado === 'APROBADA' && !p?.aprobadoAt) issues.push('Aprobada sin auditoría');
      if (knownPlayers.length) {
        const known = new Set(knownPlayers.map(normalizePlayerName));
        allPlayers.forEach(name => { if (!known.has(name)) issues.push(`Jugador inexistente: ${name}`); });
      }
      if (!p?.seasonNumber) issues.push('Sin temporada');
      if (Number(p?.schemaVersion || 0) < MATCH_SCHEMA_VERSION) issues.push('Esquema antiguo');
      return Array.from(new Set(issues));
    };

    const PLAYER_AVATAR_MAX_DIM = 112;
    const PLAYER_AVATAR_MAX_DATA_BYTES = 20000;
    const PLAYER_AVATAR_MAX_INPUT_BYTES = 8 * 1024 * 1024;
    const PLAYER_AVATAR_LOCK_MS = 21 * 24 * 60 * 60 * 1000;

    const valueToMs = (value) => {
      if (!value) return 0;
      if (typeof value === 'number') return value;
      if (typeof value.toMillis === 'function') return value.toMillis();
      if (typeof value.toDate === 'function') return value.toDate().getTime();
      if (value.seconds != null) return Number(value.seconds) * 1000 + Math.floor(Number(value.nanoseconds || value.nanos || 0) / 1000000);
      const parsed = new Date(value).getTime();
      return Number.isFinite(parsed) ? parsed : 0;
    };

    const avatarLockRemainingMs = (meta) => {
      if (!meta?.avatarData) return 0;
      const changedAt = valueToMs(meta.avatarUpdatedAt);
      return changedAt ? Math.max(0, changedAt + PLAYER_AVATAR_LOCK_MS - Date.now()) : 0;
    };

    const formatAvatarLockRemaining = (meta) => {
      const remaining = avatarLockRemainingMs(meta);
      if (!remaining) return '';
      const days = Math.floor(remaining / 86400000);
      const hours = Math.ceil((remaining % 86400000) / 3600000);
      if (days > 0) return `${days} día${days===1?'':'s'}` + (hours ? ` y ${hours} h` : '');
      return `${Math.max(1,hours)} h`;
    };

    const matchDateMs = (p) => {
      const raw = p?.fechaIso || p?.timestamp || p?.fecha || p?.createdAt || 0;
      if (raw && typeof raw.toMillis === 'function') return raw.toMillis();
      const parsed = new Date(raw).getTime();
      return Number.isFinite(parsed) ? parsed : Number(p?.timestamp || 0) || 0;
    };

    const formatMatchLabel = (p) => {
      const { winners, losers } = matchParticipants(p);
      const left = winners.join(' + ') || p?.ganador || '—';
      const right = losers.join(' + ') || p?.perdedor || '—';
      return `${left} ${Number(p?.ptsGanador ?? 0)} vs ${right} ${Number(p?.ptsPerdedor ?? 0)}`;
    };

    const initialsForPlayer = (name) => normalizePlayerName(name).split(/\s+/).filter(Boolean).slice(0,2).map(x => x[0]).join('') || 'TL';

    const dataUrlByteLength = (value) => {
      try { return new Blob([value || '']).size; } catch (e) { return String(value || '').length; }
    };

    const optimizeAvatarFile = (file, crop = null) => new Promise((resolve, reject) => {
      if (!file) return reject(new Error('No se seleccionó una imagen.'));
      if (file.size > PLAYER_AVATAR_MAX_INPUT_BYTES) return reject(new Error('La imagen original supera 8 MB.'));
      if (!/^image\/(jpeg|jpg|png|webp)$/i.test(file.type || '')) return reject(new Error('Usa JPG, PNG o WebP.'));

      const objectUrl = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        try {
          const nw = img.naturalWidth || img.width;
          const nh = img.naturalHeight || img.height;
          if (!nw || !nh) throw new Error('No se pudo leer la imagen.');
          const baseSide = Math.min(nw, nh);
          let sx = Math.max(0, (nw - baseSide) / 2);
          let sy = Math.max(0, (nh - baseSide) / 2);
          let side = baseSide;
          if (crop && Number.isFinite(crop.sx) && Number.isFinite(crop.sy) && Number.isFinite(crop.side)) {
            side = Math.min(baseSide, Math.max(1, crop.side));
            sx = Math.min(Math.max(0, crop.sx), nw - side);
            sy = Math.min(Math.max(0, crop.sy), nh - side);
          }

          const canvas = document.createElement('canvas');
          canvas.width = PLAYER_AVATAR_MAX_DIM;
          canvas.height = PLAYER_AVATAR_MAX_DIM;
          const ctx = canvas.getContext('2d', { alpha:false });
          ctx.fillStyle = '#111827';
          ctx.fillRect(0,0,PLAYER_AVATAR_MAX_DIM,PLAYER_AVATAR_MAX_DIM);
          ctx.drawImage(img, sx, sy, side, side, 0, 0, PLAYER_AVATAR_MAX_DIM, PLAYER_AVATAR_MAX_DIM);

          const qualities = [0.78,0.68,0.58,0.5,0.42,0.36];
          const candidates = [];
          qualities.forEach(q => {
            try {
              const webp = canvas.toDataURL('image/webp', q);
              if (webp && webp.startsWith('data:image/webp')) candidates.push(webp);
            } catch(e) {}
          });
          qualities.forEach(q => {
            try { candidates.push(canvas.toDataURL('image/jpeg', q)); } catch(e) {}
          });

          const valid = candidates.find(x => dataUrlByteLength(x) <= PLAYER_AVATAR_MAX_DATA_BYTES);
          if (!valid) throw new Error('No se pudo comprimir la imagen a un tamaño adecuado.');
          resolve(valid);
        } catch(err) { reject(err); }
        finally { URL.revokeObjectURL(objectUrl); }
      };
      img.onerror = () => { URL.revokeObjectURL(objectUrl); reject(new Error('No se pudo abrir la imagen.')); };
      img.src = objectUrl;
    });

    const AvatarCropModal = ({ editor, onCancel, onConfirm, saving }) => {
      const stageRef = useRef(null);

      useEffect(() => {
        if (!stageRef.current) return;
        const update = () => setStageSize(Math.max(240, Math.min(320, stageRef.current.getBoundingClientRect().width || 300)));
        update();
        const ro = new ResizeObserver(update);
        ro.observe(stageRef.current);
        return () => ro.disconnect();
      }, []);

      useEffect(() => {
        setZoom(1);
        setOffset({x:0,y:0});
      }, [editor?.url]);

      if (!editor) return null;
      const nw = editor.naturalWidth || 1;
      const nh = editor.naturalHeight || 1;
      const baseScale = Math.max(stageSize/nw, stageSize/nh);
      const displayScale = baseScale * zoom;
      const renderW = nw * displayScale;
      const renderH = nh * displayScale;
      const centeredLeft = (stageSize-renderW)/2;
      const centeredTop = (stageSize-renderH)/2;
      const minX = stageSize-renderW-centeredLeft;
      const maxX = -centeredLeft;
      const minY = stageSize-renderH-centeredTop;
      const maxY = -centeredTop;
      const clampOffset = (x,y) => ({
        x: Math.min(maxX, Math.max(minX, x)),
        y: Math.min(maxY, Math.max(minY, y))
      });
      const safeOffset = clampOffset(offset.x, offset.y);
      const left = centeredLeft + safeOffset.x;
      const top = centeredTop + safeOffset.y;
      const selectionSize = stageSize * 0.76;
      const selectionLeft = (stageSize - selectionSize) / 2;
      const selectionTop = selectionLeft;
      const cropSide = Math.min(nw,nh, selectionSize/displayScale);
      const crop = {
        sx: Math.max(0, Math.min(nw-cropSide, (selectionLeft-left)/displayScale)),
        sy: Math.max(0, Math.min(nh-cropSide, (selectionTop-top)/displayScale)),
        side: cropSide
      };
      const changeZoom = (rawZoom) => {
        const next = Math.min(3, Math.max(1, Number(rawZoom)||1));

          x: Math.min(maxX, Math.max(minX, dragRef.current.startX + e.clientX-dragRef.current.x)),
          y: Math.min(maxY, Math.max(minY, dragRef.current.startY + e.clientY-dragRef.current.y))

      return (
        <div className="fixed inset-0 z-[70] flex items-center justify-center bg-black/85 backdrop-blur-md p-4">

                <div><p className="text-[10px] uppercase tracking-[0.2em] font-black text-emerald-300">FOTO DE PERFIL</p><h3 className="text-xl font-black text-white mt-1">Ajusta tu foto</h3><p className="text-[11px] text-slate-400 mt-1">Arrastra la imagen y usa el zoom para elegir qué queda dentro del círculo.</p></div>
                <span className="text-2xl">📸</span>
              </div>
            </div>
            <div className="p-5 space-y-4">
              <div ref={stageRef} className="relative mx-auto w-[min(82vw,320px)] aspect-square rounded-2xl overflow-hidden bg-slate-950 border border-slate-800 touch-none select-none" onPointerDown={onPointerDown} onPointerMove={onPointerMove} onPointerUp={clearDrag} onPointerCancel={clearDrag} onWheel={(e)=>{ e.preventDefault(); const next=Math.min(3,Math.max(1,zoom-(e.deltaY>0?0.08:-0.08))); changeZoom(next); }}>
                <img src={editor.url} alt="Vista previa" draggable="false" className="absolute max-w-none select-none pointer-events-none" style={{width:renderW,height:renderH,left,top}} />
                <div className="absolute inset-0 pointer-events-none flex items-center justify-center">
                  <div className="w-[76%] aspect-square rounded-full border-2 border-white/90 shadow-[0_0_0_9999px_rgba(2,6,23,.70),0_0_35px_rgba(16,185,129,.18)]"></div>
                </div>
              </div>
              <div>
                <div className="flex items-center justify-between text-[10px] font-black text-slate-400 mb-2"><span>ZOOM</span><span className="text-emerald-300">{zoom.toFixed(2)}×</span></div>
                <input type="range" min="1" max="3" step="0.01" value={zoom} onChange={e=>changeZoom(e.target.value)} className="w-full accent-emerald-500" disabled={saving}/>
              </div>
              <div className="rounded-xl bg-slate-900/80 border border-slate-800 px-3 py-2.5 text-[10px] text-slate-400">La imagen se recorta y comprime automáticamente a <b className="text-slate-200">{PLAYER_AVATAR_MAX_DIM}×{PLAYER_AVATAR_MAX_DIM}</b> y menos de <b className="text-slate-200">{Math.round(PLAYER_AVATAR_MAX_DATA_BYTES/1024)} KB</b>.</div>
              <div className="grid grid-cols-2 gap-2"><button onClick={onCancel} disabled={saving} className="py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-xs font-black text-slate-300">Cancelar</button><button onClick={()=>onConfirm(crop)} disabled={saving} className="py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-xs font-black text-white">{saving?'Guardando…':'Usar esta foto'}</button></div>
            </div>
          </div>
        </div>
      );
    };

    const calculatePlayerStats = (playerNames, games, cutoffMs = null) => {
      const stats = {};
      (playerNames || []).forEach(j => {
        const n = normalizePlayerName(j);
        if (!n) return;
        stats[n] = {
          nombre:n, puntos:0, ganadas:0, perdidas:0, pj:0,
          ptsVentaja:0, mayorVentaja:0, mayorGoleada:0, mayorGoleadaLabel:'—', mejorPartidaLabel:'—',
          rachaTipo:null, rachaActual:0, rachaMax:0, formaReciente:[], historialResultados:[]
        };
      });

      const orderedGames = [...(games || [])]
        .filter(p => !cutoffMs || matchDateMs(p) >= cutoffMs)
        .sort((a,b) => matchDateMs(a) - matchDateMs(b));

      orderedGames.forEach(p => {
        const { winners, losers } = matchParticipants(p);
        const puntosPorGanador = (p.tipo === '2v2' || p.tipo === '3v3') ? 2 : 1;
        const ventaja = Math.max(0, Number(p.ventaja || (Number(p.ptsGanador || 0) - Number(p.ptsPerdedor || 0))));
        const scoreMargin = ventaja;
        winners.forEach(g => {
          if (!stats[g]) return;
          const s = stats[g];
          s.puntos += puntosPorGanador;
          s.ganadas += 1;
          s.pj += 1;
          s.ptsVentaja += ventaja;
          s.mayorVentaja = Math.max(s.mayorVentaja, scoreMargin);
          if (scoreMargin >= s.mayorGoleada) {
            s.mayorGoleada = scoreMargin;
            s.mayorGoleadaLabel = formatMatchLabel(p);
          }
          s.mejorPartidaLabel = scoreMargin >= s.mayorGoleada ? formatMatchLabel(p) : s.mejorPartidaLabel;
          s.rachaTipo = 'win';
          s.rachaActual = s.rachaTipo === 'win' ? (s.historialResultados.at(-1) === 'V' ? s.rachaActual + 1 : 1) : 1;
          s.rachaMax = Math.max(s.rachaMax, s.rachaActual);
          s.historialResultados.push('V');
          s.formaReciente = [...s.formaReciente, 'V'].slice(-5);
        });
        losers.forEach(l => {
          if (!stats[l]) return;
          const s = stats[l];
          s.perdidas += 1;
          s.pj += 1;
          s.rachaTipo = 'loss';
          s.rachaActual = s.historialResultados.at(-1) === 'D' ? s.rachaActual + 1 : 1;
          s.historialResultados.push('D');
          s.formaReciente = [...s.formaReciente, 'D'].slice(-5);
        });
      });

      return Object.values(stats).map(p => ({
        ...p,
        wrPct: p.pj > 0 ? Math.round((p.ganadas / p.pj) * 100) : 0,
        historialResultados: p.historialResultados.slice(),
        formaReciente: p.formaReciente.slice(-5)
      }));
    };


    const MMR_DIVISIONS = [
      { id:'BRONCE', label:'BRONCE', emoji:'🟫', min:0, max:999 },
      { id:'PLATA', label:'PLATA', emoji:'⬜', min:1000, max:1399 },
      { id:'ORO', label:'ORO', emoji:'🟨', min:1400, max:1699 },
      { id:'PLATINO', label:'PLATINO', emoji:'🟦', min:1700, max:1999 },
      { id:'DIAMANTE', label:'DIAMANTE', emoji:'💎', min:2000, max:2299 },
      { id:'LEYENDA', label:'LEYENDA', emoji:'👑', min:2300, max:Infinity }
    ];
    const getDivisionForMMR = (mmr, calibrating = false) => {
      if (calibrating) return { id:'CALIBRANDO', label:'CALIBRANDO', emoji:'⚔️', min:0, max:Infinity };
      const value = Number(mmr || 0);
      return MMR_DIVISIONS.find(d => value >= d.min && value <= d.max) || MMR_DIVISIONS[0];
    };
    const roundMmr = value => Math.round(Number(value || 0));
    const normalizedAdvantageMultiplier = margin => 0.85 + 0.30 * (Math.min(30, Math.max(0, Number(margin || 0))) / 30);
    const expectedScoreFromRatings = (teamA, teamB) => 1 / (1 + Math.pow(10, (Number(teamB) - Number(teamA)) / 400));
    const mmrSeedForPlayer = (seasonConfig, name) => {
      const seeds = seasonConfig?.mmrSeeds && typeof seasonConfig.mmrSeeds === 'object' ? seasonConfig.mmrSeeds : {};
      const seed = Number(seeds[normalizePlayerName(name)]);
      return Number.isFinite(seed) ? seed : MMR_DEFAULT;
    };
    const seasonGamesOnly = (games, seasonNumber) => (games || []).filter(p => !p?.seasonNumber || Number(p.seasonNumber) === Number(seasonNumber));
    const missionWeekBoundsFromKey = (seasonConfig, weekKey) => {
      const parts = String(weekKey || '').split('-W');
      const weekNumber = Math.max(1, Number(parts[1] || 1));
      const start = new Date(seasonConfig?.startDate || new Date().toISOString()).getTime() + (weekNumber - 1) * 7 * 86400000;
      return { start, end:start + 7 * 86400000, weekNumber };
    };
    const getSeasonWeekKey = seasonInfo => `${seasonInfo.number}-W${Math.max(1, Math.ceil(Number(seasonInfo.currentDay || 1) / 7))}`;
    const hashString = value => {
      let h = 2166136261;
      const raw = String(value || '');
      for (let i=0;i<raw.length;i++) { h ^= raw.charCodeAt(i); h = Math.imul(h,16777619); }
      return h >>> 0;
    };

    const buildWeeklyMission = (player, seasonConfig, seasonInfo, approvedGames, visiblePlayers) => {
      const me = normalizePlayerName(player);
      const weekKey = getSeasonWeekKey(seasonInfo);
      const bounds = missionWeekBoundsFromKey(seasonConfig, weekKey);
      const activeSince = Date.now() - 5 * 86400000;
      const activeNames = Array.from(new Set((visiblePlayers || []).map(normalizePlayerName)))
        .filter(n => n && n !== me)
        .filter(n => (approvedGames || []).some(p => {
          const t = matchDateMs(p); if (t < activeSince) return false;
          const { winners, losers } = matchParticipants(p); return winners.includes(n) || losers.includes(n);
        }))
        .sort((a,b)=>a.localeCompare(b));
      const options = [
        { id:'DEMOLER', title:'💥 Demoledor', description:'Gana una partida por 20+ PdV.', bonus:6 },
        { id:'EQUIPO', title:'🤝 Equipo', description:'Juega una partida 2v2 aprobada.', bonus:4 },
        { id:'CONSTANCIA', title:'🏟️ Constancia', description:'Juega 10 partidas aprobadas durante la semana.', bonus:7 }
      ];
      if (activeNames.length) options.push({ id:'CAZADOR', title:'⚔️ Cazador', description:`Gana contra ${activeNames[hashString(`${me}|${weekKey}|target`) % activeNames.length]}.`, bonus:6, target:activeNames[hashString(`${me}|${weekKey}|target`) % activeNames.length] });
      const chosen = options[hashString(`${me}|${weekKey}|mission`) % options.length] || options[0];
      return { ...chosen, player:me, seasonNumber:Number(seasonConfig.seasonNumber), weekKey, createdAt:Date.now(), boundsStart:bounds.start, boundsEnd:bounds.end, version:RATING_ENGINE_VERSION };
    };

    const evaluateWeeklyMission = (mission, player, games, seasonConfig) => {
      if (!mission) return { completed:false, progress:0, targetProgress:0, bonus:0 };
      const bounds = missionWeekBoundsFromKey(seasonConfig, mission.weekKey);
      const windowGames = seasonGamesOnly(games, seasonConfig.seasonNumber).filter(p => {
        const t = matchDateMs(p); return t >= bounds.start && t < bounds.end;
      });
      const me = normalizePlayerName(player);
      let completed = false, progress = 0, targetProgress = mission.id === 'CONSTANCIA' ? 10 : 1;
      if (mission.id === 'CONSTANCIA') {
        progress = windowGames.filter(p => { const { winners, losers } = matchParticipants(p); return winners.includes(me) || losers.includes(me); }).length;
        completed = progress >= 10;
      } else if (mission.id === 'EQUIPO') {
        progress = windowGames.some(p => p.tipo === '2v2' && (()=>{ const { winners, losers }=matchParticipants(p); return winners.includes(me)||losers.includes(me); })()) ? 1 : 0;
        completed = progress >= 1;
      } else if (mission.id === 'DEMOLER') {
        progress = windowGames.some(p => { const { winners }=matchParticipants(p); return winners.includes(me) && Number(p.ventaja || (Number(p.ptsGanador||0)-Number(p.ptsPerdedor||0))) >= 20; }) ? 1 : 0;
        completed = progress >= 1;
      } else if (mission.id === 'CAZADOR') {
        progress = windowGames.some(p => { const { winners, losers }=matchParticipants(p); return winners.includes(me) && (losers.includes(normalizePlayerName(mission.target))); }) ? 1 : 0;
        completed = progress >= 1;
      }
      return { completed, progress:Math.min(progress,targetProgress), targetProgress, bonus:completed ? Math.min(8, Number(mission.bonus||0)) : 0 };
    };

    const calculatePairChemistry = (games, cutoffMs = null) => {
      const map = new Map();
      (games || []).filter(p=>p.tipo==='2v2').filter(p=>!cutoffMs || matchDateMs(p)>=cutoffMs).forEach(p=>{
        const { winners, losers } = matchParticipants(p);
        const margin = Math.abs(Number(p.ptsGanador||0)-Number(p.ptsPerdedor||0));
        const addTeam = (team, won) => {
          if (team.length !== 2) return;
          const key = [...team].sort().join('::');
          const prev = map.get(key) || { key, players:[...team].sort(), pj:0, wins:0, losses:0, marginSum:0, maxMargin:0 };
          prev.pj += 1; prev.wins += won ? 1 : 0; prev.losses += won ? 0 : 1; prev.marginSum += margin; prev.maxMargin=Math.max(prev.maxMargin,margin); map.set(key,prev);
        };
        addTeam(winners,true); addTeam(losers,false);
      });
      return Array.from(map.values()).map(row=>({ ...row, wrPct:row.pj ? Math.round(row.wins/row.pj*1000)/10 : 0, avgMargin:row.pj ? Math.round(row.marginSum/row.pj*10)/10 : 0 }));
    };

    const calculatePlayerRivalries = (player, games) => {
      const me = normalizePlayerName(player); const map = new Map();
      (games || []).filter(p=>p.tipo==='1v1').forEach(p=>{
        const { winners, losers }=matchParticipants(p); if(winners.length!==1||losers.length!==1)return;
        const opp = winners[0]===me ? losers[0] : losers[0]===me ? winners[0] : null; if(!opp||opp===me)return;
        const won=winners[0]===me; const margin=Math.abs(Number(p.ptsGanador||0)-Number(p.ptsPerdedor||0));
        const row=map.get(opp)||{opponent:opp,pj:0,wins:0,losses:0,winMarginSum:0,winMarginCount:0,history:[]};
        row.pj++; row.wins+=won?1:0; row.losses+=won?0:1; if(won){row.winMarginSum+=margin;row.winMarginCount++;} row.history.push({id:p.id,date:matchDateMs(p),won,score:`${p.ptsGanador}-${p.ptsPerdedor}`}); map.set(opp,row);
      });
      return Array.from(map.values()).filter(r=>r.pj>=5).map(r=>({ ...r, wrPct:Math.round(r.wins/r.pj*1000)/10, avgWinMargin:r.winMarginCount?Math.round(r.winMarginSum/r.winMarginCount*10)/10:0 })).sort((a,b)=>a.wrPct-b.wrPct||b.pj-a.pj);
    };

    const calculateMMRTable = (playerNames, games, seasonConfig, missionRecordsByPlayer = {}) => {
      const stats = {};
      (playerNames || []).map(normalizePlayerName).filter(Boolean).forEach(name=>{
        const seed=mmrSeedForPlayer(seasonConfig,name);
        stats[name]={nombre:name,mmr:seed,coreMmr:seed,startMmr:seed,mmrPeak:seed,calibrationGames:0,pj:0,ganadas:0,perdidas:0,ventajaSum:0,winMarginSum:0,winMarginCount:0,mayorVentaja:0,mayorGoleadaLabel:'—',mejorPartidaLabel:'—',rachaTipo:null,rachaActual:0,rachaMax:0,formaReciente:[],history:[{date:new Date(seasonConfig?.startDate || Date.now()).getTime(),mmr:roundMmr(seed),delta:0}]};
      });
      const ordered=seasonGamesOnly(games,seasonConfig?.seasonNumber).sort((a,b)=>matchDateMs(a)-matchDateMs(b));
      ordered.forEach(p=>{
        const { winners, losers }=matchParticipants(p); if(!winners.length||!losers.length)return;
        const winnerRatings=winners.map(n=>stats[n]?.mmr).filter(Number.isFinite), loserRatings=losers.map(n=>stats[n]?.mmr).filter(Number.isFinite); if(!winnerRatings.length||!loserRatings.length)return;
        const teamW=winnerRatings.reduce((a,b)=>a+b,0)/winnerRatings.length, teamL=loserRatings.reduce((a,b)=>a+b,0)/loserRatings.length;
        const expectedW=expectedScoreFromRatings(teamW,teamL), margin=Math.max(0,Math.min(30,Number(p.ventaja || (Number(p.ptsGanador||0)-Number(p.ptsPerdedor||0))))), mult=normalizedAdvantageMultiplier(margin);
        const apply=(name,won)=>{
          const s=stats[name]; if(!s)return;
          const k=s.calibrationGames<MMR_CALIBRATION_GAMES?MMR_K_CALIBRATION:MMR_K_NORMAL;
          const expected=won?expectedW:1-expectedW; const delta=k*mult*((won?1:0)-expected);
          s.mmr=Math.max(0,s.mmr+delta); s.coreMmr=s.mmr; s.mmrPeak=Math.max(s.mmrPeak,s.mmr); s.pj++; if(won)s.ganadas++;else s.perdidas++; s.ventajaSum+=margin; if(won){s.winMarginSum+=margin;s.winMarginCount++;}
          const previousMayor=s.mayorVentaja; s.mayorVentaja=Math.max(s.mayorVentaja,margin); if(won&&margin>=previousMayor){s.mayorGoleadaLabel=formatMatchLabel(p);s.mejorPartidaLabel=formatMatchLabel(p);} s.calibrationGames=Math.min(MMR_CALIBRATION_GAMES,s.calibrationGames+1);

              if (typeof d.jugador1 === 'string') setJugador1(d.jugador1);
              if (typeof d.jugador2 === 'string') setJugador2(d.jugador2);
              if (Number.isFinite(d.ptsJ1)) setPtsJ1(Math.min(30, Math.max(0, d.ptsJ1)));
              if (Number.isFinite(d.ptsJ2)) setPtsJ2(Math.min(30, Math.max(0, d.ptsJ2)));
              if (typeof d.e1j1 === 'string') setE1j1(d.e1j1);

              if (typeof d.e2j1 === 'string') setE2j1(d.e2j1);

              if (Number.isFinite(d.ptsE2)) setPtsE2(Math.min(30, Math.max(0, d.ptsE2)));

              if (Number.isFinite(d.ptsT1)) setPtsT1(Math.min(30, Math.max(0, d.ptsT1)));
              if (Number.isFinite(d.ptsT2)) setPtsT2(Math.min(30, Math.max(0, d.ptsT2)));
              setJugarDraftRecuperado(Boolean(d.modoPartida || d.ptsJ1 || d.ptsJ2 || d.ptsE1 || d.ptsE2 || d.ptsT1 || d.ptsT2));

          }

      const mergeWithOfflineQueue = useCallback((remoteList) => {
        try {
          const queued = JSON.parse(localStorage.getItem('truco_league_offline_queue') || '[]');
          const map = new Map((remoteList || []).map(p => [p.id, p]));
          queued.forEach(p => map.set(p.id, p));

      // Sincronización optimizada sin alterar el modelo original de puntuación.
      // La tabla histórica original contabiliza todas las partidas APROBADAS presentes en `partidas`,
      // por lo que no se filtra por temporada al calcular ranking/H2H. Para jugadores normales
      // cargamos además sus propias PENDIENTES sin exponer las pendientes de terceros.
      useEffect(() => {
        const timer = setTimeout(() => {
          const { db, appId, collection, doc, onSnapshot, query, where, orderBy, limit } = window.TrucoDB || {};
          if (!db || !query || !where) return;
          const cleanups = [];

          cleanups.push(onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'jugadores'), snapshot => {
            const docs = snapshot.docs.map(d => ({ id:d.id, ...d.data() }));
            const list = docs.map(d => d.nombre).filter(Boolean).map(normalizePlayerName);
            safeWriteJSON(PUBLIC_PLAYERS_CACHE_KEY, Array.from(new Set(list)));
            const meta = {};
            docs.forEach(d => { const n=normalizePlayerName(d.nombre || d.id); if (n) meta[n]={...d, uid:d.uid || null, avatarData:d.avatarData || null, oculto:d.oculto === true}; });
            setJugadorMeta(meta);
            setJugadoresOcultos(Array.from(new Set(docs.filter(d => d.oculto === true).map(d => normalizePlayerName(d.nombre)))));
            setJugadores(list.length ? Array.from(new Set(list)) : DEFAULT_JUGADORES);
          }, err => console.warn('Firestore (jugadores):', err.message)));

          const partidaRef = collection(db, 'artifacts', appId, 'public', 'data', 'partidas');
          const mergeMatches = (snapshot) => mergeWithOfflineQueue(snapshot.docs.map(d => ({ id:d.id, ...d.data() })));

          if (currentUser?.isAdmin) {
            cleanups.push(onSnapshot(partidaRef, snapshot => { const next = mergeMatches(snapshot); cacheApprovedMatches(next); setPartidas(next); setSyncStatus('live'); }, err => { console.warn('Firestore (partidas/admin):', err.message); setSyncStatus('offline-cache'); }));
          } else {
            // Firestore Rules permiten una consulta pública segura solo con estado APROBADA.
            cleanups.push(onSnapshot(query(partidaRef, where('estado', '==', 'APROBADA')), snapshot => {
              setPartidas(prev => { const approved = snapshot.docs.map(d => ({ id:d.id, ...d.data() })); cacheApprovedMatches(approved); setSyncStatus('live'); const ownPending = prev.filter(p => p.estado === 'PENDIENTE' && p.creatorUid === currentUser?.uid); return mergeWithOfflineQueue([...approved, ...ownPending]); });
            }, err => { console.warn('Firestore (partidas aprobadas):', err.message); setSyncStatus('offline-cache'); }));
            if (currentUser?.uid) {
              cleanups.push(onSnapshot(query(partidaRef, where('creatorUid', '==', currentUser.uid)), snapshot => {
                const own = snapshot.docs.map(d => ({ id:d.id, ...d.data() })).filter(p => p.estado === 'PENDIENTE');
                setPartidas(prev => {
                  const approved = prev.filter(p => p.estado === 'APROBADA');
                  return mergeWithOfflineQueue([...approved, ...own]);
                });
              }, err => console.warn('Firestore (mis partidas pendientes):', err.message)));
            }
          }

          // El ranking es crítico para el primer render. Configuración/histórico/auditoría se inicializan en idle.
          let disposed = false;
          let secondaryHandle = null;
          const startSecondarySync = () => {
            if (disposed) return;
            cleanups.push(onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'season_config', 'main'), snapshot => { if (snapshot.exists()) setSeasonConfig(snapshot.data()); }, err => console.warn('Firestore (Season):', err.message)));
            const historyQuery = query(collection(db, 'artifacts', appId, 'public', 'data', 'season_history'), orderBy('seasonNumber', 'desc'), limit(20));
            cleanups.push(onSnapshot(historyQuery, snapshot => setHistoricalSeasons(snapshot.docs.map(d => ({ id:d.id, ...d.data() }))), err => console.warn('Firestore (season_history):', err.message)));
            cleanups.push(onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'hallOfFameTitles'), snapshot => { setHofManualTitles(snapshot.docs.map(d => ({ id:d.id, ...d.data() })).sort((a,b) => Number(b.timestamp || 0) - Number(a.timestamp || 0))); }, err => console.warn('Firestore (hallOfFameTitles):', err.message)));
            if (currentUser?.isAdmin) {
              cleanups.push(onSnapshot(query(collection(db, 'artifacts', appId, 'public', 'data', 'cuentas'), limit(200)), snapshot => setCuentas(snapshot.docs.map(d => ({ id:d.id, ...d.data() }))), err => console.warn('Firestore (cuentas/admin):', err.message)));
              cleanups.push(onSnapshot(query(collection(db, 'artifacts', appId, 'public', 'data', 'auditLogs'), orderBy('timestamp', 'desc'), limit(100)), snapshot => setAuditLogs(snapshot.docs.map(d => ({ id:d.id, ...d.data() }))), err => console.warn('Firestore (auditLogs/admin):', err.message)));
              cleanups.push(onSnapshot(query(collection(db, 'artifacts', appId, 'public', 'data', 'season_missions'), where('seasonNumber', '==', Number(seasonConfig.seasonNumber))), snapshot => setMissionRecords(snapshot.docs.map(d => ({ id:d.id, ...d.data() }))), err => console.warn('Firestore (season_missions):', err.message)));
            } else { setCuentas([]); setAuditLogs([]); cleanups.push(onSnapshot(query(collection(db, 'artifacts', appId, 'public', 'data', 'season_missions'), where('seasonNumber', '==', Number(seasonConfig.seasonNumber))), snapshot => setMissionRecords(snapshot.docs.map(d => ({ id:d.id, ...d.data() }))), err => console.warn('Firestore (season_missions):', err.message))); }
          };
          if ('requestIdleCallback' in window) secondaryHandle = requestIdleCallback(startSecondarySync, { timeout: 1200 }); else secondaryHandle = setTimeout(startSecondarySync, 700);
          return () => { disposed = true; try { if ('cancelIdleCallback' in window && typeof secondaryHandle === 'number') cancelIdleCallback(secondaryHandle); else clearTimeout(secondaryHandle); } catch(e) {} cleanups.forEach(fn => { try { fn(); } catch(e) {} }); };
        }, 100);
        return () => clearTimeout(timer);
      }, [currentUser?.uid, currentUser?.isAdmin, mergeWithOfflineQueue, seasonConfig.seasonNumber]);

      // H2H derivado: cualquier resultado nuevo actualiza la comparación automáticamente.

      // Filtrado de partidas aprobadas vs pendientes
      const approvedPartidas = useMemo(() => partidas.filter(p => p.estado === 'APROBADA'), [partidas]);
      const pendingPartidas = useMemo(() => partidas.filter(p => p.estado === 'PENDIENTE'), [partidas]);
      const pendingCuentas = useMemo(() => cuentas.filter(c => c.estado === 'PENDIENTE'), [cuentas]);
      const myPendingPartidas = useMemo(() => {
        if (!currentUser) return [];
        return pendingPartidas.filter(p =>
          p.jugadorCarga === currentUser.jugadorNombre ||
          p.usuarioCarga === currentUser.email
        );
      }, [pendingPartidas, currentUser]);

      useEffect(() => {
        if (!currentUser?.isAdmin && (activeTab === 'accesos' || activeTab === 'dev')) {
          setActiveTab(currentUser ? 'perfil' : 'ranking');

      }, [currentUser, activeTab]);

      // OPTIMIZACIÓN: Partidas jugadas del día (el historial solo muestra las de hoy)
      const todayString = useMemo(() => getTodayDateString(), []);
      const partidasDeHoy = useMemo(() => {
        return approvedPartidas.filter(p => {

          // Fallback para fechas antiguas guardadas como string local

      }, [approvedPartidas, todayString]);

      const writeAuditLog = useCallback(async (entry) => {

      const closeAvatarEditor = useCallback(() => {
        setAvatarEditor(prev => { if (prev?.url) URL.revokeObjectURL(prev.url); return null; });

      const openAvatarEditor = useCallback((playerName, file) => {

      const handleRenombrarJugador = async (e) => {
        e.preventDefault();
        if (!currentUser?.isAdmin) return;
        const oldName = normalizePlayerName(jugadorRenombrar);
        const newName = normalizePlayerName(nuevoNombreJugador);
        if (!oldName || !newName || oldName === newName || !jugadores.includes(oldName) || jugadores.includes(newName)) {
          setFeedback(!oldName || !newName ? '⚠️ Selecciona un jugador e indica el nuevo nombre.' : oldName === newName ? '⚠️ El nuevo nombre debe ser diferente.' : !jugadores.includes(oldName) ? '⚠️ El jugador seleccionado no existe.' : '⚠️ Ese nombre ya está ocupado.');
          setTimeout(()=>setFeedback(''),3500); return;
        }
        setRenombrandoJugador(true);
        try {
          const { db, appId, collection, doc, getDocs, setDoc, updateDoc, deleteDoc } = window.TrucoDB || {};
          if (!db) throw new Error('Firebase no disponible.');
          const oldRef = doc(db,'artifacts',appId,'public','data','jugadores',oldName);
          const oldSnap = await window.TrucoDB.getDoc(oldRef);
          const oldData = oldSnap.exists() ? oldSnap.data() : {nombre:oldName};
          await setDoc(doc(db,'artifacts',appId,'public','data','jugadores',newName), {...oldData,nombre:newName}, {merge:true});

          const replaceMatchNames = (data) => {
            const next = {...data};
            let changed = false;
            const replaceArray = arr => Array.isArray(arr) ? arr.map(v => { const nv=normalizePlayerName(v)===oldName?newName:v; if(nv!==v)changed=true; return nv; }) : arr;
            next.ganadores = replaceArray(data.ganadores);
            next.perdedores = replaceArray(data.perdedores);
            ['ganador','perdedor','jugadorCarga'].forEach(k => { if (typeof data[k]==='string' && normalizePlayerName(data[k])===oldName) { next[k]=newName; changed=true; } });
            return {next,changed};
          };

          const partidasSnap = await getDocs(collection(db,'artifacts',appId,'public','data','partidas'));
          for (const d of partidasSnap.docs) { const r=replaceMatchNames(d.data()); if(r.changed) await updateDoc(d.ref,r.next); }

          const cuentasSnap = await getDocs(collection(db,'artifacts',appId,'public','data','cuentas'));
          for (const d of cuentasSnap.docs) { const data=d.data(); if (normalizePlayerName(data.nombre)===oldName) await updateDoc(d.ref,{nombre:newName}); }

          const historySnap = await getDocs(collection(db,'artifacts',appId,'public','data','season_history'));
          for (const seasonDoc of historySnap.docs) {
            const seasonData=seasonDoc.data();
            const simpleReplace = value => Array.isArray(value) ? value.map(simpleReplace) : (value && typeof value==='object' && typeof value.toMillis!=='function' ? Object.fromEntries(Object.entries(value).map(([k,v])=>[k,simpleReplace(v)])) : (typeof value==='string' && normalizePlayerName(value)===oldName ? newName : value));
            let changed = false;
            const replaced = simpleReplace(seasonData);
            if (JSON.stringify(replaced)!==JSON.stringify(seasonData)) changed=true;
            if (changed) await updateDoc(seasonDoc.ref,replaced);
            try {
              const archived = await getDocs(collection(db,'artifacts',appId,'public','data','season_history',seasonDoc.id,'partidas'));
              for (const d of archived.docs) { const r=replaceMatchNames(d.data()); if(r.changed) await updateDoc(d.ref,r.next); }
            } catch(e) {}
          }

          await deleteDoc(oldRef);
          setJugadores(prev=>prev.map(j=>j===oldName?newName:j));
          setJugadorMeta(prev=>{const next={...prev};next[newName]={...(next[oldName]||oldData),nombre:newName};delete next[oldName];return next;});
          setJugadoresOcultos(prev=>prev.map(j=>j===oldName?newName:j));
          setCuentas(prev=>prev.map(c=>normalizePlayerName(c.nombre)===oldName?{...c,nombre:newName}:c));
          if (currentUser?.jugadorNombre===oldName) setCurrentUser(prev=>prev?{...prev,jugadorNombre:newName}:prev);
          setSelectedPlayer(prev=>prev===oldName?newName:prev);
          [setJugador1,setJugador2,setE1j1,setE1j2,setE2j1,setE2j2,setT1j1,setT1j2,setT1j3,setT2j1,setT2j2,setT2j3].forEach(fn=>fn(v=>v===oldName?newName:v));
          setH2hP1(v=>v===oldName?newName:v); setH2hP2(v=>v===oldName?newName:v); setJugadorRenombrar(newName); setNuevoNombreJugador('');
          await writeAuditLog({tipo:'PLAYER_ADMIN',accion:'RENOMBRÓ JUGADOR',detalle:`${oldName} → ${newName}`,jugadoresInvolucrados:[oldName,newName]});
          setFeedback(`✅ Jugador renombrado: ${oldName} → ${newName}.`);
        } catch (err) {
          console.error('Error al renombrar jugador:',err); setFeedback('❌ No se pudo renombrar el jugador. Verifica permisos de Firebase.');
        } finally { setRenombrandoJugador(false); setTimeout(()=>setFeedback(''),4500); }

      const handleFusionarJugadores = async (e) => {

        if (!currentUser?.isAdmin) return;
        const from=normalizePlayerName(mergeFromPlayer), to=normalizePlayerName(mergeIntoPlayer);
        if (!from || !to || from===to || !jugadores.includes(from) || !jugadores.includes(to)) { setFeedback('⚠️ Selecciona dos jugadores distintos y válidos.'); setTimeout(()=>setFeedback(''),3500); return; }

      const getRivalriesForPlayer = useCallback((player) => calculatePlayerRivalries(player, approvedPartidas), [approvedPartidas]);

                  const historicalMaxMmr=Math.max(Number(stats.mmrPeak||stats.mmr||0), Number(historicalMmrPeakByPlayer[player]||0));

                  const isOwner=currentUser?.jugadorNombre===player;
                  const pairRows=pairChemistry.filter(x=>x.players.includes(player)).sort((a,b)=>b.wrPct-a.wrPct||b.pj-a.pj);
                  const bestPartner=pairRows.find(x=>x.pj>=5)||null;
                  const rivalRows=getRivalriesForPlayer(player);
                  const nemesis=rivalRows[0]||null;

                  const personalGames=approvedPartidas.filter(p=>{const {winners,losers}=matchParticipants(p);return winners.includes(player)||losers.includes(player);}).sort((a,b)=>matchDateMs(b)-matchDateMs(a));
                  const above=rank>1?rankingData[rank-2]:null;
                  const below=rank>0?rankingData[rank]:null;
                  const lastFive=stats.formaReciente||[];
                  const achievements=achievementProgressForPlayer(player);
                  const unlocked=achievements.filter(a=>a.desbloqueado).length;
                  return <>
                    <div className="flex items-center gap-2"><button onClick={()=>setActiveTab('ranking')} className="text-xs font-black text-slate-400 hover:text-white">← Ranking</button><span className="text-slate-700">/</span><span className="text-xs text-slate-500">Ficha competitiva</span></div>
                    <section className="glass-card rounded-2xl border border-emerald-500/20 p-5 sm:p-6 overflow-hidden shadow-xl">
                      <div className="flex flex-col sm:flex-row sm:items-center gap-4"><PlayerAvatar name={player} meta={meta} size="lg" editable={isOwner||currentUser?.isAdmin} canChange={avatarLockRemainingMs(meta) === 0} onPick={file=>openAvatarEditor(player,file)} saving={avatarSaving}/><div className="min-w-0 flex-1"><div className="flex items-center gap-2 flex-wrap"><h2 className="text-3xl font-black text-white truncate">{player}</h2><span className="px-2 py-1 rounded-lg border text-xs font-black text-emerald-300 bg-emerald-500/10 border-emerald-500/20">{stats.divisionEmoji} {stats.division}</span>{stats.rachaActual>=3&&<span className={`px-2 py-1 rounded-lg border text-xs font-black ${stats.rachaTipo==='win'?'bg-orange-500/10 border-orange-500/20 text-orange-300':'bg-cyan-500/10 border-cyan-500/20 text-cyan-300'}`}>{stats.rachaTipo==='win'?'🔥':'🧊'} {stats.rachaActual} {stats.rachaTipo==='win'?'EN RACHA':'EN DERROTA'}</span>}</div><p className="text-xs text-slate-500 mt-1">{isOwner?'Tu ficha · ':''}MMR de la temporada · récord histórico {roundMmr(historicalMaxMmr)} · calibración {Math.min(stats.calibrationGames,5)}/5.</p></div></div>

                    </div>

                    <div className="grid lg:grid-cols-2 gap-5">
                      <section className="glass-card rounded-2xl border border-slate-800 p-5"><div className="flex items-center justify-between"><div><h3 className="text-lg font-black text-white">📈 Evolución MMR</h3><p className="text-[10px] text-slate-500 mt-1">Base Elo de la temporada. Los bonus de misión se muestran aparte.</p></div><span className="text-[10px] text-emerald-300 font-black">{stats.mmrChange>=0?'+':''}{Math.round(stats.mmrChange)} MMR</span></div><div className="mt-3"><MmrEvolutionChart history={stats.history}/></div><div className="grid grid-cols-3 gap-2 mt-3"><div className="rounded-xl bg-slate-900/70 border border-slate-800 p-3 text-center"><p className="text-[9px] text-slate-500">Inicio</p><p className="text-lg font-black text-white">{roundMmr(stats.startMmr)}</p></div><div className="rounded-xl bg-amber-500/5 border border-amber-500/10 p-3 text-center"><p className="text-[9px] text-slate-500">Máximo histórico</p><p className="text-lg font-black text-amber-300">{roundMmr(historicalMaxMmr)}</p></div><div className="rounded-xl bg-slate-900/70 border border-slate-800 p-3 text-center"><p className="text-[9px] text-slate-500">Actual</p><p className="text-lg font-black text-white">{roundMmr(stats.mmrDisplay)}</p></div></div></section>
                      <section className="glass-card rounded-2xl border border-slate-800 p-5"><div className="flex items-center justify-between"><div><h3 className="text-lg font-black text-white">🎯 Radar competitivo</h3><p className="text-[10px] text-slate-500 mt-1">Indicadores normalizados a 0–100 a partir de tus datos.</p></div></div><div className="mt-2"><SvgRadar values={radarValues}/></div></section>
                    </div>

                      disabled={isSubmitting}
                      className="w-full py-3 bg-emerald-600 hover:bg-emerald-500 font-extrabold text-xs text-white rounded-xl shadow transition mt-2"
                    >
                      {isSubmitting ? 'Enviando...' : 'Enviar Solicitud a SAMU'}
                    </button>

                    <div className="text-center pt-1">
                      <button
                        type="button"
                        onClick={() => { setAuthMode('LOGIN'); setModalError(''); }}
                        className="text-xs font-bold text-slate-400 hover:underline"
                      >
                        ¿Ya tienes cuenta? Ingresar
                      </button>
                    </div>
                  </form>
                )}
              </div>
            </div>
          )}

          {/* Modal Confirmar Carga */}
          {showConfirmLoad && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-md p-4">
              <div className="glass-card rounded-2xl p-6 max-w-md w-full border border-amber-500/30 shadow-2xl space-y-4">
                <div className="flex items-center gap-3">
                  <span className="text-4xl">⚠️</span>
                  <div>
                    <h3 className="text-lg font-extrabold text-white">Confirmar carga de partida</h3>
                    <p className="text-xs text-slate-400 mt-1">Una vez confirmada, se enviará la partida {modoPartida} y no se volverá a preguntar.</p>
                  </div>
                </div>
                <div className="bg-slate-900/80 border border-slate-800 rounded-xl p-4 text-center">
                  <p className="text-sm font-black text-amber-300 uppercase">{modoPartida}</p>
                  <p className="text-xs text-slate-300 mt-1">Revisa jugadores y marcador antes de confirmar.</p>
                </div>
                <div className="flex gap-2">
                  <button type="button" onClick={()=>setShowConfirmLoad(false)} className="flex-1 py-2.5 bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-300 rounded-xl">Cancelar</button>
                  <button type="button" onClick={confirmarCargaPartida} disabled={isSubmitting} className="flex-1 py-2.5 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-xs font-black text-white rounded-xl shadow">✅ Confirmar</button>
                </div>
              </div>
            </div>
          )}

          {avatarEditor && (
            <AvatarCropModal editor={avatarEditor} onCancel={closeAvatarEditor} onConfirm={handlePlayerAvatarConfirm} saving={avatarSaving} />
          )}

          {/* Modal Reinicio por Admin */}
          {showResetModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
              <div className="glass-card rounded-2xl p-6 max-w-md w-full border border-red-800/50 shadow-2xl space-y-4">
                <h3 className="text-lg font-extrabold text-red-400">⚠️ Reiniciar Tabla / Temporada</h3>
                <p className="text-xs text-slate-300">
                  Esta acción archivará la temporada actual, conservará todas sus partidas y abrirá una nueva temporada sin mezclar estadísticas.
                </p>

                {resetError && <p className="text-xs text-red-400 font-bold">{resetError}</p>}

                <form onSubmit={handleResetLeague} className="space-y-4">
                  <div className="bg-red-950/30 border border-red-900/40 rounded-xl p-3 text-[11px] text-red-200">⚠️ Solo funciona con una sesión de Administrador validada por Firebase.</div>
                  <div className="flex gap-2">
                    <button
                      type="button"
                      onClick={() => setShowResetModal(false)}
                      className="flex-1 py-2.5 bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-300 rounded-xl"
                    >
                      Cancelar
                    </button>
                    <button
                      type="submit"
                      className="flex-1 py-2.5 bg-red-600 hover:bg-red-500 text-xs font-bold text-white rounded-xl shadow"
                    >
                      Confirmar Reinicio
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Modal Anular Partida */}
          {selectedMatchToDelete && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
              <div className="glass-card rounded-2xl p-6 max-w-md w-full border border-red-800/50 shadow-2xl space-y-4">
                <h3 className="text-lg font-extrabold text-red-400">🛑 Anular Partida</h3>
                <p className="text-xs text-slate-300">Confirma la anulación de esta partida con tu sesión actual de Administrador. Se conservará el registro para auditoría.</p>

                {matchDeleteError && <p className="text-xs text-red-400 font-bold">{matchDeleteError}</p>}

                <form onSubmit={handleConfirmEliminarPartida} className="space-y-4">
                  <div className="bg-red-950/30 border border-red-900/40 rounded-xl p-3 text-[11px] text-red-200">🔐 Acción protegida por la sesión de Administrador.</div>
                  <div className="flex gap-2">
                    <button
                      type="button"
                      onClick={() => setSelectedMatchToDelete(null)}
                      className="flex-1 py-2.5 bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-300 rounded-xl"
                    >
                      Cancelar
                    </button>
                    <button
                      type="submit"
                      className="flex-1 py-2.5 bg-red-600 hover:bg-red-500 text-xs font-bold text-white rounded-xl shadow"
                    >
                      Anular Partida
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js', { scope: './' }).then(reg => { try { reg.update(); } catch (e) {} }).catch(err => console.warn('[Truco League] Service Worker:', err?.message || err)); });
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AppErrorBoundary><App /></AppErrorBoundary>);
  </script>
</body>
</html>
