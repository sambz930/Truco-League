      const getPadresAndHijos = (playerNombre) => {
        const opponents = new Set();
        approvedPartidas.forEach(p => {
          if (p.ganador === playerNombre) opponents.add(p.perdedor);
          if (p.perdedor === playerNombre) opponents.add(p.ganador);
        });

        const padres = [];

        opponents.forEach(opp => {
          const h2h = approvedPartidas.filter(p =>

            (p.ganador === opp && p.perdedor === playerNombre)

              consecutiveWinsByOpponent++;
              consecutiveWinsByPlayer = 0;

        const playerMatches = approvedPartidas

        let streak = 0;
        for (const match of playerMatches) {
          if (match.ganador === playerNombre) {
            streak = streak > 0 ? streak + 1 : 1;
          } else {
            streak = streak < 0 ? streak - 1 : -1;

          const wrPct = Math.round(wrRaw * 100);
          const kdaVal = pj > 0 ? ((p.ganadas / pj) + (p.ptsVentaja / 100)) : 0;
          const kdaFormatted = Number(kdaVal).toFixed(2);
          const { padres, hijos } = getPadresAndHijos(p.nombre);
          const racha = getStreaks(p.nombre);

          return { ...p, pj, wrPct, kda: Number(kdaFormatted), padres, hijos, racha };
        }).sort((a, b) => {
          if (b.puntos !== a.puntos) return b.puntos - a.puntos;
          if (b.kda !== a.kda) return b.kda - a.kda;
          return b.ptsVentaja - a.ptsVentaja;

                            <td className="py-3 px-4 text-xs font-mono text-slate-300">{log.email}</td>
                            <td className="py-3 px-4 text-xs font-bold text-emerald-400">{log.role}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

          </main>

          {(deviceMode === 'mobile' || (!deviceMode)) && (
            <div className={`fixed bottom-0 left-0 right-0 z-50 bg-slate-900/95 backdrop-blur-lg border-t border-slate-800 flex justify-around items-center py-2 px-1 shadow-2xl ${deviceMode === 'mobile' ? 'flex' : 'lg:hidden'}`}>
              <button
                onClick={() => setActiveTab('ranking')}
                className={`flex flex-col items-center justify-center py-1 px-2 rounded-xl transition ${
                  activeTab === 'ranking' ? 'text-emerald-400 font-bold scale-105' : 'text-slate-400'
                }`}
              >
                <span className="text-xl">🏆</span>
                <span className="text-[10px] tracking-tight mt-0.5">Ranking</span>
              </button>

              <button
                onClick={() => setActiveTab('cargar')}
                className={`flex flex-col items-center justify-center py-1 px-2 rounded-xl transition ${
                  activeTab === 'cargar' ? 'text-emerald-400 font-bold scale-105' : 'text-slate-400'
                }`}
              >
                <span className="text-xl">⚡</span>
                <span className="text-[10px] tracking-tight mt-0.5">Jugar</span>
              </button>

              <button
                onClick={() => setActiveTab('aprobaciones')}
                className={`flex flex-col items-center justify-center py-1 px-2 rounded-xl transition relative ${
                  activeTab === 'aprobaciones' ? 'text-emerald-400 font-bold scale-105' : 'text-slate-400'
                }`}
              >
                <span className="text-xl">⏳</span>
                <span className="text-[10px] tracking-tight mt-0.5">Permisos</span>
                {pendingPartidas.length > 0 && (
                  <span className="absolute top-0 right-1 w-4 h-4 bg-amber-500 text-slate-950 text-[9px] font-black rounded-full flex items-center justify-center">
                    {pendingPartidas.length}
                  </span>
                )}
              </button>

              <button
                onClick={() => setActiveTab('historial')}
                className={`flex flex-col items-center justify-center py-1 px-2 rounded-xl transition ${
                  activeTab === 'historial' ? 'text-emerald-400 font-bold scale-105' : 'text-slate-400'
                }`}
              >
                <span className="text-xl">📜</span>
                <span className="text-[10px] tracking-tight mt-0.5">Historial</span>
              </button>

              <button
                onClick={() => setActiveTab('h2h')}
                className={`flex flex-col items-center justify-center py-1 px-2 rounded-xl transition ${
                  activeTab === 'h2h' ? 'text-emerald-400 font-bold scale-105' : 'text-slate-400'
                }`}
              >
                <span className="text-xl">⚔️</span>
                <span className="text-[10px] tracking-tight mt-0.5">H2H</span>
              </button>

              {currentUser ? (
                <button
                  onClick={() => setActiveTab('perfil')}
                  className={`flex flex-col items-center justify-center py-1 px-2 rounded-xl transition ${
                    activeTab === 'perfil' ? 'text-emerald-400 font-bold scale-105' : 'text-slate-400'
                  }`}
                >
                  <span className="text-xl">👤</span>
                  <span className="text-[10px] tracking-tight mt-0.5">Perfil</span>
                </button>
              ) : (
                <button
                  onClick={() => { setAuthMode('LOGIN'); setModalError(''); setShowLoginModal(true); }}
                  className="flex flex-col items-center justify-center py-1 px-2 text-emerald-400"
                >
                  <span className="text-xl">🔑</span>
                  <span className="text-[10px] font-bold mt-0.5">Ingresar</span>
                </button>
              )}
            </div>
          )}

          {showDeviceModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-md p-4">
              <div className="glass-card rounded-2xl max-w-md w-full p-6 border border-emerald-500/30 text-center space-y-5 shadow-2xl">
                <div className="w-14 h-14 bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 rounded-2xl flex items-center justify-center mx-auto text-2xl">
                  🎴
                </div>
                <div>
                  <h3 className="text-xl font-extrabold text-white">¿Cómo estás ingresando hoy?</h3>
                  <p className="text-xs text-slate-400 mt-1">Selecciona tu dispositivo para adaptar la interfaz:</p>
                </div>

                <div className="grid grid-cols-2 gap-4 pt-2">
                  <button
                    onClick={() => handleSelectDevice('pc')}
                    className={`p-4 rounded-2xl border transition-all flex flex-col items-center justify-center gap-2 active:scale-95 ${
                      deviceMode === 'pc'
                        ? 'bg-emerald-600/30 border-emerald-400 text-white ring-2 ring-emerald-500/50'
                        : 'bg-slate-900 hover:bg-slate-800 border-slate-800 text-slate-300'
                    }`}
                  >
                    <span className="text-3xl">💻</span>
                    <span className="text-xs font-black">Modo PC</span>
                    <span className="text-[10px] text-slate-400 leading-tight">Menú superior completo y diseño horizontal</span>
                  </button>

                  <button
                    onClick={() => handleSelectDevice('mobile')}
                    className={`p-4 rounded-2xl border transition-all flex flex-col items-center justify-center gap-2 active:scale-95 ${
                      deviceMode === 'mobile'
                        ? 'bg-emerald-600/30 border-emerald-400 text-white ring-2 ring-emerald-500/50'
                        : 'bg-slate-900 hover:bg-slate-800 border-slate-800 text-slate-300'
                    }`}
                  >
                    <span className="text-3xl">📱</span>
                    <span className="text-xs font-black">Modo Móvil</span>
                    <span className="text-[10px] text-slate-400 leading-tight">Navegación inferior táctil rápida y compacta</span>
                  </button>
                </div>

                {deviceMode && (
                  <button
                    onClick={() => setShowDeviceModal(false)}
                    className="text-xs text-slate-400 hover:text-white underline pt-2 block mx-auto"
                  >
                    Cerrar (Mantener opción actual)
                  </button>
                )}
              </div>
            </div>
          )}

          {showLoginModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
              <div className="glass-card rounded-2xl max-w-md w-full p-6 border border-slate-700 space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h3 className="font-extrabold text-lg text-white">
                    {authMode === 'LOGIN' ? '🔑 Iniciar Sesión' : '📝 Registrar Perfil de Jugador'}
                  </h3>
                  <button onClick={() => setShowLoginModal(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                {modalError && (
                  <div className="bg-red-950/80 border border-red-500/50 text-red-300 p-2.5 rounded-xl text-xs font-bold">
                    {modalError}
                  </div>
                )}

                {authMode === 'LOGIN' ? (
                  <form onSubmit={handleLoginSubmit} className="space-y-4">
                    <div>
                      <label className="text-xs font-bold text-slate-300 block mb-1">Correo Gmail</label>
                      <input
                        type="email"
                        required
                        placeholder="tu@gmail.com"
                        value={loginEmailInput}
                        onChange={e => { setLoginEmailInput(e.target.value); setModalError(''); }}
                        className="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-xs text-white"
                      />
                    </div>
                    <div>
                      <label className="text-xs font-bold text-slate-300 block mb-1">Contraseña</label>
                      <div className="relative">
                        <input
                          type={showPassword ? 'text' : 'password'}
                          required
                          placeholder="••••••••"
                          value={loginPasswordInput}
                          onChange={e => { setLoginPasswordInput(e.target.value); setModalError(''); }}
                          className="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-xs text-white pr-10"
                        />
                        <button
                          type="button"
                          onClick={() => setShowPassword(!showPassword)}
                          className="absolute right-3 top-3 text-slate-400 hover:text-white"
                        >
                          {showPassword ? <IconEyeOff /> : <IconEye />}
                        </button>
                      </div>
                    </div>
                    <button
                      type="submit"
                      disabled={isSubmitting}
                      className="w-full py-3 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 font-bold text-xs text-white rounded-xl shadow transition"
                    >
                      {isSubmitting ? 'Ingresando...' : 'Ingresar'}
                    </button>
                    <p className="text-center text-xs text-slate-400 pt-2">
                      ¿No tienes cuenta?{' '}
                      <button
                        type="button"
                        onClick={() => { setAuthMode('REGISTER'); setModalError(''); setLoginPasswordInput(''); }}
                        className="text-emerald-400 font-bold hover:underline"
                      >
                        Regístrate aquí
                      </button>
                    </p>
                  </form>
                ) : (
                  <form onSubmit={handleRegisterSubmit} className="space-y-3">
                    <div>
                      <label className="text-xs font-bold text-slate-300 block mb-1">Correo Gmail</label>
                      <input
                        type="email"
                        required
                        placeholder="tu@gmail.com"
                        value={loginEmailInput}
                        onChange={e => { setLoginEmailInput(e.target.value); setModalError(''); }}
                        className="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-xs text-white"
                      />
                    </div>
                    <div>
                      <label className="text-xs font-bold text-slate-300 block mb-1">Confirmar Correo Gmail</label>
                      <input
                        type="email"
                        required
                        placeholder="Repite tu@gmail.com"
                        value={regEmailConfirmInput}
                        onChange={e => { setRegEmailConfirmInput(e.target.value); setModalError(''); }}
                        className="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-xs text-white"
                      />
                    </div>
                    <div>
                      <label className="text-xs font-bold text-slate-300 block mb-1">Nombre de Jugador</label>
                      <input
                        type="text"
                        required
                        placeholder="Ej: ROBER"
                        value={regNombreInput}
                        onChange={e => { setRegNombreInput(e.target.value); setModalError(''); }}
                        className="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-xs text-white uppercase"
                      />
                    </div>
                    <div>
                      <label className="text-xs font-bold text-slate-300 block mb-1">Contraseña</label>
                      <div className="relative">
                        <input
                          type={showPassword ? 'text' : 'password'}
                          required
                          placeholder="••••••••"
                          value={loginPasswordInput}
                          onChange={e => { setLoginPasswordInput(e.target.value); setModalError(''); }}
                          className="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-xs text-white pr-10"
                        />
                        <button
                          type="button"
                          onClick={() => setShowPassword(!showPassword)}
                          className="absolute right-3 top-2.5 text-slate-400 hover:text-white"
                        >
                          {showPassword ? <IconEyeOff /> : <IconEye />}
                        </button>
                      </div>
                    </div>
                    <div>
                      <label className="text-xs font-bold text-slate-300 block mb-1">Confirmar Contraseña</label>
                      <input
                        type={showPassword ? 'text' : 'password'}
                        required
                        placeholder="••••••••"
                        value={regPasswordConfirmInput}
                        onChange={e => { setRegPasswordConfirmInput(e.target.value); setModalError(''); }}
                        className="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-xs text-white"
                      />
                    </div>
                    <button
                      type="submit"
                      disabled={isSubmitting}
                      className="w-full py-3 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 font-bold text-xs text-white rounded-xl shadow transition"
                    >
                      {isSubmitting ? 'Enviando Solicitud...' : 'Enviar Solicitud a SAMU'}
                    </button>
                    <p className="text-center text-xs text-slate-400 pt-1">
                      ¿Ya tienes cuenta?{' '}
                      <button
                        type="button"
                        onClick={() => { setAuthMode('LOGIN'); setModalError(''); }}
                        className="text-emerald-400 font-bold hover:underline"
                      >
                        Inicia sesión
                      </button>
                    </p>
                  </form>
                )}
              </div>
            </div>
          )}

          {showResetModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
              <div className="glass-card rounded-2xl max-w-sm w-full p-6 border border-red-500/30 space-y-4">
                <h3 className="text-lg font-black text-red-400">⚠️ Reiniciar Tabla e Historial</h3>
                <p className="text-xs text-slate-300">Ingresa la contraseña del administrador para autorizar el reinicio global de la tabla e historial.</p>
                
                <form onSubmit={handleResetLeague} className="space-y-3">
                  <input
                    type="password"
                    required
                    placeholder="Contraseña del Administrador (Naruto672)"
                    value={resetPassword}
                    onChange={e => setResetPassword(e.target.value)}
                    className="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-xs text-white"
                  />
                  {resetError && <p className="text-xs text-red-400">{resetError}</p>}
                  <div className="flex gap-2">
                    <button
                      type="button"
                      onClick={() => setShowResetModal(false)}
                      className="flex-1 py-2 bg-slate-800 text-slate-300 font-bold text-xs rounded-xl"
                    >
                      Cancelar
                    </button>
                    <button
                      type="submit"
                      className="flex-1 py-2 bg-red-600 hover:bg-red-500 text-white font-bold text-xs rounded-xl shadow"
                    >
                      Confirmar
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {selectedMatchToDelete && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
              <div className="glass-card rounded-2xl max-w-sm w-full p-6 border border-red-500/30 space-y-4">
                <h3 className="text-lg font-black text-red-400">🗑️ Confirmar Borrado de Partida</h3>
                <p className="text-xs text-slate-300">Ingresa la contraseña del Administrador para confirmar la eliminación.</p>
                
                <form onSubmit={handleConfirmEliminarPartida} className="space-y-3">
                  <input
                    type="password"
                    required
                    placeholder="Contraseña de Administrador (Naruto672)"
                    value={matchDeletePassword}
                    onChange={e => setMatchDeletePassword(e.target.value)}
                    className="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-xs text-white"
                  />
                  {matchDeleteError && <p className="text-xs text-red-400">{matchDeleteError}</p>}
                  <div className="flex gap-2">
                    <button
                      type="button"
                      onClick={() => setSelectedMatchToDelete(null)}
                      className="flex-1 py-2 bg-slate-800 text-slate-300 font-bold text-xs rounded-xl"
                    >
                      Cancelar
                    </button>
                    <button
                      type="submit"
                      className="flex-1 py-2 bg-red-600 hover:bg-red-500 text-white font-bold text-xs rounded-xl shadow"
                    >
                      Eliminar
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          <footer className="border-t border-slate-800/80 bg-slate-950 py-4 text-center text-xs text-slate-500 mb-12 lg:mb-0">
            🎴 Truco League Verified Platform &copy; {new Date().getFullYear()} - Firebase Live Sync - Administrador SAMU
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
