          projectId: "truco-league-cf286",

    // Componente visual para fosforitos/palitos de Truco Argentino (0 a 5 por cajita)
    const FosforosBox = ({ count }) => {
      const c = Math.min(5, Math.max(0, count));
      return (
        <div className="relative w-11 h-11 sm:w-12 sm:h-12 bg-slate-900/90 border border-slate-700/60 rounded-lg flex items-center justify-center p-1 shadow-inner">
          <svg className="w-full h-full text-amber-400 stroke-amber-400" viewBox="0 0 40 40" strokeWidth="3.5" strokeLinecap="round">
            {c >= 1 && <line x1="8" y1="8" x2="32" y2="8" />}
            {c >= 2 && <line x1="32" y1="8" x2="32" y2="32" />}
            {c >= 3 && <line x1="32" y1="32" x2="8" y2="32" />}
            {c >= 4 && <line x1="8" y1="32" x2="8" y2="8" />}
            {c >= 5 && <line x1="8" y1="8" x2="32" y2="32" className="text-emerald-400 stroke-emerald-400" />}
          </svg>
        </div>
      );
    };

    // Anotador de Truco Argentino: contador vertical + tap para sumar.
    const AnotadorTruco = ({ puntos, onChange, label }) => {
      const p = Math.min(30, Math.max(0, Number(puntos) || 0));
      const malas = Math.min(15, p);
      const buenas = p > 15 ? p - 15 : 0;

      const renderBoxes = (pts, tone) => {
        const boxes = [];
        for (let i = 0; i < 3; i++) {
          const valInBox = Math.min(5, Math.max(0, pts - (i * 5)));
          boxes.push(
            <div key={i} className="flex justify-center">
              <FosforosBox count={valInBox} />
            </div>
          );
        }
        return boxes;
      };

      const addPoint = () => onChange(Math.min(30, p + 1));
      const removePoint = () => onChange(Math.max(0, p - 1));

      return (
        <div className="bg-slate-900/90 border border-slate-800 rounded-3xl p-3 sm:p-4 shadow-xl select-none">
          <div className="flex items-center justify-between gap-2 border-b border-slate-800 pb-3">
            <span className="text-xs sm:text-sm font-black text-amber-300 uppercase tracking-wide truncate">{label}</span>
            <span className="text-2xl sm:text-3xl font-black text-emerald-400 leading-none">{p}</span>
          </div>

          <button
            type="button"
            onClick={addPoint}
            disabled={p >= 30}
            className="mt-3 w-full rounded-2xl bg-slate-950/70 border border-slate-800 hover:border-emerald-500/50 active:scale-[0.99] transition p-3 sm:p-4 flex flex-col items-center gap-2 cursor-pointer disabled:cursor-not-allowed"
            title="Tocar para sumar 1 punto"
            aria-label={`Sumar un punto a ${label}`}
          >
            <span className="text-[10px] font-black uppercase tracking-[0.22em] text-slate-500">Tocar para +1</span>
            <div className="w-full flex flex-col items-center gap-2">
              <div className="w-full rounded-xl border border-slate-800 bg-slate-900/70 p-2">
                <span className="block text-[9px] font-black uppercase tracking-wider text-slate-500 text-center mb-2">Malas · {malas}/15</span>
                <div className="flex flex-col gap-2 items-center">{renderBoxes(malas, 'malas')}</div>
              </div>
              <div className="w-full rounded-xl border border-emerald-500/15 bg-emerald-950/10 p-2">
                <span className="block text-[9px] font-black uppercase tracking-wider text-emerald-400 text-center mb-2">Buenas · {buenas}/15</span>
                <div className="flex flex-col gap-2 items-center">{renderBoxes(buenas, 'buenas')}</div>
              </div>
            </div>
          </button>

          <div className="grid grid-cols-2 gap-2 mt-3">
            <button
              type="button"
              onClick={removePoint}
              disabled={p <= 0}
              className="py-3 bg-red-950/40 hover:bg-red-900/60 disabled:opacity-40 text-red-300 border border-red-800/50 font-black text-sm rounded-xl active:scale-95 transition cursor-pointer disabled:cursor-not-allowed"
            >
              − 1
            </button>
            <button
              type="button"
              onClick={addPoint}
              disabled={p >= 30}
              className="py-3 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-40 text-white font-black text-sm rounded-xl shadow-lg active:scale-95 transition cursor-pointer disabled:cursor-not-allowed"
            >
              + 1
            </button>
          </div>
        </div>
      );
    };

    function App() {
      // Usuario con sesión guardada
      const [currentUser, setCurrentUser] = useState(() => {

          const saved = localStorage.getItem('truco_league_user');
          return saved ? JSON.parse(saved) : null;
        } catch (e) {
          return null;
        }
      });

      useEffect(() => {
        if (currentUser) {
          try { localStorage.setItem('truco_league_user', JSON.stringify(currentUser)); } catch (e) {}
        } else {
          try { localStorage.removeItem('truco_league_user'); } catch (e) {}
        }
      }, [currentUser]);

      // Estado de Jugadores y Cuentas
      const [jugadores, setJugadores] = useState(DEFAULT_JUGADORES);
      const [cuentas, setCuentas] = useState(() => {
        try {
          const saved = localStorage.getItem('truco_league_cuentas');
          return saved ? JSON.parse(saved) : INITIAL_ACCOUNTS;
        } catch(e) {
          return INITIAL_ACCOUNTS;
        }
      });

      useEffect(() => {
        try { localStorage.setItem('truco_league_cuentas', JSON.stringify(cuentas)); } catch(e){}
      }, [cuentas]);

      // Estado de Partidas Totales
      const [partidas, setPartidas] = useState(() => {
        try {
          const saved = localStorage.getItem('truco_league_partidas');
          return saved ? JSON.parse(saved) : INITIAL_PARTIDAS;
        } catch(e) {
          return INITIAL_PARTIDAS;
        }
      });

      useEffect(() => {
        try { localStorage.setItem('truco_league_partidas', JSON.stringify(partidas)); } catch(e){}
      }, [partidas]);

      // H2H Numérico Simple: { "PLAYER1:PLAYER2": { p1Wins: N, p2Wins: N, total: N } }
      const [h2hData, setH2hData] = useState(() => {
        try {

          return saved ? JSON.parse(saved) : {};
        } catch(e) {
          return {};
        }
      });

      useEffect(() => {
        try { localStorage.setItem('truco_league_h2h_data', JSON.stringify(h2hData)); } catch(e){}
      }, [h2hData]);

      // Control de Temporadas de 45 días
      const [seasonConfig, setSeasonConfig] = useState(() => {
        try {
          const saved = localStorage.getItem('truco_league_season_config');
          if (saved) return JSON.parse(saved);
        } catch(e) {}
        return {
          seasonNumber: 1,
          startDate: new Date().toISOString(),
          durationDays: SEASON_DAYS
        };
      });

      useEffect(() => {
        try { localStorage.setItem('truco_league_season_config', JSON.stringify(seasonConfig)); } catch(e){}
      }, [seasonConfig]);

      const [auditLogs, setAuditLogs] = useState([]);
      const [nuevoJugador, setNuevoJugador] = useState('');
      const [activeTab, setActiveTab] = useState('ranking');

      // Modo Carga (1v1, 2v2 o 3v3)
      const [modoPartida, setModoPartida] = useState('1v1');
      const [showConfirmLoad, setShowConfirmLoad] = useState(false);

      // 1v1
      const [jugador1, setJugador1] = useState('SAMU');
      const [jugador2, setJugador2] = useState('');
      const [ptsJ1, setPtsJ1] = useState(0);
      const [ptsJ2, setPtsJ2] = useState(0);

      // 2v2
      const [e1j1, setE1j1] = useState('SAMU');
      const [e1j2, setE1j2] = useState('');
      const [e2j1, setE2j1] = useState('');
      const [e2j2, setE2j2] = useState('');
      const [ptsE1, setPtsE1] = useState(0);
      const [ptsE2, setPtsE2] = useState(0);

      // 3v3
      const [t1j1, setT1j1] = useState('SAMU');
      const [t1j2, setT1j2] = useState('');
      const [t1j3, setT1j3] = useState('');
      const [t2j1, setT2j1] = useState('');
      const [t2j2, setT2j2] = useState('');
      const [t2j3, setT2j3] = useState('');
      const [ptsT1, setPtsT1] = useState(0);
      const [ptsT2, setPtsT2] = useState(0);

      // Vista PC/Móvil
      const [deviceMode, setDeviceMode] = useState(() => {
        try { return localStorage.getItem('truco_league_device') || null; } catch (e) { return null; }
      });
      const [showDeviceModal, setShowDeviceModal] = useState(() => !localStorage.getItem('truco_league_device'));

      const handleSelectDevice = (mode) => {
        setDeviceMode(mode);
        try { localStorage.setItem('truco_league_device', mode); } catch (e) {}
        setShowDeviceModal(false);
      };

      // Modales y Respuestas
      const [showLoginModal, setShowLoginModal] = useState(false);
      const [authMode, setAuthMode] = useState('LOGIN');
      const [loginEmailInput, setLoginEmailInput] = useState('');
      const [loginPasswordInput, setLoginPasswordInput] = useState('');

      const [regNombreInput, setRegNombreInput] = useState('');

      const [matchDeletePassword, setMatchDeletePassword] = useState('');
      const [matchDeleteError, setMatchDeleteError] = useState('');

      const [h2hP1, setH2hP1] = useState('SAMU');
      const [h2hP2, setH2hP2] = useState('');

      const [isSubmitting, setIsSubmitting] = useState(false);
      const [mostrarHistorialCompleto, setMostrarHistorialCompleto] = useState(false);

      // Salón de Fama
      const [hofManualTitles, setHofManualTitles] = useState([]);
      const [hofWindowDays, setHofWindowDays] = useState(30);
      const [hofTitlePlayer, setHofTitlePlayer] = useState('');
      const [hofTitleName, setHofTitleName] = useState('');
      const [hofTitleEmoji, setHofTitleEmoji] = useState('🏆');
      const [hofTitleRarity, setHofTitleRarity] = useState('EPICO');
      const [hofTitleNote, setHofTitleNote] = useState('');

      // Cálculo del progreso de la Temporada (45 días)
      const seasonInfo = useMemo(() => {
        const start = new Date(seasonConfig.startDate);
        const now = new Date();
        const diffMs = now.getTime() - start.getTime();
        const elapsedDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
        const currentDay = Math.min(seasonConfig.durationDays, Math.max(1, elapsedDays + 1));
        const daysRemaining = Math.max(0, seasonConfig.durationDays - elapsedDays);
        return {
          number: seasonConfig.seasonNumber,
          currentDay,
          daysRemaining,
          isFinished: elapsedDays >= seasonConfig.durationDays
        };
      }, [seasonConfig]);

      const copyShareableLink = () => {
        const baseUrl = window.location.href.split('?')[0];
        const tempInput = document.createElement('input');
        tempInput.value = baseUrl;
        document.body.appendChild(tempInput);
        tempInput.select();
        document.execCommand('copy');
        document.body.removeChild(tempInput);
        setFeedback('🔗 ¡Link copiado al portapapeles!');
        setTimeout(() => setFeedback(''), 3000);
      };

      // Sincronización en tiempo real con Firebase Firestore
      useEffect(() => {
        const checkDB = setInterval(() => {
          const { db, appId, collection, doc, setDoc, onSnapshot } = window.TrucoDB || {};
          if (!db) return;

          clearInterval(checkDB);

          // Escuchar Jugadores
          const unsubJugadores = onSnapshot(
            collection(db, 'artifacts', appId, 'public', 'data', 'jugadores'), 
            (snapshot) => {
              const list = snapshot.docs.map(d => d.data().nombre);
              if (list.length > 0) {
                setJugadores(Array.from(new Set(list)));
              } else {
                DEFAULT_JUGADORES.forEach(j => {
                  setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'jugadores', j), { nombre: j });
                });
              }
            }, 
            (err) => console.warn("Firestore (jugadores):", err.message)
          );

          // Escuchar Cuentas
          const unsubCuentas = onSnapshot(
            collection(db, 'artifacts', appId, 'public', 'data', 'cuentas'), 
            (snapshot) => {
              const list = snapshot.docs.map(d => d.data());
              if (list.length > 0) {
                setCuentas(list);
              } else {
                const adminDocId = ADMIN_EMAIL.replace(/\./g, '_');
                setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'cuentas', adminDocId), INITIAL_ACCOUNTS[0]);
              }
            }, 
            (err) => console.warn("Firestore (cuentas):", err.message)
          );

          // Escuchar Partidas
          const unsubPartidas = onSnapshot(
            collection(db, 'artifacts', appId, 'public', 'data', 'partidas'), 
            (snapshot) => {
              const list = snapshot.docs.map(d => d.data());
              setPartidas(list);
            }, 
            (err) => console.warn("Firestore (partidas):", err.message)
          );

          // Escuchar H2H Numérico
          const unsubH2H = onSnapshot(
            doc(db, 'artifacts', appId, 'public', 'data', 'h2h_summary', 'main'),
            (snapshot) => {
              if (snapshot.exists()) {
                setH2hData(snapshot.data().pairs || {});
              }
            },
            (err) => console.warn("Firestore (H2H):", err.message)
          );

          // Escuchar Config de Temporada
          const unsubSeason = onSnapshot(
            doc(db, 'artifacts', appId, 'public', 'data', 'season_config', 'main'),
            (snapshot) => {
              if (snapshot.exists()) {
                setSeasonConfig(snapshot.data());
              }
            },
            (err) => console.warn("Firestore (Season):", err.message)
          );

          // Escuchar Log de Auditoría
          const unsubAudit = onSnapshot(
            collection(db, 'artifacts', appId, 'public', 'data', 'auditLogs'),
            (snapshot) => {
              const list = snapshot.docs.map(d => d.data()).sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0));
              setAuditLogs(list);
            },
            (err) => console.warn("Firestore (auditLogs):", err.message)
          );

          // Escuchar títulos manuales del Salón de Fama
          const unsubHofTitles = onSnapshot(
            collection(db, 'artifacts', appId, 'public', 'data', 'hallOfFameTitles'),
            (snapshot) => {
              setHofManualTitles(snapshot.docs.map(d => ({ id: d.id, ...d.data() }))
                .sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0)));
            },

      const updateNumericH2H = useCallback((p1Name, p2Name, isWinnerP1, currentH2HMap) => {
        if (!p1Name || !p2Name || p1Name === p2Name) return currentH2HMap;
        
        // Clave única alfabética (ej. "CARLOS:SAMU")
        const [pA, pB] = [p1Name, p2Name].sort();
        const pairKey = `${pA}:${pB}`;
        
        const existing = currentH2HMap[pairKey] || { p1Wins: 0, p2Wins: 0, total: 0 };
        const updated = { ...existing, total: existing.total + 1 };

        if (pA === p1Name) {
          if (isWinnerP1) updated.p1Wins += 1;
          else updated.p2Wins += 1;
        } else {
          if (isWinnerP1) updated.p2Wins += 1;
          else updated.p1Wins += 1;
        }

        const newMap = { ...currentH2HMap, [pairKey]: updated };

        // Guardar en Firebase de forma asíncrona
        try {
          const { db, appId, setDoc, doc } = window.TrucoDB || {};
          if (db) {
            setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'h2h_summary', 'main'), { pairs: newMap }, { merge: true });
          }
        } catch (e) {}

        return newMap;

        const stats = {};
        jugadores.forEach(j => {

        });

        approvedPartidas.forEach(p => {
          const ganadoresList = p.ganadores || (p.ganador ? [p.ganador] : []);
          const perdedoresList = p.perdedores || (p.perdedor ? [p.perdedor] : []);
          const ptsPremio = p.puntosGanadorPorJugador || (p.tipo === '2v2' ? 2 : 1);

          ganadoresList.forEach(g => {
            if (stats[g]) {
              stats[g].puntos += ptsPremio;
              stats[g].ganadas += 1;
              stats[g].ptsVentaja += Number(p.ventaja || 0);
            }
          });

          perdedoresList.forEach(l => {
            if (stats[l]) {
              stats[l].perdidas += 1;
            }
          });
        });

        return Object.values(stats).map(p => {
          const pj = p.ganadas + p.perdidas;
          const wrRaw = pj > 0 ? (p.ganadas / pj) : 0;
          const wrPct = Math.round(wrRaw * 100);
          const kdaVal = pj > 0 ? ((p.puntos / pj) + (p.ptsVentaja / 100)) : 0;
          const kdaFormatted = Number(kdaVal).toFixed(2);

          return { ...p, pj, wrPct, kda: Number(kdaFormatted) };

        document.body.removeChild(link);

      // Consulta O(1) ultra-rápida del H2H Numérico
      const getH2HNumericStats = (playerA, playerB) => {
        if (!playerA || !playerB || playerA === playerB) return { winsA: 0, winsB: 0, total: 0 };
        const [pMin, pMax] = [playerA, playerB].sort();
        const pairKey = `${pMin}:${pMax}`;
        const record = h2hData[pairKey];

        if (!record) return { winsA: 0, winsB: 0, total: 0 };

        if (pMin === playerA) {
          return { winsA: record.p1Wins || 0, winsB: record.p2Wins || 0, total: record.total || 0 };
        } else {
          return { winsA: record.p2Wins || 0, winsB: record.p1Wins || 0, total: record.total || 0 };
        }
      };

      // ===================== SALÓN DE FAMA =====================
      const HOF_TEST_PLAYER = 'TEST';
      const hofDateValue = (p) => {
        const raw = p.fechaIso || p.timestamp || p.fecha || '';
        const d = new Date(raw);
        return Number.isNaN(d.getTime()) ? 0 : d.getTime();
      };

      const hofParticipants = (p) => ({
        winners: p.ganadores || (p.ganador ? [p.ganador] : []),
        losers: p.perdedores || (p.perdedor ? [p.perdedor] : [])
      });

      const hofIsRealPlayer = (name) => String(name || '').trim().toUpperCase() !== HOF_TEST_PLAYER;
      const hofIsRealGame = (p) => {
        const { winners, losers } = hofParticipants(p);
        return [...winners, ...losers].every(hofIsRealPlayer);
      };

      const hofData = useMemo(() => {
        // TEST queda completamente fuera del Salón de Fama.
        const games = [...approvedPartidas].filter(hofIsRealGame).sort((a,b) => hofDateValue(a) - hofDateValue(b));
        const cutoff = Date.now() - (hofWindowDays * 24 * 60 * 60 * 1000);
        const recent = games.filter(p => hofDateValue(p) >= cutoff);

        const eligible = rankingData.filter(r => r.nombre !== HOF_TEST_PLAYER && r.pj >= 20);
        const wrKing = eligible.length ? [...eligible].sort((a,b) => (b.wrPct-a.wrPct) || (b.puntos-a.puntos))[0] : null;

        // 30-0 / 0-30 es HUMILLACIÓN y NO entra en Palizas legendarias.
        const humillaciones = games.map(p => ({
          ...p,
          displayDate: p.fecha || p.fechaIso || '—'
        })).filter(p => Number(p.ptsGanador || 0) === 30 && Number(p.ptsPerdedor || 0) === 0)
          .sort((a,b) => hofDateValue(b)-hofDateValue(a));

        const blowouts = games.map(p => ({
          ...p,
          diff: Math.abs(Number(p.ptsGanador || 0) - Number(p.ptsPerdedor || 0)),
          displayDate: p.fecha || p.fechaIso || '—'
        })).filter(p => p.diff > 0 && !(Number(p.ptsGanador || 0) === 30 && Number(p.ptsPerdedor || 0) === 0))
          .sort((a,b) => b.diff-a.diff || hofDateValue(b)-hofDateValue(a)).slice(0,5);

        const lossRun = {};
        let perroGrupo = null;
        games.forEach(p => {
          const {winners, losers} = hofParticipants(p);
          winners.forEach(w => { lossRun[w]=0; });
          losers.forEach(l => {
            lossRun[l]=(lossRun[l]||0)+1;
            if (!perroGrupo || lossRun[l] > perroGrupo.streak) perroGrupo={jugador:l,streak:lossRun[l]};
          });
        });

        // Rivalidades: SOLO 1vs1 (sin 2vs2 ni 3vs3).
        const rivalryPairs = {};
        recent.filter(p => p.tipo === '1v1').forEach(p => {
          const {winners, losers}=hofParticipants(p);
          winners.forEach(w=>losers.forEach(l=>{
            const key=[w,l].sort().join(':');
            rivalryPairs[key]=(rivalryPairs[key]||0)+1;
          }));
        });
        const rivalry = Object.entries(rivalryPairs).sort((a,b)=>b[1]-a[1])[0] || null;

        const currentStreaks = {};
        const pairRun = {};
        const pairBest = {};
        const allRun = {};
        let cutRacha = null;

        games.forEach(p => {
          const { winners, losers } = hofParticipants(p);
          winners.forEach(w => {
            currentStreaks[w] = (currentStreaks[w] || 0) + 1;
            allRun[w] = (allRun[w] || 0) + 1;
            losers.forEach(l => {
              const key = `${w}|${l}`;
              pairRun[key] = (pairRun[key] || 0) + 1;
              pairBest[key] = Math.max(pairBest[key] || 0, pairRun[key]);
              const victimRun = allRun[l] || 0;
              if (victimRun >= 5 && (!cutRacha || hofDateValue(p) > hofDateValue(cutRacha.partida))) {
                cutRacha = { winner:w, victim:l, brokenStreak:victimRun, partida:p };
              }
            });
          });
          losers.forEach(l => {
            currentStreaks[l] = 0;
            allRun[l] = 0;
            winners.forEach(w => { pairRun[`${w}|${l}`] = 0; });
          });
        });

        const currentStreak = Object.entries(currentStreaks)
          .map(([nombre, streak]) => ({nombre, streak}))
          .filter(x => x.streak > 0)
          .sort((a,b)=>b.streak-a.streak)[0] || null;

        let fatherSon = null;
        Object.entries(pairBest).forEach(([key, count]) => {
          if (count < 5) return;
          const [father, son] = key.split('|');
          if (!fatherSon || count > fatherSon.count) fatherSon = {father, son, count};
        });

        // MEJOR JUGADOR en los últimos X días. Solo jugadores reales, mínimo 5 PJ.
        const recentStats = {};
        recent.forEach(p => {
          const { winners, losers } = hofParticipants(p);
          winners.forEach(w => { recentStats[w] = recentStats[w] || {g:0,l:0}; recentStats[w].g++; });
          losers.forEach(l => { recentStats[l] = recentStats[l] || {g:0,l:0}; recentStats[l].l++; });
        });
        const recentKing = Object.entries(recentStats)
          .filter(([nombre]) => nombre !== HOF_TEST_PLAYER)
          .map(([nombre,v]) => ({nombre, ...v, pj:v.g+v.l, wr:(v.g+v.l)?Math.round(v.g/(v.g+v.l)*100):0}))
          .filter(x=>x.pj>=5)
          .sort((a,b)=>b.wr-a.wr || b.g-a.g)[0] || null;

        const topOne = rankingData.find(r => r.nombre !== HOF_TEST_PLAYER && r.pj > 0)?.nombre || null;
        let fallOfKing = null;
        if (topOne) {
          for (let i=games.length-1;i>=0;i--) {
            const {winners, losers}=hofParticipants(games[i]);
            if (losers.includes(topOne) && winners.length) { fallOfKing={winner:winners[0], king:topOne, partida:games[i]}; break; }
          }
        }

        // El Mejor Dúo = pareja de 2vs2 con más victorias. TEST queda fuera.
        const duoWins = {};
        games.filter(p => p.tipo === '2v2').forEach(p => {
          const { winners } = hofParticipants(p);
          if (winners.length !== 2 || winners.some(w => !hofIsRealPlayer(w))) return;
          const duoKey = [...winners].sort().join(' & ');
          duoWins[duoKey] = (duoWins[duoKey] || 0) + 1;
        });
        const bestDuo = Object.entries(duoWins).sort((a,b)=>b[1]-a[1])[0] || null;

        // Logros: solo jugadores reales y sin TEST.
        const achievements = {};
        rankingData.filter(r => r.nombre !== HOF_TEST_PLAYER).forEach(r => {
          const arr=[];
          if (r.ganadas>=10) arr.push({name:'10 partidas ganadas',emoji:'🔟',rarity:'RARO'});
          if (r.puntos>=100) arr.push({name:'100 puntos acumulados',emoji:'💯',rarity:'EPICO'});
          achievements[r.nombre]=arr;
        });

        return {wrKing, humillaciones, blowouts, perroGrupo, rivalry, currentStreak, fatherSon, recentKing, cutRacha, fallOfKing, bestDuo, achievements};
      }, [approvedPartidas, rankingData, hofWindowDays]);

      const rarityMeta = {
        COMUN:{label:'Común',icon:'⚪',cls:'border-slate-500/40 bg-slate-700/20 text-slate-300'},
        RARO:{label:'Raro',icon:'🔵',cls:'border-blue-500/40 bg-blue-950/30 text-blue-300'},
        EPICO:{label:'Épico',icon:'🟣',cls:'border-purple-500/40 bg-purple-950/30 text-purple-300'},
        LEGENDARIO:{label:'Legendario',icon:'🟡',cls:'border-amber-400/60 bg-amber-500/10 text-amber-300'}
      };

      const hofAddManualTitle = async (e) => {
        e.preventDefault();
        if (!currentUser?.isAdmin || !hofTitlePlayer || !hofIsRealPlayer(hofTitlePlayer) || !hofTitleName.trim()) return;
        const id = `hof_${Date.now()}_${Math.random().toString(36).slice(2,7)}`;
        const title = {id, jugador:hofTitlePlayer, titulo:hofTitleName.trim(), emoji:hofTitleEmoji || '🏆', rareza:hofTitleRarity, nota:hofTitleNote.trim(), manual:true, fecha:getTodayDateString(), timestamp:Date.now()};
        try {
          const {db,appId,setDoc,doc}=window.TrucoDB||{};
          if (!db) throw new Error('Firebase no disponible');
          await setDoc(doc(db,'artifacts',appId,'public','data','hallOfFameTitles',id),title);
          const log={id:`audit_${id}`,email:currentUser.email,jugadorNombre:currentUser.jugadorNombre,fecha:new Date().toLocaleString('es-AR'),timestamp:Date.now(),role:'ADMIN',tipo:'HOF_TITLE',accion:'AGREGÓ TÍTULO',detalle:`${hofTitlePlayer} → ${hofTitleName.trim()}`};
          await setDoc(doc(db,'artifacts',appId,'public','data','auditLogs',log.id),log);
          setHofTitleName(''); setHofTitleNote('');
          setFeedback('🏆 Título agregado al Salón de Fama.'); setTimeout(()=>setFeedback(''),3000);
        } catch(err) { console.error(err); setFeedback('❌ No se pudo guardar el título.'); setTimeout(()=>setFeedback(''),3000); }
      };

      const hofDeleteManualTitle = async (title) => {
        if (!currentUser?.isAdmin) return;
        try {
          const {db,appId,deleteDoc,doc,setDoc}=window.TrucoDB||{};
          if (!db) return;
          await deleteDoc(doc(db,'artifacts',appId,'public','data','hallOfFameTitles',title.id));
          const log={id:`audit_del_${Date.now()}`,email:currentUser.email,jugadorNombre:currentUser.jugadorNombre,fecha:new Date().toLocaleString('es-AR'),timestamp:Date.now(),role:'ADMIN',tipo:'HOF_TITLE',accion:'QUITÓ TÍTULO',detalle:`${title.jugador} → ${title.titulo}`};
          await setDoc(doc(db,'artifacts',appId,'public','data','auditLogs',log.id),log);
        } catch(err) { console.error(err); }
      };

      // Guarda el cambio de Mejor Jugador para el historial visual.
      useEffect(() => {
        const currentKing = hofData.recentKing?.nombre;
        if (!currentKing) return;
        const storageKey = `truco_league_hof_king_${hofWindowDays}`;
        let previous = null;
        try { previous = localStorage.getItem(storageKey); } catch(e) {}
        if (previous === currentKing) return;
        try { localStorage.setItem(storageKey, currentKing); } catch(e) {}
        if (!previous || previous === currentKing) return;
        const {db,appId,setDoc,doc}=window.TrucoDB||{};
        if (db) {
          const log={id:`hof_king_${hofWindowDays}_${Date.now()}`,email:'system',jugadorNombre:'TRUCO LEAGUE',fecha:new Date().toLocaleString('es-AR'),timestamp:Date.now(),role:'SYSTEM',tipo:'HOF_TITLE',accion:'CAMBIO DE MEJOR JUGADOR',detalle:`Antes ${previous} era el Mejor Jugador 🏆 · Ahora ${currentKing} tomó el trono`};
          setDoc(doc(db,'artifacts',appId,'public','data','auditLogs',log.id),log).catch(()=>{});
        }
      }, [hofData.recentKing?.nombre, hofWindowDays]);

      const currentH2H = useMemo(() => {
        return getH2HNumericStats(h2hP1, h2hP2);
      }, [h2hData, h2hP1, h2hP2]);

      const hofRivalryPairsForUI = useMemo(() => {
        const map = {};
        approvedPartidas.filter(p => p.tipo === '1v1' && hofIsRealGame(p)).forEach(p => {
          const { winners, losers } = hofParticipants(p);
          winners.forEach(w => losers.forEach(l => {
            const key = [w,l].sort().join(':');
            map[key] = (map[key] || 0) + 1;
          }));
        });
        return map;
      }, [approvedPartidas]);

      return (
        <div className={`min-h-screen flex flex-col bg-slate-950 text-slate-100 ${deviceMode === 'pc' ? 'pb-6' : 'pb-20 lg:pb-0'}`}>
          
          {/* Header principal */}
          <header className="bg-slate-900/90 border-b border-slate-800 sticky top-0 z-40 backdrop-blur-md">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              
              <div className="flex items-center space-x-3">
                <span className="text-3xl">🎴</span>
                <div>
                  <h1 className="font-extrabold text-xl tracking-tight bg-gradient-to-r from-emerald-400 via-teal-300 to-emerald-500 bg-clip-text text-transparent flex items-center gap-2">
                    TRUCO LEAGUE
                    <span className="inline-flex items-center gap-1 text-[10px] font-bold bg-amber-500/20 text-amber-400 border border-amber-500/40 px-2 py-0.5 rounded-full">
                      T{seasonInfo.number} • Día {seasonInfo.currentDay}/{SEASON_DAYS}
                    </span>
                  </h1>
                  <p className="text-xs text-slate-400 font-medium flex items-center gap-1">
                    <IconShield /> Admin SAMU
                  </p>
                </div>
              </div>

              {/* Menú de navegación desktop */}
              <nav className={`${deviceMode === 'pc' ? 'flex' : deviceMode === 'mobile' ? 'hidden' : 'hidden lg:flex'} space-x-1 bg-slate-800/60 p-1 rounded-xl border border-slate-700/50 overflow-x-auto`}>
                <button
                  onClick={() => setActiveTab('ranking')}
                  className={`px-3 py-1.5 text-xs font-semibold rounded-lg transition-all ${
                    activeTab === 'ranking' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400 hover:text-white'
                  }`}
                >
                  🏆 Posiciones
                </button>
                <button
                  onClick={() => setActiveTab('cargar')}
                  className={`px-3 py-1.5 text-xs font-semibold rounded-lg transition-all ${
                    activeTab === 'cargar' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400 hover:text-white'
                  }`}
                >
                  ⚡ Jugar / Cargar
                </button>
                <button
                  onClick={() => setActiveTab('aprobaciones')}
                  className={`px-3 py-1.5 text-xs font-semibold rounded-lg transition-all flex items-center gap-1.5 ${
                    activeTab === 'aprobaciones' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400 hover:text-white'
                  }`}
                >
                  ⏳ Permisos ({pendingPartidas.length})
                </button>
                {currentUser?.isAdmin && (
                  <button
                    onClick={() => setActiveTab('cuentas')}
                    className={`px-3 py-1.5 text-xs font-semibold rounded-lg transition-all bg-amber-500/10 text-amber-300 border border-amber-500/30 ${
                      activeTab === 'cuentas' ? 'bg-amber-600 text-white' : ''
                    }`}
                  >
                    👑 Solicitudes ({pendingCuentas.length})
                  </button>
                )}
                <button
                  onClick={() => setActiveTab('historial')}
                  className={`px-3 py-1.5 text-xs font-semibold rounded-lg transition-all ${
                    activeTab === 'historial' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400 hover:text-white'
                  }`}
                >
                  📜 Hoy ({partidasDeHoy.length})
                </button>
                <button
                  onClick={() => setActiveTab('salon')}
                  className={`px-3 py-1.5 text-xs font-semibold rounded-lg transition-all ${
                    activeTab === 'salon' ? 'bg-amber-600 text-white shadow' : 'text-slate-400 hover:text-white'
                  }`}
                >
                  🏛️ Salón de Fama
                </button>
                <button
                  onClick={() => setActiveTab('h2h')}
                  className={`px-3 py-1.5 text-xs font-semibold rounded-lg transition-all ${
                    activeTab === 'h2h' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400 hover:text-white'
                  }`}
                >
                  ⚔️ H2H (O1)
                </button>
                {currentUser && (
                  <button
                    onClick={() => setActiveTab('perfil')}
                    className={`px-3 py-1.5 text-xs font-semibold rounded-lg transition-all ${
                      activeTab === 'perfil' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400 hover:text-white'
                    }`}
                  >
                    👤 Perfil
                  </button>
                )}
                {currentUser?.isAdmin && (
                  <button
                    onClick={() => setActiveTab('auditoria')}
                    className={`px-3 py-1.5 text-xs font-semibold rounded-lg transition-all border border-purple-500/30 ${
                      activeTab === 'auditoria' ? 'bg-purple-700 text-white shadow' : 'text-purple-300 hover:text-white'
                    }`}
                  >
                    📋 Accesos
                  </button>
                )}
              </nav>

              <div className="flex items-center gap-2 sm:gap-3">
                <button
                  onClick={() => setShowDeviceModal(true)}
                  className="px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 rounded-xl border border-slate-700 font-bold transition flex items-center gap-1 shadow-sm"
                  title="Cambiar vista PC / Móvil"
                >
                  {deviceMode === 'pc' ? '💻 PC' : deviceMode === 'mobile' ? '📱 Móvil' : '⚙️ Vista'}
                </button>

                {currentUser ? (
                  <div className="flex items-center gap-2 bg-slate-800/80 border border-slate-700/80 rounded-xl px-3 py-1.5 text-xs">
                    <div className="text-right">
                      <p className="font-bold text-white flex items-center justify-end gap-1">
                        {currentUser.isAdmin ? (
                          <span className="bg-amber-500/20 text-amber-300 text-[10px] px-1.5 py-0.5 rounded border border-amber-500/40">ADMIN SAMU 👑</span>

                    </div>
                    <button

                ) : (
                  <button

                <button

                  title="Copiar enlace"
                >
                  🔗 Link
                </button>
              </div>
            </div>
          </header>

          {/* Cuerpo principal */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
            
            {/* Banner Informativo de Temporada de 45 días */}

              <div className="flex items-center gap-3">
                <span className="text-2xl">🏆</span>
                <div>
                  <h3 className="text-sm font-extrabold text-amber-300">

            {feedback && (

            {/* TABLA DE POSICIONES */}
            {activeTab === 'ranking' && (
              <div className="space-y-4">
                <div className="flex justify-between items-center flex-wrap gap-2">

                    <h2 className="text-2xl font-extrabold text-white flex items-center gap-2">

                  </div>

                  {currentUser?.isAdmin && (
                    <button
                      onClick={() => { setShowResetModal(true); setResetError(''); setResetPassword(''); }}
                      className="px-3 py-1.5 text-xs font-bold text-red-400 hover:text-red-300 bg-red-950/40 hover:bg-red-900/60 border border-red-800/50 rounded-xl transition-all flex items-center gap-1.5 cursor-pointer shadow-sm"
                    >

                    </button>
                  )}
                </div>

                <div className="glass-card rounded-2xl overflow-hidden border border-slate-800 shadow-xl">
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-sm text-slate-300">
                      <thead className="bg-slate-900/90 text-xs uppercase tracking-wider text-slate-400 border-b border-slate-800">
                        <tr>

                      </thead>
                      <tbody className="divide-y divide-slate-800/60">
                        {rankingData.map((row, idx) => {
                          const isTop1 = idx === 0 && row.puntos > 0;
                          const isTop2 = idx === 1 && row.puntos > 0;
                          const isTop3 = idx === 2 && row.puntos > 0;

                          return (
                            <tr key={row.nombre} className={`hover:bg-slate-800/40 transition-colors ${isTop1 ? 'bg-amber-500/10 font-medium' : ''}`}>
                              <td className="py-3 px-3 text-center font-bold">

                  onClick={() => setActiveTab('perfil')}
                  className={`flex flex-col items-center justify-center py-1 px-2 rounded-xl transition ${
                    activeTab === 'perfil' ? 'text-emerald-400 font-bold scale-105' : 'text-slate-400'
                  }`}
                >
                  <span className="text-xl">👤</span>
                  <span className="text-[10px] tracking-tight mt-0.5">Perfil</span>
                </button>
              ) : (
                <button
                  onClick={() => { setAuthMode('LOGIN'); setModalError(''); setShowLoginModal(true); }}
                  className="flex flex-col items-center justify-center py-1 px-2 text-emerald-400"
                >
                  <span className="text-xl">🔑</span>
                  <span className="text-[10px] font-bold mt-0.5">Ingresar</span>
                </button>
              )}
            </div>
          )}

          {/* Modal Modo Dispositivo */}
          {showDeviceModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-md p-4">
              <div className="glass-card rounded-2xl p-6 max-w-sm w-full text-center space-y-4 border border-slate-800 shadow-2xl">
                <span className="text-4xl">📱💻</span>
                <h3 className="text-lg font-extrabold text-white">Selecciona tu Modo de Vista</h3>
                <p className="text-xs text-slate-400">Puedes cambiar entre menú superior de PC o barra flotante móvil en cualquier momento.</p>
                <div className="grid grid-cols-2 gap-3 pt-2">
                  <button
                    onClick={() => handleSelectDevice('pc')}
                    className="py-3 bg-slate-800 hover:bg-slate-700 font-bold text-xs text-white rounded-xl border border-slate-700 transition"
                  >
                    💻 Modo PC
                  </button>
                  <button
                    onClick={() => handleSelectDevice('mobile')}
                    className="py-3 bg-emerald-600 hover:bg-emerald-500 font-bold text-xs text-white rounded-xl shadow transition"
                  >
                    📱 Modo Móvil
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Modal Login / Registro */}
          {showLoginModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
              <div className="glass-card rounded-2xl p-6 max-w-md w-full border border-slate-800 shadow-2xl space-y-4">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h3 className="text-lg font-extrabold text-white">
                    {authMode === 'LOGIN' ? '🔑 Ingresar a la Liga' : '📝 Solicitar Registro'}
                  </h3>
                  <button onClick={() => setShowLoginModal(false)} className="text-slate-400 hover:text-white font-bold text-sm p-1">
                    ✕
                  </button>
                </div>

                {modalError && (
                  <div className="bg-red-950/80 border border-red-800/60 text-red-200 text-xs p-3 rounded-xl">
                    {modalError}
                  </div>
                )}

                {authMode === 'LOGIN' ? (
                  <form onSubmit={handleLoginSubmit} className="space-y-4">
                    <div>
                      <label className="text-xs font-bold text-slate-300 block mb-1">Correo Electrónico</label>
                      <input
                        type="email"
                        placeholder="tuemail@ejemplo.com"
                        value={loginEmailInput}
                        onChange={e => setLoginEmailInput(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-emerald-500"
                      />
                    </div>

                    <div>
                      <label className="text-xs font-bold text-slate-300 block mb-1">Contraseña</label>
                      <input
                        type="password"
                        placeholder="••••••••"
                        value={loginPasswordInput}
                        onChange={e => setLoginPasswordInput(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-emerald-500"
                      />
                    </div>

                    <button
                      type="submit"
                      disabled={isSubmitting}
                      className="w-full py-3 bg-emerald-600 hover:bg-emerald-500 font-extrabold text-xs text-white rounded-xl shadow transition"
                    >
                      {isSubmitting ? 'Iniciando...' : 'Iniciar Sesión'}
                    </button>

                    <div className="text-center pt-2">
                      <button
                        type="button"
                        onClick={() => { setAuthMode('REGISTER'); setModalError(''); }}
                        className="text-xs font-bold text-emerald-400 hover:underline"
                      >
                        ¿No tienes cuenta? Solicita tu registro aquí
                      </button>
                    </div>
                  </form>
                ) : (
                  <form onSubmit={handleRegisterSubmit} className="space-y-3">
                    <div>
                      <label className="text-xs font-bold text-slate-300 block mb-1">Nombre de Jugador</label>
                      <input
                        type="text"
                        placeholder="EJ: CARLOS"
                        value={regNombreInput}
                        onChange={e => setRegNombreInput(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-xs text-white uppercase focus:outline-none focus:border-emerald-500"
                      />
                    </div>

                    <div>
                      <label className="text-xs font-bold text-slate-300 block mb-1">Correo Electrónico</label>
                      <input
                        type="email"
                        placeholder="correo@ejemplo.com"
                        value={loginEmailInput}
                        onChange={e => setLoginEmailInput(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-emerald-500"
                      />
                    </div>

                    <div>
                      <label className="text-xs font-bold text-slate-300 block mb-1">Confirmar Correo</label>
                      <input
                        type="email"
                        placeholder="correo@ejemplo.com"
                        value={regEmailConfirmInput}
                        onChange={e => setRegEmailConfirmInput(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-emerald-500"
                      />
                    </div>

                    <div>
                      <label className="text-xs font-bold text-slate-300 block mb-1">Contraseña</label>
                      <input
                        type="password"
                        placeholder="••••••••"
                        value={loginPasswordInput}
                        onChange={e => setLoginPasswordInput(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-emerald-500"
                      />
                    </div>

                    <div>
                      <label className="text-xs font-bold text-slate-300 block mb-1">Confirmar Contraseña</label>
                      <input
                        type="password"
                        placeholder="••••••••"
                        value={regPasswordConfirmInput}
                        onChange={e => setRegPasswordConfirmInput(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-emerald-500"
                      />
                    </div>

                    <button
                      type="submit"
                      disabled={isSubmitting}
                      className="w-full py-3 bg-emerald-600 hover:bg-emerald-500 font-extrabold text-xs text-white rounded-xl shadow transition mt-2"
                    >
                      {isSubmitting ? 'Enviando...' : 'Enviar Solicitud a SAMU'}
                    </button>

                    <div className="text-center pt-1">
                      <button
                        type="button"
                        onClick={() => { setAuthMode('LOGIN'); setModalError(''); }}
                        className="text-xs font-bold text-slate-400 hover:underline"
                      >
                        ¿Ya tienes cuenta? Ingresar
                      </button>
                    </div>
                  </form>
                )}
              </div>
            </div>
          )}

          {/* Modal Confirmar Carga */}
          {showConfirmLoad && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-md p-4">
              <div className="glass-card rounded-2xl p-6 max-w-md w-full border border-amber-500/30 shadow-2xl space-y-4">
                <div className="flex items-center gap-3">
                  <span className="text-4xl">⚠️</span>
                  <div>
                    <h3 className="text-lg font-extrabold text-white">Confirmar carga de partida</h3>
                    <p className="text-xs text-slate-400 mt-1">Una vez confirmada, se enviará la partida {modoPartida} y no se volverá a preguntar.</p>
                  </div>
                </div>
                <div className="bg-slate-900/80 border border-slate-800 rounded-xl p-4 text-center">
                  <p className="text-sm font-black text-amber-300 uppercase">{modoPartida}</p>
                  <p className="text-xs text-slate-300 mt-1">Revisa jugadores y marcador antes de confirmar.</p>
                </div>
                <div className="flex gap-2">
                  <button type="button" onClick={()=>setShowConfirmLoad(false)} className="flex-1 py-2.5 bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-300 rounded-xl">Cancelar</button>
                  <button type="button" onClick={confirmarCargaPartida} disabled={isSubmitting} className="flex-1 py-2.5 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-xs font-black text-white rounded-xl shadow">✅ Confirmar</button>
                </div>
              </div>
            </div>
          )}

          {/* Modal Reinicio por Admin */}
          {showResetModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
              <div className="glass-card rounded-2xl p-6 max-w-md w-full border border-red-800/50 shadow-2xl space-y-4">
                <h3 className="text-lg font-extrabold text-red-400">⚠️ Reiniciar Tabla / Temporada</h3>
                <p className="text-xs text-slate-300">
                  Esta acción reiniciará las partidas, la tabla de clasificación y dará inicio a la siguiente temporada.
                </p>

                {resetError && <p className="text-xs text-red-400 font-bold">{resetError}</p>}

                <form onSubmit={handleResetLeague} className="space-y-4">
                  <input
                    type="password"
                    placeholder="Contraseña del Admin SAMU"
                    value={resetPassword}
                    onChange={e => setResetPassword(e.target.value)}
                    className="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-xs text-white focus:border-red-500"
                  />
                  <div className="flex gap-2">
                    <button
                      type="button"
                      onClick={() => setShowResetModal(false)}
                      className="flex-1 py-2.5 bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-300 rounded-xl"
                    >
                      Cancelar
                    </button>
                    <button
                      type="submit"
                      className="flex-1 py-2.5 bg-red-600 hover:bg-red-500 text-xs font-bold text-white rounded-xl shadow"
                    >
                      Confirmar Reinicio
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Modal Eliminar Partida */}
          {selectedMatchToDelete && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
              <div className="glass-card rounded-2xl p-6 max-w-md w-full border border-red-800/50 shadow-2xl space-y-4">
                <h3 className="text-lg font-extrabold text-red-400">🗑️ Eliminar Partida</h3>
                <p className="text-xs text-slate-300">Ingresa la contraseña de administrador para confirmar la eliminación de este partido.</p>

                {matchDeleteError && <p className="text-xs text-red-400 font-bold">{matchDeleteError}</p>}

                <form onSubmit={handleConfirmEliminarPartida} className="space-y-4">
                  <input
                    type="password"
                    placeholder="Contraseña de Admin"
                    value={matchDeletePassword}
                    onChange={e => setMatchDeletePassword(e.target.value)}
                    className="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-xs text-white"
                  />
                  <div className="flex gap-2">
                    <button
                      type="button"
                      onClick={() => setSelectedMatchToDelete(null)}
                      className="flex-1 py-2.5 bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-300 rounded-xl"
                    >
                      Cancelar
                    </button>
                    <button
                      type="submit"
                      className="flex-1 py-2.5 bg-red-600 hover:bg-red-500 text-xs font-bold text-white rounded-xl shadow"
                    >
                      Eliminar Partida
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
