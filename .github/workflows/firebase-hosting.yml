name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main # Cambia 'main' por 'master' si tu rama principal se llama master

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' # Debe coincidir con el nombre del secreto creado en el Paso 2
          channelId: live
          projectId: ID_DE_TU_PROYECTO_FIREBASE # Reemplaza esto por el ID real de tu proyecto en Firebase
